include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - tools/windows_updater/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    avoid_print: true
    use_build_context_synchronously: true
