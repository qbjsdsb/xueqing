name: Fix management multi-assignment v0.2.1

on:
  push:
    branches:
      - ux/management-student-centered-v021

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply multi-assignment fix
        run: python3 tool/fix_management_multi_assignment_v021.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/organization_management/presentation/organization_management_rows.dart test/features/organization_management_test.dart test/features/management_workflow_clarity_contract_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated product changes
        run: |
          rm -f tool/fix_management_multi_assignment_v021.py .github/workflows/fix-management-multi-assignment-v021.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: preserve every active student teacher assignment"
          git push origin HEAD:ux/management-student-centered-v021
