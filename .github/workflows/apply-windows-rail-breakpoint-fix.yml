name: Apply Windows rail breakpoint fix

on:
  push:
    branches:
      - ux/windows-organization-navigation-v2
    paths:
      - .xueqing-fix-windows-rail-breakpoint.py
      - .github/workflows/apply-windows-rail-breakpoint-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply breakpoint fix
        run: python3 .xueqing-fix-windows-rail-breakpoint.py

      - name: Remove one-shot assets
        run: |
          rm -f \
            .xueqing-fix-windows-rail-breakpoint.py \
            .github/workflows/apply-windows-rail-breakpoint-fix.yml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format lib/features/design_v2/v2_workspace_preview.dart test/features/windows_workspace_acceptance_matrix_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused Windows acceptance
        run: |
          flutter test \
            test/features/windows_workspace_acceptance_matrix_test.dart \
            test/features/windows_organization_navigation_contract_test.dart \
            test/features/v2_organization_workspace_test.dart \
            test/features/v2_adaptive_workspace_test.dart \
            test/features/v2_typed_organization_navigation_test.dart

      - name: Full suite
        run: flutter test

      - name: Commit verified fix
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(windows): derive rail breakpoint from layout constraints"
          git push origin HEAD:ux/windows-organization-navigation-v2
