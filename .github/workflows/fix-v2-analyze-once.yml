name: Fix V2 analyze once

on:
  push:
    paths:
      - '.github/workflows/fix-v2-analyze-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-prototype-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply scoped V2 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/design_v2/v2_workspace_preview.dart')
          text = path.read_text()
          text = text.replace('Icons.add_note_outlined', 'Icons.note_add_outlined')
          text = text.replace('.withOpacity(0.07)', '.withValues(alpha: 0.07)')
          text = text.replace('.withOpacity(0.72)', '.withValues(alpha: 0.72)')
          text = text.replace('.withOpacity(0.5)', '.withValues(alpha: 0.5)')
          text = text.replace('.withOpacity(0.7)', '.withValues(alpha: 0.7)')
          path.write_text(text)
          PY
          dart format lib/features/design_v2/v2_workspace_preview.dart
          flutter analyze lib/features/design_v2/v2_workspace_preview.dart lib/features/design_v2/v2_theme.dart lib/main_v2.dart
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/design_v2/v2_workspace_preview.dart
          git commit -m 'fix(v2): resolve prototype analyze issues'
          git push origin HEAD:ui/v2-prototype-foundation
