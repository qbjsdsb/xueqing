name: Temporary UX formatter

on:
  push:
    branches:
      - ux/simplify-management-and-member-names

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out UX branch
        uses: actions/checkout@v6
        with:
          ref: ux/simplify-management-and-member-names
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format changed Dart files
        run: dart format lib/cloud/organization_member_provisioning_repository.dart lib/features/organization_management/presentation

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cloud/organization_member_provisioning_repository.dart lib/features/organization_management/presentation
          git commit -m "style: format organization management UX"
          git push origin HEAD:ux/simplify-management-and-member-names
