name: Reconcile member credentials v9

on:
  push:
    branches:
      - fix/reconcile-member-credentials-v9

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reconcile-member-credentials-v9
          fetch-depth: 0
      - name: Apply exact runtime-hardening patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/organization-member-credentials/index.ts')
          source = path.read_text()

          old_codes = '''  "app_user_disabled",
  "auth_user_not_found",
  "current_membership_immutable",'''
          new_codes = '''  "app_user_disabled",
  "auth_user_not_found",
  "credential_update_failed",
  "current_membership_immutable",'''
          if source.count(old_codes) != 1:
              raise SystemExit('public error code anchor drifted')
          source = source.replace(old_codes, new_codes)

          old_codes_2 = '''  "invitation_not_revocable",
  "member_not_onboarding",
  "membership_not_found",'''
          new_codes_2 = '''  "invitation_not_revocable",
  "member_not_onboarding",
  "member_provisioning_failed",
  "member_provisioning_unavailable",
  "membership_not_found",'''
          if source.count(old_codes_2) != 1:
              raise SystemExit('member provisioning error code anchor drifted')
          source = source.replace(old_codes_2, new_codes_2)

          old_codes_3 = '''  "provision_cleanup_required",
  "provision_recovery_required",
  "user_already_member_elsewhere",'''
          new_codes_3 = '''  "provision_cleanup_required",
  "provision_recovery_required",
  "role_not_allowed",
  "user_already_member_elsewhere",'''
          if source.count(old_codes_3) != 1:
              raise SystemExit('role error code anchor drifted')
          source = source.replace(old_codes_3, new_codes_3)

          old_uuid = '''const uuidPattern =
  /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;'''
          new_uuid = '''// Auth/session IDs are UUIDs, but the deterministic fictional seed also uses
// version-0 UUID-shaped identifiers. Authorization never depends on UUID version
// bits, so validate the canonical shape without rejecting those safe fixtures.
const uuidPattern =
  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;'''
          if source.count(old_uuid) != 1:
              raise SystemExit('uuid pattern anchor drifted')
          source = source.replace(old_uuid, new_uuid)

          old_error = '''function errorCode(error: unknown, fallback: string): string {
  if (error instanceof ProvisioningError) return error.code;
  const message = error instanceof Error ? error.message.trim() : "";
  const firstLine = message.split("\\n", 1)[0]?.trim() ?? "";
  return publicErrorCodes.has(firstLine) ? firstLine : fallback;
}'''
          new_error = '''function errorCode(error: unknown, fallback: string): string {
  if (error instanceof ProvisioningError) return error.code;

  let message = "";
  if (error instanceof Error) {
    message = error.message.trim();
  } else if (error && typeof error === "object") {
    const candidate = error as Record<string, unknown>;
    message = [candidate.message, candidate.details, candidate.hint, candidate.code]
      .filter((value): value is string => typeof value === "string")
      .map((value) => value.trim())
      .filter(Boolean)
      .join("\\n");
  } else if (typeof error === "string") {
    message = error.trim();
  }

  const firstLine = message.split("\\n", 1)[0]?.trim() ?? "";
  if (publicErrorCodes.has(firstLine)) return firstLine;
  for (const code of publicErrorCodes) {
    if (message.includes(code)) return code;
  }
  return fallback;
}'''
          if source.count(old_error) != 1:
              raise SystemExit('errorCode anchor drifted')
          source = source.replace(old_error, new_error)

          path.write_text(source)
      - name: Verify narrow diff
        run: |
          git diff --check
          git diff --exit-code -- . ':!supabase/functions/organization-member-credentials/index.ts' ':!.github/workflows/reconcile-member-credentials-v9.yml'
          grep -q '"credential_update_failed"' supabase/functions/organization-member-credentials/index.ts
          grep -q '"member_provisioning_unavailable"' supabase/functions/organization-member-credentials/index.ts
          grep -q '"role_not_allowed"' supabase/functions/organization-member-credentials/index.ts
          grep -q 'message.includes(code)' supabase/functions/organization-member-credentials/index.ts
      - name: Commit reconciled source
        run: |
          if git diff --quiet -- supabase/functions/organization-member-credentials/index.ts; then
            echo 'No patch was produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/organization-member-credentials/index.ts
          git commit -m 'fix: reconcile member credential runtime hardening'
          git push origin HEAD:fix/reconcile-member-credentials-v9
