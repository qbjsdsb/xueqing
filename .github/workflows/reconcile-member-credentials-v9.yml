name: Reconcile member credentials v9

on:
  push:
    branches:
      - fix/reconcile-member-credentials-v9

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reconcile-member-credentials-v9

      - name: Apply exact runtime hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/organization-member-credentials/index.ts')
          s = p.read_text()

          replacements = [
            (
              '  "app_user_disabled",\n  "auth_user_not_found",\n  "current_membership_immutable",',
              '  "app_user_disabled",\n  "auth_user_not_found",\n  "credential_update_failed",\n  "current_membership_immutable",',
            ),
            (
              '  "invitation_not_revocable",\n  "member_not_onboarding",\n  "membership_not_found",',
              '  "invitation_not_revocable",\n  "member_not_onboarding",\n  "member_provisioning_failed",\n  "member_provisioning_unavailable",\n  "membership_not_found",',
            ),
            (
              '  "provision_cleanup_required",\n  "provision_recovery_required",\n  "user_already_member_elsewhere",',
              '  "provision_cleanup_required",\n  "provision_recovery_required",\n  "role_not_allowed",\n  "user_already_member_elsewhere",',
            ),
            (
              'const uuidPattern =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;',
              '// Auth/session IDs are UUIDs, but deterministic fictional fixtures may use version-0 UUID-shaped ids.\n// Authorization is database-backed, so validate canonical UUID shape without depending on version bits.\nconst uuidPattern =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;',
            ),
            (
              'function errorCode(error: unknown, fallback: string): string {\n  if (error instanceof ProvisioningError) return error.code;\n  const message = error instanceof Error ? error.message.trim() : "";\n  const firstLine = message.split("\\n", 1)[0]?.trim() ?? "";\n  return publicErrorCodes.has(firstLine) ? firstLine : fallback;\n}',
              'function errorCode(error: unknown, fallback: string): string {\n  if (error instanceof ProvisioningError) return error.code;\n\n  let message = "";\n  if (error instanceof Error) {\n    message = error.message.trim();\n  } else if (error && typeof error === "object") {\n    const candidate = error as Record<string, unknown>;\n    message = [candidate.message, candidate.details, candidate.hint, candidate.code]\n      .filter((value): value is string => typeof value === "string")\n      .map((value) => value.trim())\n      .filter(Boolean)\n      .join("\\n");\n  } else if (typeof error === "string") {\n    message = error.trim();\n  }\n\n  const firstLine = message.split("\\n", 1)[0]?.trim() ?? "";\n  if (publicErrorCodes.has(firstLine)) return firstLine;\n  for (const code of publicErrorCodes) {\n    if (message.includes(code)) return code;\n  }\n  return fallback;\n}',
            ),
          ]

          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'exact reconciliation anchor drifted: {old[:60]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          rm .github/workflows/reconcile-member-credentials-v9.yml
          git diff --check
          grep -q '"credential_update_failed"' supabase/functions/organization-member-credentials/index.ts
          grep -q '"member_provisioning_unavailable"' supabase/functions/organization-member-credentials/index.ts
          grep -q '"role_not_allowed"' supabase/functions/organization-member-credentials/index.ts
          grep -q 'message.includes(code)' supabase/functions/organization-member-credentials/index.ts

      - name: Commit reconciled source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reconcile member credential runtime hardening'
          git push origin HEAD:fix/reconcile-member-credentials-v9
