name: Apply release readiness v0.2.0

on:
  push:
    branches:
      - release/readiness-v0.2.0-20260908
    paths:
      - tools/apply_release_readiness_v020.py
      - .github/workflows/apply-release-readiness-v020.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: release/readiness-v0.2.0-20260908

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Apply release readiness patch
        run: python3 tools/apply_release_readiness_v020.py

      - name: Format focused Dart files
        run: dart format lib/config/app_config.dart lib/update/update_service.dart test/update/update_service_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run update regression tests
        run: flutter test test/update/update_service_test.dart

      - name: Verify stable release version baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'version: 0.2.0+4' pubspec.yaml
          grep -q "defaultValue: '0.2.0+4'" lib/config/app_config.dart
          grep -q 'default: 0.2.0+4' .github/workflows/publish-release-assets.yml
          grep -q '当前还没有可用的稳定更新。' lib/update/update_service.dart

      - name: Commit non-workflow product changes
        shell: bash
        run: |
          set -euo pipefail
          git add pubspec.yaml lib/config/app_config.dart lib/update/update_service.dart test/update/update_service_test.dart docs/RELEASING.md docs/update-manifest.example.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Prepare v0.2.0 stable release baseline'
          git push origin HEAD:release/readiness-v0.2.0-20260908
