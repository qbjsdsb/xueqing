name: Phase 0A platform builds

on:
  workflow_dispatch:
  push:
    branches:
      - phase0/flutter-bootstrap
    paths:
      - '.github/workflows/phase0a-platform-builds.yml'
      - 'android/**'
      - 'windows/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Inspect toolchain
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug

  windows-debug:
    name: Windows debug build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Inspect toolchain
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Build Windows debug app
        run: flutter build windows --debug
