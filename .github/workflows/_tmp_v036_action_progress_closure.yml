name: Temporary v0.3.6 action progress closure patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/v036-action-progress-closure
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Scope patch to progress route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/_tmp_v036_action_progress_patch.py')
          text = path.read_text()
          old = '''workspace = replace_once(
              workspace,
              "  ComposerDraftSnapshot? initialDraft,\\n}) async {",
              "  ComposerDraftSnapshot? initialDraft,\\n  bool completeCurrentActionInitially = false,\\n}) async {",
              'progress route parameter',
          )'''.replace('              ', '    ')
          new = '''workspace = replace_once(
              workspace,
              "Future<void> _showV2ProgressForCase(\\n  BuildContext context,\\n  V2Student student,\\n  V2FocusItem item, {\\n  ComposerDraftSnapshot? initialDraft,\\n}) async {",
              "Future<void> _showV2ProgressForCase(\\n  BuildContext context,\\n  V2Student student,\\n  V2FocusItem item, {\\n  ComposerDraftSnapshot? initialDraft,\\n  bool completeCurrentActionInitially = false,\\n}) async {",
              'progress route parameter',
          )'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('progress route patch block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply patch
        run: python3 tool/_tmp_v036_action_progress_patch.py
      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_composers_test.dart \
            test/features/v036_action_progress_closure_contract_test.dart
      - name: Run focused tests
        run: |
          flutter pub get
          flutter test \
            test/features/design_v2_composers_test.dart \
            test/features/v036_action_progress_closure_contract_test.dart
      - name: Commit patch and remove temporary files
        run: |
          rm .github/workflows/_tmp_v036_action_progress_closure.yml
          rm tool/_tmp_v036_action_progress_patch.py
          git config user.name 'qbjsdsb'
          git config user.email '3342513714@qq.com'
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'UX: close reminder handling into progress and next step'
          git push origin HEAD:ux/v036-action-progress-closure
