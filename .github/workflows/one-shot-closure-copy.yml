name: One-shot closure copy cleanup

on:
  push:
    branches:
      - ux/optional-closure-details
    paths:
      - .github/workflows/one-shot-closure-copy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/optional-closure-details
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Use teacher-facing closure language
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/teacher_workspace/presentation/progressive_case_forms.dart')
          text = path.read_text(encoding='utf-8')
          old = '结束的是这一次跟进，不会删除问题、证据、教学处理和检查历史。以后再次出现时仍可继续跟进。'
          new = '结束的是这一次跟进，不会删除问题、学生表现、教学处理和检查记录。以后再次出现时仍可继续跟进。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one closure copy match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused test
        run: flutter test test/features/progressive_case_forms_test.dart
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-closure-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "copy: use teacher language in follow-up closure"
          git push origin HEAD:ux/optional-closure-details
