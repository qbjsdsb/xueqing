name: Temporary case detail review cleanup

on:
  push:
    branches:
      - ux/case-detail-teacher-workflow
    paths:
      - .github/workflows/_temp_case_detail_review_cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/case-detail-teacher-workflow
          fetch-depth: 0
      - name: Apply reviewed cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          fixture = 'lib/features/design_v2/v2_fixture.dart'
          replace_once(
              fixture,
              'enum V2ActionTiming { overdue, today, future, undated }\n\nclass V2FocusItem {',
              '''enum V2ActionTiming { overdue, today, future, undated }\n\nenum V2CaseStatus {\n  newCase,\n  confirmed,\n  intervening,\n  pendingVerification,\n  stable,\n  closed,\n}\n\nclass V2FocusItem {''',
          )
          replace_once(
              fixture,
              '''    this.actionTiming,\n    this.dueOn,\n    this.pendingVerification = false,''',
              '''    this.actionTiming,\n    this.dueOn,\n    this.caseStatus,\n    this.pendingVerification = false,''',
          )
          replace_once(
              fixture,
              '''  final V2ActionTiming? actionTiming;\n  final DateTime? dueOn;\n  final bool pendingVerification;\n  final bool closed;\n}''',
              '''  final V2ActionTiming? actionTiming;\n  final DateTime? dueOn;\n  final V2CaseStatus? caseStatus;\n  final bool pendingVerification;\n  final bool closed;\n\n  V2CaseStatus get effectiveStatus {\n    final status = caseStatus;\n    if (status != null) return status;\n    if (closed) return V2CaseStatus.closed;\n    if (pendingVerification) return V2CaseStatus.pendingVerification;\n    return V2CaseStatus.intervening;\n  }\n}''',
          )

          adapter = 'lib/features/design_v2/v2_read_model_adapter.dart'
          replace_once(
              adapter,
              '''          actionTiming: closed ? null : _actionTiming(primaryAction),\n          dueOn: closed ? null : _actionDueOn(primaryAction),\n          pendingVerification:''',
              '''          actionTiming: closed ? null : _actionTiming(primaryAction),\n          dueOn: closed ? null : _actionDueOn(primaryAction),\n          caseStatus: _caseStatus(learningCase.status),\n          pendingVerification:''',
          )
          replace_once(
              adapter,
              '''      final key = _normalizedText(line);\n      if (key.isEmpty || !seen.add(key)) {\n        continue;\n      }''',
              '''      if (!seen.add(line)) {\n        continue;\n      }''',
          )
          replace_once(
              adapter,
              '''  static bool _isActiveCase(WorkspaceCase learningCase) =>\n      learningCase.status != LearningCaseStatus.closed;\n\n  static V2ActionTiming? _actionTiming''',
              '''  static bool _isActiveCase(WorkspaceCase learningCase) =>\n      learningCase.status != LearningCaseStatus.closed;\n\n  static V2CaseStatus _caseStatus(LearningCaseStatus status) {\n    switch (status) {\n      case LearningCaseStatus.newCase:\n        return V2CaseStatus.newCase;\n      case LearningCaseStatus.confirmed:\n        return V2CaseStatus.confirmed;\n      case LearningCaseStatus.intervening:\n        return V2CaseStatus.intervening;\n      case LearningCaseStatus.pendingVerification:\n        return V2CaseStatus.pendingVerification;\n      case LearningCaseStatus.stable:\n        return V2CaseStatus.stable;\n      case LearningCaseStatus.closed:\n        return V2CaseStatus.closed;\n    }\n  }\n\n  static V2ActionTiming? _actionTiming''',
          )
          replace_once(
              adapter,
              '''    if (learningCase.status == LearningCaseStatus.pendingVerification) {\n      final cleaned = _stripPendingVerificationSuffix(summary);\n      if (cleaned.isEmpty || repeatsTitle) {\n        return '已完成当前阶段，尚需再次检查确认是否稳定掌握。';\n      }\n      return cleaned;\n    }''',
              '''    if (learningCase.status == LearningCaseStatus.pendingVerification) {\n      final cleaned = _stripPendingVerificationSuffix(summary);\n      final repeatsDisplayTitle =\n          _normalizedText(cleaned).isNotEmpty &&\n          _normalizedText(cleaned) == _normalizedText(_caseTitle(learningCase));\n      if (cleaned.isEmpty || repeatsTitle || repeatsDisplayTitle) {\n        return '已完成当前阶段，尚需再次检查确认是否稳定掌握。';\n      }\n      return cleaned;\n    }''',
          )
          replace_once(
              adapter,
              '''  static String _normalizedText(String value) => value\n      .trim()\n      .toLowerCase()\n      .replaceAll(RegExp(r'[\\s，。！？、；：,.!?;:\"“”‘’（）()\\[\\]【】《》—–\\-·…]+'), '');''',
              '''  static String _normalizedText(String value) => value\n      .trim()\n      .toLowerCase()\n      .replaceAll('：', ':')\n      .replaceAll(RegExp(r'\\s+'), '');''',
          )

          workspace = 'lib/features/design_v2/v2_workspace_preview.dart'
          replace_once(
              workspace,
              '''  String get _statusLabel {\n    if (item.closed) return '已结束';\n    if (item.pendingVerification) return '待复检';\n    return '跟进中';\n  }''',
              '''  String get _statusLabel {\n    switch (item.effectiveStatus) {\n      case V2CaseStatus.newCase:\n        return '新记录';\n      case V2CaseStatus.confirmed:\n      case V2CaseStatus.intervening:\n        return '跟进中';\n      case V2CaseStatus.pendingVerification:\n        return '待复检';\n      case V2CaseStatus.stable:\n        return '暂时稳定';\n      case V2CaseStatus.closed:\n        return '已结束';\n    }\n  }''',
          )
          replace_once(
              workspace,
              '还没有安排复检时间。需要稍后检查时，可在记录进展后设置再次检查提醒。',
              '还没有安排复检时间。完成本次检查后如仍需继续关注，可在记录复检时设置下一次提醒。',
          )

          tests = 'test/features/design_v2_read_model_adapter_test.dart'
          replace_once(
              tests,
              '''      expect(stable.nextStep, '两周后复查');\n      expect(stable.actionTiming?.name, 'future');''',
              '''      expect(stable.nextStep, '两周后复查');\n      expect(stable.actionTiming?.name, 'future');\n      expect(stable.effectiveStatus.name, 'stable');''',
          )
          replace_once(
              tests,
              '''      expect(chinese.nextStep, '周四再做一题');\n      expect(chinese.dueLabel, '9 月 12 日');''',
              '''      expect(chinese.nextStep, '周四再做一题');\n      expect(chinese.dueLabel, '9 月 12 日');\n      expect(chinese.effectiveStatus.name, 'intervening');''',
          )
          replace_once(
              tests,
              '''      expect(snapshot.closedItems.single.closed, isTrue);\n      expect(snapshot.closedItems.single.nextStep, '跟进已结束');''',
              '''      expect(snapshot.closedItems.single.closed, isTrue);\n      expect(snapshot.closedItems.single.effectiveStatus.name, 'closed');\n      expect(snapshot.closedItems.single.nextStep, '跟进已结束');''',
          )
          replace_once(
              tests,
              '''      expect(math.pendingVerification, isTrue);\n      expect(\n        snapshot''',
              '''      expect(math.pendingVerification, isTrue);\n      expect(math.effectiveStatus.name, 'pendingVerification');\n      expect(\n        snapshot''',
          )
          replace_once(
              tests,
              '''      expect(entry.kind, '建立跟进');\n      expect(entry.body, '咏雪，陈太丘背诵完成，有待复检');\n    });\n  });''',
              '''      expect(entry.kind, '建立跟进');\n      expect(entry.body, '咏雪，陈太丘背诵完成，有待复检');\n    });\n\n    test('timeline deduplication never collapses distinct punctuation facts', () {\n      final workspace = TeacherWorkspace(\n        viewerName: '乔老师',\n        organizationName: '测试机构',\n        organizationTimeZone: 'Asia/Shanghai',\n        hasTeachingAccess: true,\n        loadedAt: DateTime(2026, 9, 11, 20),\n        students: [\n          WorkspaceStudent(\n            id: 'student-punctuation',\n            profileId: 'profile-punctuation',\n            profileVersion: 1,\n            name: '测试学生',\n            grade: '初三',\n            subject: '数学',\n            context: '',\n            positioning: null,\n            strengths: null,\n            cadenceNote: null,\n            cases: [\n              _case(\n                id: 'case-punctuation',\n                profileId: 'profile-punctuation',\n                title: '错题记录',\n                status: LearningCaseStatus.intervening,\n                version: 1,\n                timeline: [\n                  WorkspaceTimelineEvent(\n                    id: 'event-punctuation',\n                    occurredAt: DateTime(2026, 9, 11, 19),\n                    typeLabel: '新表现',\n                    text: '第 3-1 题错误\\n第 31 题错误',\n                  ),\n                ],\n              ),\n            ],\n            recentFacts: const [],\n          ),\n        ],\n      );\n\n      final entry = V2ReadModelAdapter.fromWorkspace(workspace).timeline.single;\n      expect(entry.body, '第 3-1 题错误\\n第 31 题错误');\n    });\n  });''',
          )

          Path('.github/workflows/_temp_case_detail_review_cleanup.yml').unlink()
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "xueqing-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve case status and timeline facts"
          git push origin HEAD:ux/case-detail-teacher-workflow
