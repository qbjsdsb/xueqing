name: v0.3.2 Deno diagnostic

on:
  push:
    branches:
      - hotfix/v0.3.2-real-device-ux
    paths:
      - ".github/workflows/v032-deno-diagnostic.yml"
      - "tools/v032_comprehensive_gate_patch.py"

permissions:
  contents: read

jobs:
  diagnose-edge-function:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply guarded candidate fixes
        run: python3 tools/v032_comprehensive_gate_patch.py
      - name: Capture Deno check output
        shell: bash
        run: |
          set -o pipefail
          deno check supabase/functions/organization-member-credentials/index.ts 2>&1 | tee deno-check.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-deno-check-log
          path: deno-check.log
          if-no-files-found: error
          retention-days: 1
