name: Temporary Dart formatter

on:
  push:
    branches:
      - phase0/cloud-foundation-bootstrap
    paths:
      - "lib/**/*.dart"
      - ".github/workflows/format-resolver.yml"

permissions:
  contents: read

jobs:
  format:
    name: Format spike files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Format selected files
        run: |
          dart format \
            lib/cloud/auth_repository.dart \
            lib/cloud/cloud_config.dart \
            lib/cloud/student_repository.dart \
            lib/features/cloud/presentation/cloud_connection_page.dart
      - name: Print formatted files
        run: |
          for file in \
            lib/cloud/auth_repository.dart \
            lib/cloud/cloud_config.dart \
            lib/cloud/student_repository.dart \
            lib/features/cloud/presentation/cloud_connection_page.dart
          do
            marker="$(echo "$file" | tr '/.' '__')"
            echo "XUEQING_FILE_${marker}_BEGIN"
            base64 --wrap=0 "$file"
            echo
            echo "XUEQING_FILE_${marker}_END"
          done
