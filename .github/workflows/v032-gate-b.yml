name: v0.3.2 media preview and safe case void Gate B

on:
  push:
    branches:
      - hotfix/v0.3.2-real-device-ux
    paths:
      - tools/v032_gate_b.py
      - .github/workflows/v032-gate-b.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply isolated patch
        run: python3 tools/v032_gate_b.py

      - name: Get packages
        run: flutter pub get

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Format changed Dart
        run: dart format lib test

      - name: Diff hygiene
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Focused regressions
        run: |
          flutter test test/features/v032_case_media_void_contract_test.dart
          flutter test test/features/design_v2_workflow_controller_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit verified product changes and remove harness
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/v032_gate_b.py .github/workflows/v032-gate-b.yml
          git add lib test
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add zoomable evidence preview and safe teacher case delete"
          git push origin HEAD:hotfix/v0.3.2-real-device-ux
