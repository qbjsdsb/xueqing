name: One-off V2 action parity

on:
  push:
    branches:
      - ui/v2-action-parity
    paths:
      - .github/workflows/oneoff-v2-action-parity.yml

permissions:
  contents: write

jobs:
  patch-validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ui/v2-action-parity
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply action parity patch
        run: python3 .github/scripts/patch_v2_action_parity.py

      - name: Format
        run: |
          dart format \
            lib/features/design_v2/v2_workflow_controller.dart \
            lib/features/design_v2/v2_action_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_workflow_controller_test.dart \
            test/features/v2_action_composers_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/features/design_v2_workflow_controller_test.dart
          flutter test test/features/v2_action_composers_test.dart
          flutter test test/features/design_v2_workspace_test.dart
          flutter test test/features/v2_shell_production_capabilities_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated product change and remove helpers
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/design_v2/v2_workflow_controller.dart \
            lib/features/design_v2/v2_action_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_workflow_controller_test.dart \
            test/features/v2_action_composers_test.dart
          git rm .github/scripts/patch_v2_action_parity.py
          git rm .github/workflows/oneoff-v2-action-parity.yml
          git commit -m "UI V2: add direct action completion and rescheduling"
          git push origin HEAD:ui/v2-action-parity
