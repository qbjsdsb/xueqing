name: Quiet Professional Management hierarchy v9

on:
  push:
    branches:
      - ux/quiet-professional-management-hierarchy-v9

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ux/quiet-professional-management-hierarchy-v9
          fetch-depth: 0

      - name: Refine management guidance surface
        run: python3 .github/scripts/quiet_professional_management_v9.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format
        run: |
          dart format lib/features/organization_management/presentation/organization_management_areas.dart test/features/v2_surface_hierarchy_contract_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Focused management acceptance
        run: |
          flutter test \
            test/features/v2_surface_hierarchy_contract_test.dart \
            test/features/management_visual_density_test.dart \
            test/features/management_workflow_clarity_contract_test.dart \
            test/features/organization_management_test.dart \
            test/features/v2_organization_workspace_test.dart \
            test/features/v2_typed_organization_navigation_test.dart \
            test/features/windows_organization_navigation_contract_test.dart \
            test/features/windows_workspace_acceptance_matrix_test.dart \
            test/features/v032_real_device_ux_contract_test.dart

      - name: Full suite
        run: flutter test

      - name: Commit verified hierarchy
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(management): quiet setup guidance surface"
          git push origin HEAD:ux/quiet-professional-management-hierarchy-v9
