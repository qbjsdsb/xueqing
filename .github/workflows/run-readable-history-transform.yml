name: Run readable history transform

on:
  push:
    branches:
      - ux/teacher-readable-history

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-readable-history
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply focused transform
        run: python3 tool/apply_readable_history_once.py
      - name: Refresh generated plugin files
        run: flutter pub get
      - name: Format Dart
        run: dart format lib test
      - name: Commit transform result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test windows/flutter pubspec.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: present teacher-readable history and student XLSX export"
          git push origin HEAD:ux/teacher-readable-history
