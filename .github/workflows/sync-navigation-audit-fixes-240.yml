name: Sync Android navigation audit fixes into Organization state

on:
  push:
    branches:
      - ux/organization-navigation-state-v2
    paths:
      - .github/workflows/sync-navigation-audit-fixes-240.yml

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge repaired parent branch without committing yet
        run: |
          git fetch origin ux/navigation-architecture-v2
          git merge --no-commit --no-ff origin/ux/navigation-architecture-v2

      - name: Remove one-shot sync workflow
        run: rm -f .github/workflows/sync-navigation-audit-fixes-240.yml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused stacked navigation regression
        run: |
          flutter test \
            test/features/android_predictive_back_contract_test.dart \
            test/features/design_v2_workspace_test.dart \
            test/features/organization_navigation_state_contract_test.dart \
            test/features/v2_organization_workspace_test.dart

      - name: Full suite
        run: flutter test

      - name: Commit verified parent synchronization
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "merge: sync Android navigation audit fixes"
          git push origin HEAD:ux/organization-navigation-state-v2
