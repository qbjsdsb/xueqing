name: Temporary updater format probe

on:
  pull_request:
    paths:
      - tools/windows_updater/bin/xueqing_updater.dart

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - name: Print formatter diff
        run: |
          dart format tools/windows_updater/bin/xueqing_updater.dart
          git diff --no-ext-diff --no-color -- tools/windows_updater/bin/xueqing_updater.dart
