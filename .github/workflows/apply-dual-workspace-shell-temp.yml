name: Apply dual workspace shell temporary

on:
  push:
    branches:
      - ux/dual-workspace-shell-scope

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/dual-workspace-shell-scope
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply shell scope refinement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_one(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source_path = Path('lib/features/design_v2/v2_workspace_preview.dart')
          source = source_path.read_text()

          source = replace_one(
              source,
              """    final destinations = <V2WorkspaceDestination>[\n      V2WorkspaceDestination.today,\n      V2WorkspaceDestination.students,\n      V2WorkspaceDestination.learning,\n      if (widget.organizationPageBuilder != null)\n        V2WorkspaceDestination.organization,\n    ];\n    final hasInternalHistory = widget.showCase || _studentOpen;\n""",
              """    const destinations = <V2WorkspaceDestination>[\n      V2WorkspaceDestination.today,\n      V2WorkspaceDestination.students,\n      V2WorkspaceDestination.learning,\n    ];\n    final hasInternalHistory = widget.showCase || _studentOpen;\n    final showPersonalScopeBar =\n        widget.organizationPageBuilder != null &&\n        widget.destination != V2WorkspaceDestination.organization &&\n        !hasInternalHistory;\n""",
              'compact destination list',
          )

          source = replace_one(
              source,
              """        body: SafeArea(child: body),\n        bottomNavigationBar: hasInternalHistory\n            ? null\n            : NavigationBar(\n""",
              """        body: SafeArea(\n          child: showPersonalScopeBar\n              ? Column(\n                  children: [\n                    _CompactScopeBar(\n                      onOpenOrganization: () {\n                        setState(() => _studentOpen = false);\n                        widget.onDestinationChanged(\n                          V2WorkspaceDestination.organization,\n                        );\n                      },\n                    ),\n                    Expanded(child: body),\n                  ],\n                )\n              : body,\n        ),\n        bottomNavigationBar:\n            hasInternalHistory ||\n                widget.destination == V2WorkspaceDestination.organization\n            ? null\n            : NavigationBar(\n""",
              'compact scope shell',
          )

          source = replace_one(
              source,
              """class _NavigationRail extends StatelessWidget {\n""",
              """class _CompactScopeBar extends StatelessWidget {\n  const _CompactScopeBar({required this.onOpenOrganization});\n\n  final VoidCallback onOpenOrganization;\n\n  @override\n  Widget build(BuildContext context) {\n    final scheme = Theme.of(context).colorScheme;\n    return DecoratedBox(\n      decoration: BoxDecoration(\n        color: scheme.surfaceContainerLowest,\n        border: Border(\n          bottom: BorderSide(color: scheme.outlineVariant),\n        ),\n      ),\n      child: Padding(\n        padding: const EdgeInsets.fromLTRB(16, 5, 8, 5),\n        child: Row(\n          children: [\n            Icon(\n              Icons.person_outline,\n              size: 18,\n              color: scheme.onSurfaceVariant,\n            ),\n            const SizedBox(width: 8),\n            Text(\n              '我的教学',\n              style: Theme.of(context).textTheme.labelLarge?.copyWith(\n                color: scheme.onSurfaceVariant,\n                fontWeight: FontWeight.w600,\n              ),\n            ),\n            const Spacer(),\n            TextButton.icon(\n              key: const Key('v2-open-organization-scope'),\n              onPressed: onOpenOrganization,\n              icon: const Icon(Icons.apartment_outlined, size: 18),\n              label: const Text('进入机构'),\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n}\n\nclass _NavigationRail extends StatelessWidget {\n""",
              'compact scope bar class',
          )

          source = replace_one(
              source,
              """          const SizedBox(height: 22),\n          for (final destination in <V2WorkspaceDestination>[\n            V2WorkspaceDestination.today,\n            V2WorkspaceDestination.students,\n            V2WorkspaceDestination.learning,\n            if (showOrganization) V2WorkspaceDestination.organization,\n          ])\n            _RailItem(\n              icon: _destinationIcon(destination),\n              tooltip: _destinationLabel(destination),\n              selected: selectedDestination == destination,\n              onTap: () => onSelected(destination),\n              expanded: expanded,\n            ),\n          const Spacer(),\n""",
              """          const SizedBox(height: 16),\n          if (showOrganization && expanded)\n            const _RailGroupLabel('我的教学'),\n          for (final destination in const <V2WorkspaceDestination>[\n            V2WorkspaceDestination.today,\n            V2WorkspaceDestination.students,\n            V2WorkspaceDestination.learning,\n          ])\n            _RailItem(\n              icon: _destinationIcon(destination),\n              tooltip: _destinationLabel(destination),\n              selected: selectedDestination == destination,\n              onTap: () => onSelected(destination),\n              expanded: expanded,\n            ),\n          if (showOrganization) ...[\n            Padding(\n              padding: EdgeInsets.fromLTRB(14, expanded ? 8 : 10, 14, 8),\n              child: Divider(height: 1, color: scheme.outlineVariant),\n            ),\n            if (expanded) const _RailGroupLabel('机构视角'),\n            _RailItem(\n              key: const Key('v2-rail-organization'),\n              icon: _destinationIcon(V2WorkspaceDestination.organization),\n              tooltip: _destinationLabel(V2WorkspaceDestination.organization),\n              selected:\n                  selectedDestination == V2WorkspaceDestination.organization,\n              onTap: () => onSelected(V2WorkspaceDestination.organization),\n              expanded: expanded,\n            ),\n          ],\n          const Spacer(),\n""",
              'desktop navigation groups',
          )

          source = replace_one(
              source,
              """class _RailItem extends StatelessWidget {\n""",
              """class _RailGroupLabel extends StatelessWidget {\n  const _RailGroupLabel(this.label);\n\n  final String label;\n\n  @override\n  Widget build(BuildContext context) {\n    final scheme = Theme.of(context).colorScheme;\n    return Padding(\n      padding: const EdgeInsets.fromLTRB(16, 0, 12, 5),\n      child: Align(\n        alignment: Alignment.centerLeft,\n        child: Text(\n          label,\n          style: Theme.of(context).textTheme.labelSmall?.copyWith(\n            color: scheme.onSurfaceVariant,\n            fontWeight: FontWeight.w600,\n            letterSpacing: 0.3,\n          ),\n        ),\n      ),\n    );\n  }\n}\n\nclass _RailItem extends StatelessWidget {\n""",
              'desktop navigation group label class',
          )

          source_path.write_text(source)

          test_path = Path('test/features/v2_typed_organization_navigation_test.dart')
          test = test_path.read_text()

          test = test.replace(
              "'manager-teacher gets Organization as a fourth compact destination'",
              "'manager-teacher keeps three compact destinations and opens Organization as a scope'",
              1,
          )
          test = replace_one(
              test,
              """      var navigation = tester.widget<NavigationBar>(find.byType(NavigationBar));\n      expect(navigation.destinations, hasLength(4));\n      expect(find.text('机构'), findsOneWidget);\n\n      await tester.tap(find.text('机构'));\n      await tester.pumpAndSettle();\n      expect(find.text('机构测试页'), findsOneWidget);\n""",
              """      var navigation = tester.widget<NavigationBar>(find.byType(NavigationBar));\n      expect(navigation.destinations, hasLength(3));\n      expect(\n        find.byKey(const Key('v2-open-organization-scope')),\n        findsOneWidget,\n      );\n\n      await tester.tap(\n        find.byKey(const Key('v2-open-organization-scope')),\n      );\n      await tester.pumpAndSettle();\n      expect(find.text('机构测试页'), findsOneWidget);\n      expect(find.byType(NavigationBar), findsNothing);\n""",
              'compact manager scope test',
          )
          test = replace_one(
              test,
              """      navigation = tester.widget<NavigationBar>(find.byType(NavigationBar));\n      expect(navigation.selectedIndex, 0);\n""",
              """      navigation = tester.widget<NavigationBar>(find.byType(NavigationBar));\n      expect(navigation.destinations, hasLength(3));\n      expect(navigation.selectedIndex, 0);\n""",
              'compact return test',
          )
          test = replace_one(
              test,
              """    expect(find.byTooltip('机构'), findsOneWidget);\n""",
              """    expect(find.byKey(const Key('v2-rail-organization')), findsOneWidget);\n    expect(find.byTooltip('机构'), findsOneWidget);\n""",
              'desktop scope rail test',
          )
          test = replace_one(
              test,
              """      var navigation = tester.widget<NavigationBar>(find.byType(NavigationBar));\n      expect(navigation.destinations, hasLength(4));\n      await tester.tap(find.text('学生'));\n""",
              """      final navigation = tester.widget<NavigationBar>(find.byType(NavigationBar));\n      expect(navigation.destinations, hasLength(3));\n      expect(\n        find.byKey(const Key('v2-open-organization-scope')),\n        findsOneWidget,\n      );\n      await tester.tap(find.text('学生'));\n""",
              'projection compact navigation test',
          )
          test = replace_one(
              test,
              """      await tester.tap(find.text('机构'));\n      await tester.pumpAndSettle();\n      expect(find.text('我的任课学生'), findsOneWidget);\n      expect(find.text('机构其他学生'), findsOneWidget);\n\n      navigation = tester.widget<NavigationBar>(find.byType(NavigationBar));\n      expect(navigation.selectedIndex, 3);\n""",
              """      await tester.tap(\n        find.byKey(const Key('v2-open-organization-scope')),\n      );\n      await tester.pumpAndSettle();\n      expect(find.text('我的任课学生'), findsOneWidget);\n      expect(find.text('机构其他学生'), findsOneWidget);\n      expect(find.byType(NavigationBar), findsNothing);\n""",
              'projection organization scope test',
          )
          test = replace_one(
              test,
              """      expect(navigation.destinations, hasLength(3));\n      expect(find.text('机构'), findsNothing);\n""",
              """      expect(navigation.destinations, hasLength(3));\n      expect(find.text('机构'), findsNothing);\n      expect(\n        find.byKey(const Key('v2-open-organization-scope')),\n        findsNothing,\n      );\n""",
              'ordinary teacher scope absence test',
          )
          test_path.write_text(test)

          contract_path = Path('test/features/v2_shell_production_capabilities_test.dart')
          contract = contract_path.read_text()
          contract = replace_one(
              contract,
              """    expect(preview, contains(\"Key('v2-compact-more')\"));\n""",
              """    expect(preview, contains(\"Key('v2-compact-more')\"));\n    expect(preview, contains(\"Key('v2-open-organization-scope')\"));\n    expect(preview, contains(\"Key('v2-rail-organization')\"));\n    expect(preview, contains(\"const _RailGroupLabel('我的教学')\"));\n    expect(preview, contains(\"const _RailGroupLabel('机构视角')\"));\n""",
              'production shell scope contract',
          )
          contract_path.write_text(contract)
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/v2_typed_organization_navigation_test.dart \
            test/features/v2_shell_production_capabilities_test.dart

      - name: Run targeted tests
        run: |
          flutter pub get
          flutter test \
            test/features/v2_typed_organization_navigation_test.dart \
            test/features/v2_shell_production_capabilities_test.dart

      - name: Commit refined shell and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-dual-workspace-shell-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/design_v2/v2_workspace_preview.dart \
            test/features/v2_typed_organization_navigation_test.dart \
            test/features/v2_shell_production_capabilities_test.dart \
            .github/workflows/apply-dual-workspace-shell-temp.yml
          git commit -m "feat: clarify personal and organization workspace scopes"
          git push origin HEAD:ux/dual-workspace-shell-scope
