name: Final UX audit v0.3.11

on:
  push:
    branches:
      - release/final-ux-audit-v0.3.11
    paths:
      - .github/workflows/final-ux-audit-v0311.yml

permissions:
  contents: write

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final UX audit fixes
        run: python3 .github/scripts/final_ux_audit_v0311.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format
        run: |
          dart format lib/features/organization_management/presentation/organization_management_layout.dart test/features/management_visual_density_test.dart test/features/management_workflow_clarity_contract_test.dart test/features/release_ux_acceptance_matrix_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Focused release UX acceptance
        run: |
          flutter test \
            test/features/release_ux_acceptance_matrix_test.dart \
            test/features/management_visual_density_test.dart \
            test/features/management_workflow_clarity_contract_test.dart \
            test/features/organization_management_test.dart \
            test/features/v2_surface_hierarchy_contract_test.dart \
            test/features/v2_page_rhythm_test.dart \
            test/features/v2_final_ergonomics_test.dart \
            test/features/v2_adaptive_workspace_test.dart \
            test/features/windows_workspace_acceptance_matrix_test.dart \
            test/features/v2_today_desktop_composition_test.dart \
            test/features/v2_student_desktop_composition_test.dart \
            test/features/v2_case_detail_desktop_composition_test.dart \
            test/features/v032_real_device_ux_contract_test.dart

      - name: Full suite
        run: flutter test

      - name: Commit verified release UX fixes
        run: |
          git config user.name xueqing-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ux): finish release interaction hierarchy'
          git push origin HEAD:release/final-ux-audit-v0.3.11
