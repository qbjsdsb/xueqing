name: Apply organization navigation state

on:
  push:
    branches:
      - ux/organization-navigation-state-v2
    paths:
      - .xueqing-org-nav.py
      - .xueqing-org-nav-fix.py
      - .github/workflows/apply-organization-navigation.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply state lift
        run: |
          python3 .xueqing-org-nav.py
          python3 .xueqing-org-nav-fix.py
      - name: Remove one-shot assets
        run: rm -f .xueqing-org-nav.py .xueqing-org-nav-fix.py .github/workflows/apply-organization-navigation.yml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format lib/features/organization_management/presentation/organization_management_page.dart lib/features/organization_management/presentation/organization_management_areas.dart lib/features/organization_management/presentation/organization_management_layout.dart lib/features/design_v2/v2_organization_workspace_page.dart test/features/organization_navigation_state_contract_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Focused contract
        run: flutter test test/features/organization_navigation_state_contract_test.dart
      - name: Full suite
        run: flutter test
      - name: Commit verified state lift
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(org): lift management area into workspace state"
          git push origin HEAD:ux/organization-navigation-state-v2
