name: Temporary management test diagnostics

on:
  push:
    branches:
      - ux/simplify-management-and-member-names

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/simplify-management-and-member-names
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Reproduce final proposed polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/tmp-management-ux-polish.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply teacher-facing UX polish'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          script = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - ') and not line.startswith('          '):
                  break
              if line.startswith('          '):
                  script.append(line[10:])
              elif line.strip() == '':
                  script.append('')
              else:
                  break
          Path('/tmp/apply-management-polish.py').write_text('\n'.join(script) + '\n', encoding='utf-8')
          PY
          python /tmp/apply-management-polish.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          layout = 'lib/features/organization_management/presentation/organization_management_layout.dart'
          replace_once(
              layout,
              '''  const _ManagementEmptyState({\n    required this.title,\n    required this.message,\n    required this.icon,\n    this.action,\n  });\n\n  final String title;\n  final String message;\n  final IconData icon;\n  final Widget? action;\n''',
              '''  const _ManagementEmptyState({\n    required this.title,\n    required this.message,\n    required this.icon,\n  });\n\n  final String title;\n  final String message;\n  final IconData icon;\n''',
          )
          replace_once(
              layout,
              '''                Text(message, style: Theme.of(context).textTheme.bodyMedium),\n                if (action != null) ...[\n                  const SizedBox(height: AppSpacing.sm),\n                  Align(alignment: Alignment.centerLeft, child: action!),\n                ],\n''',
              '''                Text(message, style: Theme.of(context).textTheme.bodyMedium),\n''',
          )
          replace_once(
              'lib/cloud/organization_management_repository.dart',
              "'invalid_teacher_subject_scope_input' => '教学范围信息不完整，请刷新后重试。',",
              "'invalid_teacher_subject_scope_input' => '可教学科配置不完整，请刷新后重试。',",
          )
          PY

      - run: flutter pub get
      - run: dart format lib/cloud/organization_management_repository.dart lib/features/organization_management/presentation lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/organization_management_test.dart test/features/teacher_workspace_test.dart
      - run: flutter analyze

      - name: Capture Flutter tests
        shell: bash
        run: |
          set +e
          flutter test > tmp-management-test.txt 2>&1
          status=$?
          echo "$status" > tmp-management-test-status.txt
          cat tmp-management-test.txt
          exit 0

      - name: Keep diagnostics only
        shell: bash
        run: |
          git restore lib test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-management-test.txt tmp-management-test-status.txt
          git commit -m "ci: capture management UX test diagnostics"
          git push origin HEAD:ux/simplify-management-and-member-names
