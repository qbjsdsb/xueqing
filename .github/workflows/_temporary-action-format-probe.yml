name: Temporary action format probe

on:
  pull_request:
    paths:
      - lib/features/teacher_workspace/presentation/teacher_workspace_page.dart
      - test/features/teacher_workspace_test.dart

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - name: Print formatter diff
        run: |
          dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
          git diff --no-ext-diff --no-color -- lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
