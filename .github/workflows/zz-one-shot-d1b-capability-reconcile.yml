name: One-shot D1b Organization capability reconciliation

on:
  push:
    branches:
      - v0.3.8/typed-organization-navigation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.3.8/typed-organization-navigation
      - name: Apply exact capability-loss reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/design_v2/v2_workspace_preview.dart')
          text = path.read_text()
          old = """    if (!identical(oldWidget.data, widget.data)) {\n      _reconcileSelection();\n    }\n    if (oldWidget.composerDraftScopeKey != widget.composerDraftScopeKey ||"""
          new = """    if (!identical(oldWidget.data, widget.data)) {\n      _reconcileSelection();\n    }\n    if (widget.organizationPageBuilder == null &&\n        _destination == V2WorkspaceDestination.organization) {\n      _destination = V2WorkspaceDestination.today;\n      _showCase = false;\n    }\n    if (oldWidget.composerDraftScopeKey != widget.composerDraftScopeKey ||"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one didUpdateWidget anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/design_v2/v2_workspace_preview.dart
          git diff --cached --check
          git commit -m "v2: reconcile revoked Organization navigation capability"
          git push origin HEAD:v0.3.8/typed-organization-navigation
