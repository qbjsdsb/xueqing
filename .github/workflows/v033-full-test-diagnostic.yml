name: v0.3.3 full test diagnostic

on:
  push:
    branches:
      - ux/v0.3.3-cross-platform-polish
    paths:
      - .github/workflows/v033-full-test-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ux/v0.3.3-cross-platform-polish
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture full test result
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/v033-full-test.log
          test_exit=${PIPESTATUS[0]}
          set -e
          mkdir -p diagnostics
          {
            echo "exit_code=$test_exit"
            echo "head=${GITHUB_SHA}"
            echo "--- tail ---"
            tail -n 500 /tmp/v033-full-test.log
          } > diagnostics/v033-full-test-output.txt
          rm .github/workflows/v033-full-test-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/v033-full-test-output.txt .github/workflows/v033-full-test-diagnostic.yml
          git commit -m "Capture v0.3.3 full test diagnostic"
          git push origin HEAD:ux/v0.3.3-cross-platform-polish
