name: Validate V2 platform targets once

on:
  push:
    paths:
      - '.github/workflows/validate-v2-platform-targets-once.yml'

permissions:
  contents: read

jobs:
  android-v2:
    name: Android V2 preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build V2 Android debug APK
        run: flutter build apk --debug -t lib/main_v2.dart
      - name: Verify V2 APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-v2-preview-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-v2:
    name: Windows V2 preview bundle
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Build V2 Windows release
        run: flutter build windows --release -t lib/main_v2.dart
      - name: Verify V2 Windows executable
        shell: pwsh
        run: |
          $exe = 'build/windows/x64/runner/Release/xueqing.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if ((Get-Item $exe).Length -le 0) { throw "Empty $exe" }
      - name: Upload V2 Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-v2-preview-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 7
