name: Apply organization attention signal polish

on:
  push:
    branches:
      - ux/organization-attention-signal-20260913
    paths:
      - .github/ux-organization-attention-signal.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/organization-attention-signal-20260913

      - name: Apply focused supervision polish
        run: python3 .github/scripts/organization_attention_signal_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format focused files
        run: dart format lib/features/design_v2/v2_organization_workspace_page.dart test/features/v2_organization_workspace_test.dart

      - name: Run targeted organization tests
        run: flutter test test/features/v2_organization_workspace_test.dart test/features/v2_typed_organization_navigation_test.dart

      - name: Remove temporary patch machinery
        run: rm -f .github/workflows/apply-organization-attention-signal.yml .github/ux-organization-attention-signal.trigger .github/scripts/organization_attention_signal_patch.py

      - name: Commit polished source
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "polish(ui): 强化机构监督关注信号"
          git push origin HEAD:ux/organization-attention-signal-20260913
