name: Supabase checks

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"

permissions:
  contents: read

jobs:
  database:
    name: Rebuild and test database security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Check shell test syntax
        run: bash -n supabase/tests/old_token_security.sh supabase/tests/remote_security_spike.sh

      - name: Start local Supabase development stack
        run: supabase start

      - name: Rebuild database from migrations and seed
        run: supabase db reset

      - name: Run automated RLS tests
        run: supabase test db

      - name: Run old-token security test
        run: bash supabase/tests/old_token_security.sh

      - name: Stop local Supabase development stack
        if: always()
        run: supabase stop
