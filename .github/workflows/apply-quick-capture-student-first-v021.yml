name: Diagnose Quick Capture student-first v0.2.1

on:
  push:
    branches:
      - ux/quick-capture-student-first-v021

permissions:
  contents: write

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ux/quick-capture-student-first-v021
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply focused Quick Capture patch
        run: python tool/apply_quick_capture_student_first_v021.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Capture full Flutter test failure
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/flutter-test.log 2>&1
          status=$?
          if [[ $status -eq 0 ]]; then
            echo "Full Flutter tests passed."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/flutter-test.log').read_text(errors='replace').splitlines()
          markers = ('Test failed', 'Expected:', 'Actual:', 'Which:', 'EXCEPTION', 'Some tests failed', '══╡')
          hits = [i for i, line in enumerate(text) if any(marker in line for marker in markers)]
          keep = set()
          for i in hits:
              keep.update(range(max(0, i - 18), min(len(text), i + 35)))
          if not keep:
              keep.update(range(max(0, len(text) - 250), len(text)))
          out = []
          last = None
          for i in sorted(keep):
              if last is not None and i > last + 1:
                  out.append('...')
              out.append(f'{i+1}: {text[i]}')
              last = i
          Path('tool/quick_capture_test_failure.txt').write_text('\n'.join(out) + '\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/quick_capture_test_failure.txt
          git commit -m "diag: capture Quick Capture test failure"
          git push --force origin HEAD:refs/heads/diag/quick-capture-test-failure-v021
          exit $status
