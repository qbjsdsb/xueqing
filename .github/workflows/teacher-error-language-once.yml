name: One-shot teacher error language cleanup

on:
  push:
    branches:
      - ux/teacher-error-language
    paths:
      - .github/workflows/teacher-error-language-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ux/teacher-error-language
          fetch-depth: 0

      - name: Apply exact teacher-language cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int | None = None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              if count == 0:
                  raise SystemExit(f'{path}: anchor not found: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          progressive = 'lib/features/teacher_workspace/presentation/progressive_case_forms.dart'
          workspace = 'lib/features/teacher_workspace/presentation/teacher_workspace_page.dart'
          attachment = 'lib/features/teacher_workspace/presentation/evidence_attachment_picker.dart'
          workspace_test = 'test/features/teacher_workspace_test.dart'
          attachment_test = 'test/features/evidence_attachment_picker_test.dart'

          replace_exact(
              progressive,
              "本次提交内容已锁定；重试会沿用同一 operation ID，不会重复记录。",
              "刚才填写的内容已保留，可以直接重试，不会重复保存。",
              1,
          )
          replace_exact(
              progressive,
              "本次提交内容已锁定；重试会沿用同一 operation ID。",
              "刚才填写的内容已保留，可以直接重试。",
              1,
          )
          replace_exact(progressive, '重试原提交', '重新保存', 2)

          replace_exact(
              workspace,
              "本次提交内容已锁定；重试会沿用同一 operation ID。",
              "刚才填写的内容已保留，可以直接重试。",
              1,
          )
          replace_exact(workspace, '重试原提交', '重新保存', 2)

          replace_exact(
              attachment,
              '当前 Case 已关闭或你已不再负责该学生，无法上传图片。',
              '当前问题已结束跟进，或你已不再负责该学生，无法上传图片。',
              1,
          )

          replace_exact(workspace_test, '本次提交内容已锁定', '刚才填写的内容已保留', 1)
          replace_exact(workspace_test, '重试原提交', '重新保存', 2)

          test_path = Path(attachment_test)
          test_text = test_path.read_text(encoding='utf-8')
          anchor = "  test('keeps a picked image retryable when the network is unavailable', () {\n"
          block = """  test('uses teacher language when the problem can no longer accept images', () {\n    expect(\n      describeEvidenceAttachmentError(\n        StateError('learning_case_closed'),\n        duringUpload: true,\n      ),\n      '当前问题已结束跟进，或你已不再负责该学生，无法上传图片。',\n    );\n  });\n\n"""
          if block in test_text:
              raise SystemExit('attachment regression block already exists unexpectedly')
          if test_text.count(anchor) != 1:
              raise SystemExit('attachment test insertion anchor not unique')
          test_path.write_text(test_text.replace(anchor, block + anchor), encoding='utf-8')

          # Guard the exact teacher-facing regressions we are removing.
          for path in (progressive, workspace):
              text = Path(path).read_text(encoding='utf-8')
              if '本次提交内容已锁定' in text:
                  raise SystemExit(f'{path}: stale engineering wording remains')
              if '重试原提交' in text:
                  raise SystemExit(f'{path}: stale retry wording remains')
          if '当前 Case 已关闭' in Path(attachment).read_text(encoding='utf-8'):
              raise SystemExit('attachment picker: teacher-visible Case wording remains')
          PY

      - name: Verify patch hygiene
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "$(printf '%s\n' \
            lib/features/teacher_workspace/presentation/evidence_attachment_picker.dart \
            lib/features/teacher_workspace/presentation/progressive_case_forms.dart \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            test/features/evidence_attachment_picker_test.dart \
            test/features/teacher_workspace_test.dart | sort | tr '\n' ' ')"

      - name: Commit real patch and remove one-shot workflow
        run: |
          rm .github/workflows/teacher-error-language-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: remove engineering language from teacher errors"
          git push origin HEAD:ux/teacher-error-language
