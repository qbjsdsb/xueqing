name: One-shot optional action completion

on:
  push:
    branches:
      - domain/action-completion-without-forced-followup
    paths:
      - .github/workflows/one-shot-action-completion-optional-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: domain/action-completion-without-forced-followup
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Apply exact patch
        run: python .github/scripts/patch_action_completion.py

      - name: Format and run focused tests
        run: |
          flutter pub get
          dart format lib/cloud/learning_repository.dart lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/progressive_workspace_integration_test.dart test/features/teacher_workspace_test.dart
          flutter test test/features/progressive_workspace_integration_test.dart test/features/teacher_workspace_test.dart

      - name: Remove staging files and commit
        run: |
          rm .github/scripts/patch_action_completion.py
          rm .github/workflows/one-shot-action-completion-optional-followup.yml
          git config user.name xueqing-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "domain: finish reminders without forced follow-up"
          git push origin HEAD:domain/action-completion-without-forced-followup
