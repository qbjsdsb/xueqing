name: Bootstrap Xueqing v0.3.5 Stable

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-requests/v0.3.5"

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap-xueqing-v0.3.5-stable
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.3.5
  RELEASE_VERSION: 0.3.5+13
  RELEASE_COMMIT: be695c8fb8aa4c974bccc944478dd2c051f139a0
  PUBLIC_SUPABASE_URL: https://czuctoulgnfytcfonkhc.supabase.co
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yjUy-gjUSSFkCpbK_AjLSA_I0FgOXTI
  PUBLIC_SUPABASE_ALLOWED_HOSTS: czuctoulgnfytcfonkhc.supabase.co
  XUEQING_ANDROID_CERT_SHA256: ${{ vars.XUEQING_ANDROID_CERT_SHA256 || '' }}

jobs:
  bootstrap:
    name: Validate frozen candidate and dispatch signed Stable release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate configured release material
        shell: bash
        env:
          XUEQING_ANDROID_KEYSTORE_BASE64: ${{ secrets.XUEQING_ANDROID_KEYSTORE_BASE64 }}
          XUEQING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.XUEQING_ANDROID_KEYSTORE_PASSWORD }}
          XUEQING_ANDROID_KEY_ALIAS: ${{ secrets.XUEQING_ANDROID_KEY_ALIAS }}
          XUEQING_ANDROID_KEY_PASSWORD: ${{ secrets.XUEQING_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required_names=(
            PUBLIC_SUPABASE_URL
            PUBLIC_SUPABASE_PUBLISHABLE_KEY
            PUBLIC_SUPABASE_ALLOWED_HOSTS
            XUEQING_ANDROID_CERT_SHA256
            XUEQING_ANDROID_KEYSTORE_BASE64
            XUEQING_ANDROID_KEYSTORE_PASSWORD
            XUEQING_ANDROID_KEY_ALIAS
            XUEQING_ANDROID_KEY_PASSWORD
          )
          missing=()
          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub release configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ "$PUBLIC_SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "PUBLIC_SUPABASE_URL must be an https://*.supabase.co endpoint."
            exit 1
          fi
          expected_host="${PUBLIC_SUPABASE_URL#https://}"
          expected_host="${expected_host%%/*}"
          if [[ "$PUBLIC_SUPABASE_ALLOWED_HOSTS" != "$expected_host" ]]; then
            echo "Public Supabase allowed host does not match the public endpoint host."
            exit 1
          fi
          if [[ "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "Public Supabase client key is not in the expected publishable-key form."
            exit 1
          fi
          cert_sha="$(printf '%s' "$XUEQING_ANDROID_CERT_SHA256" | sed 's/[:[:space:]]//g' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$cert_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "XUEQING_ANDROID_CERT_SHA256 must be a 64-hex SHA-256 fingerprint."
            exit 1
          fi
          echo "Verified public client configuration and permanent Android signing configuration. Secret values were not printed."

      - name: Verify frozen release commit and source version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT" >/dev/null
          compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...main" --jq '.status')"
          behind_by="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...main" --jq '.behind_by')"
          if [[ "$behind_by" != "0" ]] || [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
            echo "Frozen release commit is no longer reachable from main."
            exit 1
          fi
          encoded_pubspec="$(gh api "repos/$GITHUB_REPOSITORY/contents/pubspec.yaml?ref=$RELEASE_COMMIT" --jq '.content')"
          source_version="$(printf '%s' "$encoded_pubspec" | base64 --decode | sed -n 's/^version:[[:space:]]*//p' | head -n 1)"
          if [[ "$source_version" != "$RELEASE_VERSION" ]]; then
            echo "Frozen source version is $source_version, expected $RELEASE_VERSION."
            exit 1
          fi
          echo "Frozen candidate $RELEASE_COMMIT is reachable from main and reports $RELEASE_VERSION."

      - name: Create or verify staging Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
            RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os
          release = json.loads(os.environ['RELEASE_JSON'])
          if release['isDraft'] or not release['isPrerelease']:
              raise SystemExit('Existing v0.3.5 Release is not a published Pre-release staging Release.')
          PY
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --prerelease \
              --title "学情 v0.3.5" \
              --notes $'v0.3.5 稳定版更新。\n\n- 成长时间线去除重复的检查结果表述，保留真实补充信息\n- Excel 导出的“跟进问题”和“具体内容”语义去重，减少重复文字\n- 修复学生资料编辑依赖的生产后端能力，并改进服务端版本不一致提示\n- 新增生产后端兼容性契约，Stable 发布前自动阻止客户端超前于服务端\n- 保持核心 Learning Case 状态机、RLS 与角色权限边界不变\n- 版本 0.3.5+13；Flutter、Android、Windows 发布前 Gate 已通过'
          fi
          actual_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          if [[ "$actual_commit" != "$RELEASE_COMMIT" ]]; then
            echo "$RELEASE_TAG does not point to the frozen candidate commit."
            exit 1
          fi
          echo "$RELEASE_TAG staging Pre-release points to $RELEASE_COMMIT."

      - name: Dispatch signed production release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run publish-release-assets.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f release_tag="$RELEASE_TAG" \
              -f app_version="$RELEASE_VERSION" \
              -f release_notes=$'成长时间线去除重复的检查结果表述，保留真实补充信息\nExcel 导出的跟进问题与具体内容语义去重\n修复学生资料编辑生产后端能力与版本不一致提示\nStable 发布前新增生产后端兼容性 Gate，防止客户端超前于服务端\n保持核心 Case 状态机、RLS 与角色权限边界不变\n稳定版版本 0.3.5+13' \
              -f supabase_url="$PUBLIC_SUPABASE_URL" \
              -f supabase_publishable_key="$PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
              -f supabase_allowed_hosts="$PUBLIC_SUPABASE_ALLOWED_HOSTS"; then
              echo "Stable release workflow dispatched for $RELEASE_TAG ($RELEASE_VERSION)."
              exit 0
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "Could not dispatch the Stable release workflow after repository propagation retries."
              exit 1
            fi
            sleep 3
          done
