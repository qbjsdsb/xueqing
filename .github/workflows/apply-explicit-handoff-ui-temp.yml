name: Apply explicit handoff confirmation temporary

on:
  push:
    branches:
      - ui/explicit-teaching-handoff-confirmation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/explicit-teaching-handoff-confirmation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply two-stage handoff flow
        run: python3 .github/scripts/apply_explicit_handoff_ui.py
      - name: Format and validate handoff UX
        shell: bash
        run: |
          dart format \
            lib/features/organization_management/presentation/organization_management_page.dart \
            lib/features/organization_management/presentation/organization_management_learning_actions.dart \
            lib/features/organization_management/presentation/organization_student_teacher_assignment_transfer_dialog.dart \
            lib/features/organization_management/presentation/organization_student_teacher_handoff_confirmation_dialog.dart \
            test/features/organization_management_test.dart \
            test/features/organization_student_teacher_handoff_confirmation_dialog_test.dart
          flutter pub get
          flutter analyze
          flutter test test/features/organization_student_teacher_handoff_confirmation_dialog_test.dart
          flutter test test/features/organization_management_test.dart
      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-explicit-handoff-ui-temp.yml
          git rm .github/scripts/apply_explicit_handoff_ui.py
          git add \
            lib/features/organization_management/presentation/organization_management_page.dart \
            lib/features/organization_management/presentation/organization_management_learning_actions.dart \
            lib/features/organization_management/presentation/organization_student_teacher_assignment_transfer_dialog.dart \
            lib/features/organization_management/presentation/organization_student_teacher_handoff_confirmation_dialog.dart \
            test/features/organization_management_test.dart \
            test/features/organization_student_teacher_handoff_confirmation_dialog_test.dart
          git diff --cached --check
          git commit -m 'feat: add explicit teaching handoff confirmation flow'
          git push origin HEAD:ui/explicit-teaching-handoff-confirmation
