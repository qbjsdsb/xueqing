name: Format PR 84

on:
  push:
    branches:
      - ux/today-bounded-preview

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/today-bounded-preview
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Format only the PR files
        run: |
          dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
          rm .github/workflows/zz-format-pr84.yml
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/zz-format-pr84.yml' \
            'lib/features/teacher_workspace/presentation/teacher_workspace_page.dart' \
            'test/features/teacher_workspace_test.dart' | sort)"
          test "$actual" = "$expected"
      - name: Commit formatter result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format Today bounded preview'
          git push origin HEAD:ux/today-bounded-preview
