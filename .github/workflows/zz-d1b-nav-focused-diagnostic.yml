name: D1b navigation failure diagnostic

on:
  push:
    branches:
      - v0.3.8/typed-organization-navigation

permissions:
  contents: read

jobs:
  failure-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.3.8/typed-organization-navigation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Run full suite and print only failure tail
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/full-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '===== FULL TEST FAILURE TAIL ====='
            tail -n 500 /tmp/full-tests.log
          else
            echo 'Full test suite passed.'
          fi
          exit "$status"
