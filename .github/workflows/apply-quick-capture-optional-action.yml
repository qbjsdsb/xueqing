name: Apply Quick Capture optional Action patch

on:
  push:
    branches:
      - ux/quick-capture-without-forced-action-20260908
    paths:
      - .github/workflows/apply-quick-capture-optional-action.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/quick-capture-without-forced-action-20260908
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded source replacements
        run: python3 .github/scripts/apply_quick_capture_optional_action.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Format and commit product files
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/cloud/learning_repository.dart lib/features/teacher_workspace/presentation/teacher_workspace_page.dart
          git diff --check
          git diff --exit-code -- .github/scripts/apply_quick_capture_optional_action.py .github/workflows/apply-quick-capture-optional-action.yml
          if git diff --quiet -- lib/cloud/learning_repository.dart lib/features/teacher_workspace/presentation/teacher_workspace_page.dart; then
            echo 'No product change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/cloud/learning_repository.dart lib/features/teacher_workspace/presentation/teacher_workspace_page.dart
          git commit -m 'feat: stop forcing an Action in Quick Capture'
          git push origin HEAD:ux/quick-capture-without-forced-action-20260908
