name: Fix V2 reminder date once

on:
  push:
    paths:
      - '.github/workflows/fix-v2-reminder-date-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-prototype-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Require a real date for reminder next step
        run: |
          python3 - <<'PY'
          from pathlib import Path

          composer = Path('lib/features/design_v2/v2_composers.dart')
          text = composer.read_text()
          old = """  bool get _canSave {\n    if (_controller.text.trim().isEmpty) {\n      return false;\n    }\n    if (_kind == V2ProgressKind.assessment && _assessmentResult == null) {\n      return false;\n    }\n    return true;\n  }\n"""
          new = """  bool get _canSave {\n    if (_controller.text.trim().isEmpty) {\n      return false;\n    }\n    if (_kind == V2ProgressKind.assessment && _assessmentResult == null) {\n      return false;\n    }\n    if (_nextStep == V2NextStep.remind && _reminderDate == null) {\n      return false;\n    }\n    return true;\n  }\n"""
          assert old in text
          composer.write_text(text.replace(old, new, 1))

          test = Path('test/features/design_v2_composers_test.dart')
          t = test.read_text()
          needle = """      expect(find.byKey(const Key('v2-reminder-title')), findsOneWidget);\n      expect(find.byKey(const Key('v2-reminder-date')), findsOneWidget);\n"""
          replacement = """      expect(find.byKey(const Key('v2-reminder-title')), findsOneWidget);\n      expect(find.byKey(const Key('v2-reminder-date')), findsOneWidget);\n\n      await tester.enterText(\n        find.byKey(const Key('v2-progress-body')),\n        '今天检查后仍有一个要点不稳定。',\n      );\n      await tester.pump();\n\n      final save = tester.widget<FilledButton>(\n        find.widgetWithText(FilledButton, '保存进展'),\n      );\n      expect(save.onPressed, isNull);\n"""
          assert needle in t
          test.write_text(t.replace(needle, replacement, 1))
          PY
      - name: Format, analyze, and test reminder semantics
        run: |
          dart format \
            lib/features/design_v2/v2_composers.dart \
            test/features/design_v2_composers_test.dart
          flutter analyze \
            lib/main_v2.dart \
            lib/features/design_v2/v2_theme.dart \
            lib/features/design_v2/v2_fixture.dart \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart
          flutter test \
            test/features/design_v2_workspace_test.dart \
            test/features/design_v2_composers_test.dart
      - name: Commit validated reminder fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/design_v2/v2_composers.dart \
            test/features/design_v2_composers_test.dart
          git commit -m 'fix(v2): require date for reminder next step'
          git push origin HEAD:ui/v2-prototype-foundation
