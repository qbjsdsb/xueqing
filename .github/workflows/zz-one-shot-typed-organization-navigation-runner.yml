name: One-shot typed organization navigation guarded runner

on:
  push:
    branches:
      - v0.3.8/typed-organization-navigation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.3.8/typed-organization-navigation
      - name: Run staged patch with explicit duplicate guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/zz-one-shot-typed-organization-navigation.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Commit patch"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )
          old = """def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected 1 match, found {count}')\n    return text.replace(old, new, 1)"""
          new = """def replace_once(text, old, new, label):\n    count = text.count(old)\n    expected = 2 if label in {\n        'desktop typed destination field',\n        'desktop typed callback',\n    } else 1\n    if count != expected:\n        raise SystemExit(f'{label}: expected {expected} match(es), found {count}')\n    return text.replace(old, new, 1)"""
          if script.count(old) != 1:
              raise SystemExit('staged replace_once function changed unexpectedly')
          script = script.replace(old, new, 1)
          exec(compile(script, 'typed_navigation_patch.py', 'exec'))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/design_v2/v2_workspace_preview.dart lib/features/design_v2/v2_organization_workspace_page.dart lib/features/design_v2/v2_workspace_loader.dart
          git diff --cached --check
          git commit -m "v2: add typed organization top-level navigation"
          git push origin HEAD:v0.3.8/typed-organization-navigation
