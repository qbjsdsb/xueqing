name: One-shot update friction UX tests

on:
  push:
    branches: [ux/teacher-friction-reduction]
    paths: [.github/workflows/one-shot-update-friction-tests.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-friction-reduction
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Apply test and copy migration
        run: python .github/scripts/update_friction_tests.py
      - name: Format changed Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart test/features/progressive_case_forms_test.dart
      - name: Run focused tests before committing
        run: flutter test test/features/teacher_workspace_test.dart test/features/progressive_case_forms_test.dart test/features/progressive_workspace_integration_test.dart
      - name: Remove one-shot tooling and commit
        if: always()
        run: |
          rm -f .github/scripts/update_friction_tests.py
          rm -f .github/workflows/one-shot-update-friction-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: align with lightweight teacher recording"
          git push origin HEAD:ux/teacher-friction-reduction
