name: Apply committed write refresh reliability temporary

on:
  push:
    branches:
      - fix/committed-write-refresh-semantics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/committed-write-refresh-semantics
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply refresh reliability changes
        shell: bash
        run: |
          python3 .github/scripts/apply_committed_refresh_semantics_temp.py
          sed -i "/The visible list is intentionally allowed to remain stale until a/,/expect(find.text('主责老师：原老师'), findsOneWidget);/d" test/features/organization_management_test.dart
      - name: Format and validate
        shell: bash
        run: |
          dart format \
            lib/features/organization_management/presentation/organization_management_core.dart \
            lib/features/organization_management/presentation/organization_management_learning_actions.dart \
            lib/features/organization_management/presentation/organization_management_member_actions.dart \
            test/features/organization_management_test.dart
          flutter pub get
          flutter analyze
          flutter test test/features/organization_management_test.dart
      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/apply-committed-refresh-semantics-temp.yml
          rm .github/scripts/apply_committed_refresh_semantics_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/organization_management/presentation/organization_management_core.dart \
            lib/features/organization_management/presentation/organization_management_learning_actions.dart \
            lib/features/organization_management/presentation/organization_management_member_actions.dart \
            test/features/organization_management_test.dart \
            .github/workflows/apply-committed-refresh-semantics-temp.yml \
            .github/scripts/apply_committed_refresh_semantics_temp.py
          git commit -m "fix: preserve committed-write truth when refresh fails"
          git push origin HEAD:fix/committed-write-refresh-semantics
