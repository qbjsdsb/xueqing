name: Apply organization responsibility preview temporary

on:
  push:
    branches:
      - ux/organization-responsibility-preview

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/organization-responsibility-preview
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply responsibility preview
        run: python3 tools/apply_org_responsibility_preview_temp.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_organization_workspace_page.dart \
            test/features/v2_organization_quick_capture_test.dart

      - name: Run targeted tests
        run: |
          flutter pub get
          flutter test \
            test/features/design_v2_composers_test.dart \
            test/features/v2_organization_quick_capture_test.dart \
            test/features/v2_organization_workspace_test.dart

      - name: Commit refinement and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/apply-org-responsibility-preview-temp.yml
          rm tools/apply_org_responsibility_preview_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_organization_workspace_page.dart \
            test/features/v2_organization_quick_capture_test.dart \
            .github/workflows/apply-org-responsibility-preview-temp.yml \
            tools/apply_org_responsibility_preview_temp.py
          git commit -m "feat: preview organization teaching responsibility before save"
          git push origin HEAD:ux/organization-responsibility-preview
