name: Apply navigation patch

on:
  push:
    branches:
      - ux/navigation-architecture-v2
    paths:
      - .xueqing-navigation.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply scripted edit
        run: python3 .xueqing-navigation.py

      - name: Remove one-shot edit assets
        run: |
          rm -f .xueqing-navigation.py .github/workflows/apply-navigation-patch.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format touched Dart files
        run: dart format lib/features/design_v2/v2_workspace_preview.dart test/features/design_v2_workspace_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run focused navigation tests
        id: focused
        shell: bash
        run: |
          set +e
          flutter test test/features/design_v2_workspace_test.dart test/features/android_predictive_back_contract_test.dart 2>&1 | tee .navigation-focused-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Capture focused failure diagnostics
        if: failure() && steps.focused.outcome == 'failure'
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .navigation-focused-test.log
          git commit -m "ci: capture navigation test failure"
          git push origin HEAD:ux/navigation-architecture-v2

      - name: Run full test suite
        run: flutter test

      - name: Commit verified navigation change
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(android): use direct-manipulation root paging"
          git push origin HEAD:ux/navigation-architecture-v2
