name: Apply workflow clarity v0.2.1

on:
  push:
    branches:
      - ux/workflow-clarity-v021

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply focused UX patch
        run: python3 tool/apply_workflow_clarity_v021.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart lib/features/organization_management/presentation/organization_management_layout.dart lib/features/organization_management/presentation/organization_management_rows.dart test/features/workflow_clarity_contract_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated product changes
        run: |
          rm -f tool/apply_workflow_clarity_v021.py .github/workflows/apply-workflow-clarity-v021.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "UX: simplify teacher and manager workflow clarity"
          git push origin HEAD:ux/workflow-clarity-v021
