name: v0.3.3 failure index

on:
  push:
    branches:
      - ux/v0.3.3-cross-platform-polish
    paths:
      - .github/workflows/v033-failure-index.yml

permissions:
  contents: write

jobs:
  index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/v0.3.3-cross-platform-polish
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Index failing tests
        shell: bash
        run: |
          set +e
          flutter test --machine > /tmp/tests.jsonl 2>/tmp/tests.stderr
          test_exit=$?
          set -e
          mkdir -p diagnostics
          TEST_EXIT="$test_exit" python3 - <<'PY'
          import json, os
          tests = {}
          errors = {}
          failed = []
          with open('/tmp/tests.jsonl', errors='replace') as f:
              for line in f:
                  try:
                      e = json.loads(line)
                  except Exception:
                      continue
                  t = e.get('type')
                  if t == 'testStart':
                      test = e.get('test', {})
                      tests[test.get('id')] = (test.get('name'), test.get('url'))
                  elif t == 'error':
                      errors.setdefault(e.get('testID'), []).append(e.get('error', ''))
                  elif t == 'testDone' and e.get('result') not in ('success', 'skipped'):
                      failed.append((e.get('testID'), e.get('result')))
          out = [f"exit_code={os.environ['TEST_EXIT']}", f"failed_count={len(failed)}"]
          for tid, result in failed:
              name, url = tests.get(tid, ('<unknown>', '<unknown>'))
              out += [f"FAIL {result}: {name}", f"URL: {url}"]
              for err in errors.get(tid, []):
                  out.append('ERROR: ' + err.replace('\n', ' | ')[:2500])
          stderr = open('/tmp/tests.stderr', errors='replace').read().strip()
          if stderr:
              out.append('STDERR: ' + stderr[-4000:].replace('\n', ' | '))
          open('diagnostics/v033-failure-index.txt','w').write('\n'.join(out) + '\n')
          PY
          rm .github/workflows/v033-failure-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/v033-failure-index.txt .github/workflows/v033-failure-index.yml
          git commit -m "Capture v0.3.3 failure index"
          git push origin HEAD:ux/v0.3.3-cross-platform-polish
