name: Repair public client config and publish Xueqing v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-requests/v0.2.0-public-client-fallback"

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-and-publish-xueqing-v0.2.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.2.0
  RELEASE_VERSION: 0.2.0+2
  RELEASE_COMMIT: 0051afa56f1229f5cac83221648ef2546cf277ac
  PUBLIC_SUPABASE_URL: https://czuctoulgnfytcfonkhc.supabase.co
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yjUy-gjUSSFkCpbK_AjLSA_I0FgOXTI
  PUBLIC_SUPABASE_ALLOWED_HOSTS: czuctoulgnfytcfonkhc.supabase.co

jobs:
  repair-and-dispatch:
    name: Patch public release config and dispatch signed Stable build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify permanent signing material is still configured
        shell: bash
        env:
          XUEQING_ANDROID_CERT_SHA256: ${{ vars.XUEQING_ANDROID_CERT_SHA256 || '' }}
          XUEQING_ANDROID_KEYSTORE_BASE64: ${{ secrets.XUEQING_ANDROID_KEYSTORE_BASE64 }}
          XUEQING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.XUEQING_ANDROID_KEYSTORE_PASSWORD }}
          XUEQING_ANDROID_KEY_ALIAS: ${{ secrets.XUEQING_ANDROID_KEY_ALIAS }}
          XUEQING_ANDROID_KEY_PASSWORD: ${{ secrets.XUEQING_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required_names=(
            XUEQING_ANDROID_CERT_SHA256
            XUEQING_ANDROID_KEYSTORE_BASE64
            XUEQING_ANDROID_KEYSTORE_PASSWORD
            XUEQING_ANDROID_KEY_ALIAS
            XUEQING_ANDROID_KEY_PASSWORD
          )
          missing=()
          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing permanent Android release configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          cert_sha="$(printf '%s' "$XUEQING_ANDROID_CERT_SHA256" | sed 's/[:[:space:]]//g' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$cert_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Pinned Android certificate fingerprint is malformed."
            exit 1
          fi
          echo "Permanent Android signing material is configured; secret values were not printed."

      - name: Patch only the public Supabase client fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          expr_open = '$' + '{{'
          expr_close = '}}'

          def old_line(name):
              return f"  {name}: {expr_open} vars.{name} || '' {expr_close}"

          def new_line(name, value):
              return f"  {name}: {expr_open} vars.{name} || '{value}' {expr_close}"

          values = {
              'XUEQING_SUPABASE_URL': os.environ['PUBLIC_SUPABASE_URL'],
              'XUEQING_SUPABASE_PUBLISHABLE_KEY': os.environ['PUBLIC_SUPABASE_PUBLISHABLE_KEY'],
              'XUEQING_SUPABASE_ALLOWED_HOSTS': os.environ['PUBLIC_SUPABASE_ALLOWED_HOSTS'],
          }
          replacements = {
              old_line(name): new_line(name, value)
              for name, value in values.items()
          }

          paths = [
              Path('.github/workflows/publish-release-assets.yml'),
              Path('.github/workflows/bootstrap-stable-v0.2.0.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only)"
          expected=$'.github/workflows/bootstrap-stable-v0.2.0.yml\n.github/workflows/publish-release-assets.yml'
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected changed files:\n%s\n' "$changed"
            exit 1
          fi
          git diff -- .github/workflows/bootstrap-stable-v0.2.0.yml .github/workflows/publish-release-assets.yml

      - name: Commit public client fallback to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bootstrap-stable-v0.2.0.yml .github/workflows/publish-release-assets.yml
          git commit -m "release: configure verified public Supabase client fallback"
          git push origin HEAD:main

      - name: Create or verify v0.2.0 staging Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
            RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os
          release = json.loads(os.environ['RELEASE_JSON'])
          if release['isDraft'] or not release['isPrerelease']:
              raise SystemExit('Existing v0.2.0 Release is not a published Pre-release staging Release.')
          PY
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --prerelease \
              --title "Xueqing v0.2.0" \
              --notes "首个 Stable 候选：权限边界、成员姓名、Evidence 图片附件、Windows 安装与应用内更新链已完成自动化 Gate。"
          fi
          actual_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          if [[ "$actual_commit" != "$RELEASE_COMMIT" ]]; then
            echo "v0.2.0 does not point to the frozen candidate commit."
            exit 1
          fi

      - name: Dispatch existing signed production release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run publish-release-assets.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f release_tag="$RELEASE_TAG" \
              -f app_version="$RELEASE_VERSION" \
              -f release_notes=$'首个 Stable 试点版本\n负责人/管理员权限边界收口\n成员姓名维护与组织管理体验修复\nEvidence 图片附件与 Windows 安装/应用内更新链完善'; then
              echo "Stable release workflow dispatched for $RELEASE_TAG ($RELEASE_VERSION)."
              exit 0
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "Could not dispatch the Stable release workflow after repository propagation retries."
              exit 1
            fi
            sleep 3
          done
