name: Apply Today bounded preview

on:
  push:
    branches:
      - ux/today-bounded-preview

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/today-bounded-preview
          fetch-depth: 0

      - name: Apply exact patch
        run: python3 .github/scripts/zz_apply_today_bounded_preview.py

      - name: Verify and commit
        run: |
          rm .github/workflows/zz-apply-today-bounded-preview.yml
          rm .github/scripts/zz_apply_today_bounded_preview.py
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/zz_apply_today_bounded_preview.py' \
            '.github/workflows/zz-apply-today-bounded-preview.yml' \
            'lib/features/teacher_workspace/presentation/teacher_workspace_page.dart' \
            'test/features/teacher_workspace_test.dart' | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ux: bound lower-priority Today sections'
          git push origin HEAD:ux/today-bounded-preview
