name: v0.3.2 durable Android composer recovery Gate C

on:
  push:
    branches:
      - hotfix/v0.3.2-real-device-ux
    paths:
      - tools/v032_gate_c.py
      - tools/v032_gate_c_fix.py
      - tools/v032_gate_c_test_fix.py
      - .github/workflows/v032-gate-c.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply isolated patch
        run: |
          python3 tools/v032_gate_c.py
          python3 tools/v032_gate_c_fix.py
          python3 tools/v032_gate_c_test_fix.py

      - name: Get packages
        run: flutter pub get

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Format changed Dart
        run: dart format lib test

      - name: Diff hygiene
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Focused recovery regressions
        run: |
          flutter test test/features/evidence_attachment_picker_test.dart
          flutter test test/features/v2_quick_capture_recovery_test.dart
          flutter test test/features/v2_quick_capture_runtime_recovery_test.dart
          flutter test test/features/v032_progress_recovery_test.dart

      - name: Full Flutter tests with diagnostic capture
        id: full_tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/v032-full-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Extract concise failure diagnostics
        if: steps.full_tests.outputs.status != '0'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/v032-full-test.log')
          target = Path('/tmp/v032-full-test-failure.txt')
          lines = source.read_text(errors='replace').splitlines()
          needles = (
              'Test failed',
              'Some tests failed',
              'Expected:',
              'Actual:',
              'Which:',
              '══╡ EXCEPTION',
              'TestFailure',
              'package:test_api',
              'package:flutter_test',
              '[E]',
          )
          selected = set()
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  start = max(0, index - 18)
                  end = min(len(lines), index + 35)
                  selected.update(range(start, end))
          selected.update(range(max(0, len(lines) - 220), len(lines)))
          excerpt = [lines[index] for index in sorted(selected)]
          target.write_text('\n'.join(excerpt) + '\n')
          print(target.read_text())
          PY

      - name: Upload full-suite failure diagnostics
        if: steps.full_tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: v032-gate-c-full-test-failure
          path: /tmp/v032-full-test-failure.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce full-suite result
        if: steps.full_tests.outputs.status != '0'
        run: |
          echo "Full Flutter suite failed; diagnostics were captured above and uploaded."
          exit 1

      - name: Commit verified product changes and remove harness
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/v032_gate_c.py tools/v032_gate_c_fix.py tools/v032_gate_c_test_fix.py .github/workflows/v032-gate-c.yml
          git add lib test
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Protect Android camera drafts for quick capture and progress"
          git push origin HEAD:hotfix/v0.3.2-real-device-ux
