name: One-off v0.3.1 low-risk hotfix

on:
  push:
    branches:
      - hotfix/v0.3.1-reliability-mobile
    paths:
      - .github/workflows/oneoff-v031-low-risk.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.3.1-reliability-mobile
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install icon generator dependency
        run: python3 -m pip install --quiet pillow

      - name: Apply focused fixes
        run: python3 .github/scripts/apply_v031_low_risk.py

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter pub get; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1

      - name: Format verified changes
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/export/learning_record_export_test.dart
          flutter test test/features/design_v2_workspace_test.dart
          flutter test test/release_app_icon_contract_test.dart

      - name: Full tests
        run: flutter test

      - name: Verify patch boundary
        shell: bash
        run: |
          git diff --check
          git status --short
          if git diff --name-only | grep -E '^(supabase/|lib/features/organization_management/)'; then
            echo 'Low-risk gate unexpectedly touched database or management files.' >&2
            exit 1
          fi

      - name: Commit verified product changes and remove one-off harness
        shell: bash
        run: |
          rm -f .github/scripts/apply_v031_low_risk.py
          rm -f .github/workflows/oneoff-v031-low-risk.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix Windows export and Android shell ergonomics'
          git push origin HEAD:hotfix/v0.3.1-reliability-mobile
