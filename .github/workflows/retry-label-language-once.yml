name: One-shot retry label language cleanup

on:
  push:
    branches:
      - ux/teacher-error-language
    paths:
      - .github/workflows/retry-label-language-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-error-language
          fetch-depth: 0

      - name: Replace developer-facing retry label
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              'lib/features/teacher_workspace/presentation/progressive_case_forms.dart': 2,
              'lib/features/teacher_workspace/presentation/teacher_workspace_page.dart': 2,
              'test/features/teacher_workspace_test.dart': 2,
          }
          for path, expected in targets.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count('重试原提交')
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} retry labels, found {count}')
              p.write_text(text.replace('重试原提交', '重新保存'), encoding='utf-8')
          PY

      - name: Verify exact scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "$(printf '%s\n' \
            lib/features/teacher_workspace/presentation/progressive_case_forms.dart \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            test/features/teacher_workspace_test.dart | sort | tr '\n' ' ')"

      - name: Commit real patch and remove one-shot workflow
        run: |
          rm .github/workflows/retry-label-language-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: use natural retry labels for teachers"
          git push origin HEAD:ux/teacher-error-language
