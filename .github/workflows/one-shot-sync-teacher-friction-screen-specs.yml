name: One-shot sync teacher recording screen specs

on:
  push:
    branches:
      - ux/teacher-friction-reduction
    paths:
      - .github/workflows/one-shot-sync-teacher-friction-screen-specs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-friction-reduction
      - name: Sync SCREEN_SPECS with lightweight recording contract
        run: python .github/scripts/sync_teacher_friction_screen_specs.py
      - name: Remove one-shot tooling
        run: |
          rm .github/scripts/sync_teacher_friction_screen_specs.py
          rm .github/workflows/one-shot-sync-teacher-friction-screen-specs.yml
      - name: Commit synced specification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/SCREEN_SPECS.md .github/scripts/sync_teacher_friction_screen_specs.py .github/workflows/one-shot-sync-teacher-friction-screen-specs.yml
          git commit -m "docs: align screen specs with lightweight recording"
          git push origin HEAD:ux/teacher-friction-reduction
