name: v0.3.6 implementation runner

on:
  push:
    branches:
      - feature/v0.3.6-learning-record-organization
    paths:
      - .github/workflows/v036-implementation-runner.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3.6-learning-record-organization
          fetch-depth: 0

      - name: Apply bounded UI and contract patch
        run: |
          python3 tool/v036_apply_ui_and_contracts.py
          python3 tool/v036_fix_after_analyze.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: v0.3.6 focused tests
        run: |
          flutter test test/features/v032_case_media_void_contract_test.dart
          flutter test test/features/v036_learning_record_organization_contract_test.dart
          flutter test test/features/design_v2_workflow_controller_test.dart
          flutter test test/export/student_learning_record_export_test.dart
          flutter test test/update/stable_release_workflow_contract_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit verified implementation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # The implementation patch updates the stable publisher so the tests
          # exercise the intended v0.3.6 gate. Keep that workflow change out of
          # the Actions-token push; it is committed separately through the
          # repository connection with explicit workflow permission.
          git checkout -- .github/workflows/publish-release-assets.yml
          rm -f tool/v036_apply_ui_and_contracts.py tool/v036_fix_after_analyze.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tool/v036_apply_ui_and_contracts.py tool/v036_fix_after_analyze.py
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "UX: organize learning records and selective export"
          git push origin HEAD:feature/v0.3.6-learning-record-organization
