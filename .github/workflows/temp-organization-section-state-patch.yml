name: Temporary Organization section state patch

on:
  push:
    branches:
      - ui/organization-section-state-continuity
    paths:
      - .github/organization-section-state-marker

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui/organization-section-state-continuity
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply and format scoped patch
        run: |
          python3 .github/scripts/temp_apply_organization_section_state.py
          dart format \
            lib/features/design_v2/v2_organization_workspace_page.dart \
            test/features/v2_typed_organization_navigation_test.dart
          git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/design_v2/v2_organization_workspace_page.dart \
                  test/features/v2_typed_organization_navigation_test.dart \
                  docs/design/NAVIGATION_STATE_AUDIT.md
          git commit -m "refactor(ui): preserve Organization learning context across sections"
          git push origin HEAD:ui/organization-section-state-continuity
