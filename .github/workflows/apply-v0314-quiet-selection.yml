name: Apply v0.3.14 quiet selection state

on:
  push:
    branches:
      - polish/v0314-quiet-selection-state
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: polish/v0314-quiet-selection-state
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply quiet selection polish
        run: python .github/scripts/apply_v0314_quiet_selection.py

      - name: Get packages
        run: flutter pub get

      - name: Verify lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib/features/design_v2/v2_workspace_preview.dart test/features/v2_quiet_selection_state_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused acceptance
        run: flutter test test/features/v2_quiet_selection_state_test.dart test/features/design_v2_workspace_test.dart

      - name: Full Flutter suite
        run: flutter test

      - name: Commit verified product change only
        run: |
          git add lib/features/design_v2/v2_workspace_preview.dart
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "polish: quiet workspace rail selection state"
          git push origin HEAD:polish/v0314-quiet-selection-state
