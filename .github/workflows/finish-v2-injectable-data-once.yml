name: Finish V2 injectable workspace data once

on:
  push:
    paths:
      - .github/workflows/finish-v2-injectable-data-once.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-injectable-workspace-data

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Patch helper assertion
        run: python3 .github/scripts/patch_finish_v2_injectable_helper.py

      - name: Apply V2 data-injection refactor
        run: python3 .github/scripts/finish_v2_injectable_data_once.py

      - name: Format changed Dart files
        run: dart format lib/features/design_v2/v2_workspace_preview.dart lib/features/design_v2/v2_workspace_data.dart lib/features/design_v2/v2_read_model_adapter.dart test/features/design_v2_read_model_adapter_test.dart test/features/design_v2_workspace_data_injection_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run V2 semantic tests
        run: flutter test test/features/design_v2_workspace_test.dart test/features/design_v2_composers_test.dart test/features/design_v2_read_model_adapter_test.dart test/features/design_v2_workspace_data_injection_test.dart

      - name: Commit verified refactor and remove temporary helpers
        shell: bash
        run: |
          git rm .github/workflows/finish-v2-injectable-data-once.yml
          git rm .github/scripts/finish_v2_injectable_data_once.py
          git rm .github/scripts/patch_finish_v2_injectable_helper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/design_v2 test/features
          git commit -m "ui(v2): inject workspace data safely"
          git push origin HEAD:ui/v2-injectable-workspace-data
