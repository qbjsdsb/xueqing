name: Apply detail rhythm polish

on:
  push:
    paths:
      - '.github/detail-rhythm-polish.trigger'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused UX patch
        run: |
          python .github/patches/apply_detail_rhythm_polish.py
          python .github/patches/apply_detail_rhythm_test_contract.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format affected files
        run: dart format lib/features/design_v2/v2_workspace_preview.dart test/features/v2_student_focus_presentation_test.dart test/features/design_v2_workspace_test.dart

      - name: Verify diff hygiene
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              'lib/features/design_v2/v2_workspace_preview.dart',
              'test/features/v2_student_focus_presentation_test.dart',
              'test/features/design_v2_workspace_test.dart',
              '.github/patches/apply_detail_rhythm_polish.py',
              '.github/patches/apply_detail_rhythm_test_contract.py',
              '.github/workflows/apply-detail-rhythm-polish.yml',
              '.github/detail-rhythm-polish.trigger',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected files: {sorted(unexpected)}')
          PY

      - name: Run focused UX tests
        run: |
          flutter test test/features/v2_student_focus_presentation_test.dart
          flutter test test/features/v2_final_ergonomics_test.dart
          flutter test test/features/v2_page_rhythm_test.dart
          flutter test test/features/design_v2_workspace_test.dart

      - name: Analyze focused implementation
        run: flutter analyze lib/features/design_v2/v2_workspace_preview.dart test/features/v2_student_focus_presentation_test.dart test/features/design_v2_workspace_test.dart

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/patches/apply_detail_rhythm_polish.py
          rm -f .github/patches/apply_detail_rhythm_test_contract.py
          rm -f .github/workflows/apply-detail-rhythm-polish.yml
          rm -f .github/detail-rhythm-polish.trigger
          git diff --check

      - name: Commit clean result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          python - <<'PY'
          import subprocess
          allowed = {
              'lib/features/design_v2/v2_workspace_preview.dart',
              'test/features/v2_student_focus_presentation_test.dart',
              'test/features/design_v2_workspace_test.dart',
              '.github/patches/apply_detail_rhythm_polish.py',
              '.github/patches/apply_detail_rhythm_test_contract.py',
              '.github/workflows/apply-detail-rhythm-polish.yml',
              '.github/detail-rhythm-polish.trigger',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'final commit contains unexpected files: {sorted(unexpected)}')
          PY
          git commit -m "polish(v2): refine student and case detail rhythm"
          git push origin HEAD
