name: Refine Student row copy

on:
  push:
    branches:
      - ux/student-detail-reduction

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/student-detail-reduction
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Apply refinement and regression
        run: |
          python3 .github/scripts/zz_refine_student_row_copy.py
          dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
          flutter test test/features/teacher_workspace_test.dart
      - name: Verify scope and commit
        run: |
          rm .github/workflows/zz-refine-student-row-copy.yml
          rm .github/scripts/zz_refine_student_row_copy.py
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/zz_refine_student_row_copy.py' \
            '.github/workflows/zz-refine-student-row-copy.yml' \
            'lib/features/teacher_workspace/presentation/teacher_workspace_page.dart' \
            'test/features/teacher_workspace_test.dart' | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ux: describe only active problems in student rows'
          git push origin HEAD:ux/student-detail-reduction
