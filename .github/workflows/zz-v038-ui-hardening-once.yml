name: One-shot organization UI hardening

on:
  push:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.3.8-final-hardening
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Apply exact patches
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v038_patch.py
          python3 /tmp/v038_patch.py
      - run: flutter pub get
      - run: dart format lib/features/design_v2/v2_organization_workspace_page.dart test/features/v2_organization_quick_capture_test.dart test/features/v2_organization_workspace_test.dart
      - run: flutter analyze
      - run: flutter test test/features/v2_organization_quick_capture_test.dart test/features/v2_organization_workspace_test.dart
      - name: Commit verified patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/zz-v038-ui-hardening-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/design_v2/v2_organization_workspace_page.dart test/features/v2_organization_quick_capture_test.dart test/features/v2_organization_workspace_test.dart .github/workflows/zz-v038-ui-hardening-once.yml
          git commit -m "v2: harden organization search and expansion affordance"
          git push origin HEAD:release/v0.3.8-final-hardening
