name: One-shot organization UI hardening

on: [push]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.3.8-final-hardening
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Apply exact patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(source.replace(old, new, 1))

          org = 'lib/features/design_v2/v2_organization_workspace_page.dart'
          replace_once(
              org,
              """            ...student.subjects,
            for (final item in items) ...[""",
              """            ...student.subjects,
            _responsibilitySummaryForStudent(student),
            for (final item in items) ...[""",
          )
          replace_once(
              org,
              """    return ExpansionTile(
      tilePadding: const EdgeInsets.symmetric(horizontal: 4, vertical: 4),""",
              """    return ExpansionTile(
      controlAffinity: ListTileControlAffinity.leading,
      tilePadding: const EdgeInsets.symmetric(horizontal: 4, vertical: 4),""",
          )

          capture_test = 'test/features/v2_organization_quick_capture_test.dart'
          replace_once(
              capture_test,
              """      expect(find.textContaining('主责：语文 张老师'), findsOneWidget);
      await tester.tap(
        find.byKey(const Key('v2-organization-quick-capture-student-1')),
      );""",
              """      expect(find.textContaining('主责：语文 张老师'), findsOneWidget);
      await tester.enterText(
        find.byKey(const Key('v2-organization-learning-search')),
        '张老师',
      );
      await tester.pumpAndSettle();
      expect(find.text('机构学生'), findsOneWidget);
      await tester.enterText(
        find.byKey(const Key('v2-organization-learning-search')),
        '',
      );
      await tester.pumpAndSettle();
      await tester.tap(
        find.byKey(const Key('v2-organization-quick-capture-student-1')),
      );""",
          )

          workspace_test = 'test/features/v2_organization_workspace_test.dart'
          replace_once(
              workspace_test,
              """      expect(find.byKey(const Key('v2-today-quick-capture')), findsNothing);

      await tester.tap(find.text('机构学生一'));""",
              """      expect(find.byKey(const Key('v2-today-quick-capture')), findsNothing);
      expect(find.byIcon(Icons.expand_more), findsWidgets);

      await tester.tap(find.text('机构学生一'));""",
          )
          PY
      - run: flutter pub get
      - run: dart format lib/features/design_v2/v2_organization_workspace_page.dart test/features/v2_organization_quick_capture_test.dart test/features/v2_organization_workspace_test.dart
      - run: flutter analyze
      - run: flutter test test/features/v2_organization_quick_capture_test.dart test/features/v2_organization_workspace_test.dart
      - name: Commit verified patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/zz-v038-ui-hardening-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/design_v2/v2_organization_workspace_page.dart test/features/v2_organization_quick_capture_test.dart test/features/v2_organization_workspace_test.dart .github/workflows/zz-v038-ui-hardening-once.yml
          git commit -m "v2: harden organization search and expansion affordance"
          git push origin HEAD:release/v0.3.8-final-hardening
