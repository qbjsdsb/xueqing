name: Apply Windows navigation audit closure fixes

on:
  push:
    branches:
      - ux/windows-organization-navigation-v2
    paths:
      - .xueqing-audit-fix-241.py
      - .xueqing-audit-fix-241-contract.py
      - .xueqing-audit-fix-241-behavior.py
      - .xueqing-audit-fix-241-contract-format.py
      - .github/workflows/apply-audit-fix-241.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audit closure fixes
        run: |
          python3 .xueqing-audit-fix-241.py
          python3 .xueqing-audit-fix-241-contract.py
          python3 .xueqing-audit-fix-241-behavior.py
          python3 .xueqing-audit-fix-241-contract-format.py

      - name: Remove one-shot assets
        run: |
          rm -f \
            .xueqing-audit-fix-241.py \
            .xueqing-audit-fix-241-contract.py \
            .xueqing-audit-fix-241-behavior.py \
            .xueqing-audit-fix-241-contract-format.py \
            .github/workflows/apply-audit-fix-241.yml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      - name: Format touched files
        run: |
          dart format \
            lib/features/design_v2/v2_workspace_navigation.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/design_v2/v2_organization_workspace_page.dart \
            lib/features/organization_management/presentation/organization_management_page.dart \
            lib/features/organization_management/presentation/organization_management_areas.dart \
            test/features/organization_navigation_state_contract_test.dart \
            test/features/windows_organization_navigation_contract_test.dart \
            test/features/v2_organization_workspace_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused audit regression
        run: |
          flutter test \
            test/features/android_predictive_back_contract_test.dart \
            test/features/design_v2_workspace_test.dart \
            test/features/organization_navigation_state_contract_test.dart \
            test/features/windows_organization_navigation_contract_test.dart \
            test/features/v2_organization_workspace_test.dart \
            test/features/v2_adaptive_workspace_test.dart \
            test/features/v2_typed_organization_navigation_test.dart \
            test/features/v2_shell_production_capabilities_test.dart

      - name: Full suite
        run: flutter test

      - name: Commit verified audit closure
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(windows): close navigation audit gaps"
          git push origin HEAD:ux/windows-organization-navigation-v2
