name: Temporary UX final verification

on:
  push:
    branches:
      - ux/simplify-management-and-member-names

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/simplify-management-and-member-names
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Tighten UI labels and durable widget assertions
        shell: python
        run: |
          from pathlib import Path

          rows = Path('lib/features/organization_management/presentation/organization_management_rows.dart')
          text = rows.read_text(encoding='utf-8')
          old = "label: const Text('停用'),"
          if old not in text:
            raise SystemExit('Expected teacher-scope stop label not found')
          rows.write_text(text.replace(old, "label: const Text('停用教学范围'),", 1), encoding='utf-8')

          test = Path('test/features/organization_management_test.dart')
          text = test.read_text(encoding='utf-8')
          replacements = [
            ("    expect(find.text('已更新 更新学生 · 正常教学。'), findsOneWidget);\n", ''),
            ("    expect(find.text('已添加学科：英语。'), findsOneWidget);\n", ''),
            ("    await tester.tap(find.text('添加学生'));\n    await tester.tap(find.text('添加学生'));",
             "    await tester.ensureVisible(find.text('添加学生'));\n    await tester.tap(find.text('添加学生'));\n    await tester.tap(find.text('添加学生'));"),
            ("    await tester.tap(find.text('添加学科'));\n    await tester.tap(find.text('添加学科'));",
             "    await tester.ensureVisible(find.text('添加学科'));\n    await tester.tap(find.text('添加学科'));\n    await tester.tap(find.text('添加学科'));"),
            ("    await tester.tap(find.text('配置老师可教学科'));\n    await tester.tap(find.text('配置老师可教学科'));",
             "    await tester.ensureVisible(find.text('配置老师可教学科'));\n    await tester.tap(find.text('配置老师可教学科'));\n    await tester.tap(find.text('配置老师可教学科'));"),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected widget-test text not found: {old}')
            text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')

          for temporary in [
            Path('tmp-flutter-test.txt'),
            Path('tmp-flutter-test-status.txt'),
          ]:
            if temporary.exists():
              temporary.unlink()
      - run: flutter pub get
      - run: dart format lib/cloud/organization_member_provisioning_repository.dart lib/features/organization_management/presentation test/features/organization_management_test.dart
      - run: flutter analyze
      - run: flutter test
      - name: Commit verified Flutter fixes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-ux-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: verify simplified organization management UX"
          git push origin HEAD:ux/simplify-management-and-member-names
