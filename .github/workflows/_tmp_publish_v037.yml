name: Temporary dispatch v0.3.7 with verified production inputs

on:
  push:
    branches:
      - release/v0.3.7-version-freeze

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          ref: release/v0.3.7-version-freeze
          fetch-depth: 0

      - name: Recover previously verified production public inputs
        id: production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_log="$(gh run view 34579181374 --repo "$GITHUB_REPOSITORY" --job 103198519947 --log)"
          supabase_url="$(printf '%s\n' "$previous_log" | sed -n 's/.*XUEQING_SUPABASE_URL: //p' | tail -n 1 | tr -d '\r')"
          publishable_key="$(printf '%s\n' "$previous_log" | sed -n 's/.*XUEQING_SUPABASE_PUBLISHABLE_KEY: //p' | tail -n 1 | tr -d '\r')"
          allowed_hosts="$(printf '%s\n' "$previous_log" | sed -n 's/.*XUEQING_SUPABASE_ALLOWED_HOSTS: //p' | tail -n 1 | tr -d '\r')"
          if [[ "$supabase_url" != "https://czuctoulgnfytcfonkhc.supabase.co" ]]; then
            echo "Unexpected production Supabase URL recovered from verified release evidence."
            exit 1
          fi
          if [[ "$allowed_hosts" != "czuctoulgnfytcfonkhc.supabase.co" ]]; then
            echo "Unexpected production allowed-host value recovered from verified release evidence."
            exit 1
          fi
          if [[ "$publishable_key" != sb_publishable_* ]]; then
            echo "A valid public Supabase publishable key was not recovered from verified release evidence."
            exit 1
          fi
          {
            echo "supabase_url=$supabase_url"
            echo "publishable_key=$publishable_key"
            echo "allowed_hosts=$allowed_hosts"
          } >> "$GITHUB_OUTPUT"

      - name: Verify staging target and dispatch publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ steps.production.outputs.supabase_url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.production.outputs.publishable_key }}
          SUPABASE_ALLOWED_HOSTS: ${{ steps.production.outputs.allowed_hosts }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$main_sha" != "e73faa37f8cdeda54c13d1b555602208e290fe9e" ]]; then
            echo "main moved after v0.3.7 release freeze: $main_sha"
            exit 1
          fi
          release_json="$(gh release view v0.3.7 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          RELEASE_JSON="$release_json" python3 - <<'PY'
          import json, os
          release = json.loads(os.environ['RELEASE_JSON'])
          if release['isDraft'] or not release['isPrerelease']:
              raise SystemExit('v0.3.7 is not in the required staging prerelease state')
          PY
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/v0.3.7" --jq '.sha')"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "v0.3.7 tag mismatch: $tag_sha != $main_sha"
            exit 1
          fi
          notes=$'教师高频操作进一步收口，单一问题直接记进展，多问题选择信息更清楚\n学生列表与成长时间线按真实最近活动与发生时间呈现\nQuick Capture 支持主动续记到已有问题，并保留已输入事实与图片\n待复检问题续记仍按新表现记录，不擅自解释为检查结果\n优化 320px 窄屏、大字号中文、键盘与图片记录体验'
          gh workflow run publish-release-assets.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag=v0.3.7 \
            -f app_version=0.3.7+15 \
            -f release_notes="$notes" \
            -f supabase_url="$SUPABASE_URL" \
            -f supabase_publishable_key="$SUPABASE_PUBLISHABLE_KEY" \
            -f supabase_allowed_hosts="$SUPABASE_ALLOWED_HOSTS"

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qbjsdsb'
          git config user.email '3342513714@qq.com'
          git rm .github/workflows/_tmp_publish_v037.yml
          git commit -m 'chore: remove temporary v0.3.7 verified-input dispatch trigger'
          git push origin HEAD:release/v0.3.7-version-freeze
