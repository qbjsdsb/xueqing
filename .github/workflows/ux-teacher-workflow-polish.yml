name: UX teacher workflow polish

on:
  push:
    branches:
      - ux/teacher-workflow-polish-20260908

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[ux-polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/teacher-workflow-polish-20260908
          fetch-depth: 0

      - name: Apply teacher workflow polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/teacher_workspace/presentation/teacher_workspace_page.dart')
          text = path.read_text(encoding='utf-8')

          old_footer = """          Padding(
            padding: EdgeInsets.fromLTRB(
              extended ? AppSpacing.lg : AppSpacing.sm,
              AppSpacing.sm,
              AppSpacing.sm,
              AppSpacing.lg,
            ),
            child: Row(
              children: [
                Expanded(
                  child: Text(
                    extended ? '开发数据 · 仅当前权限范围' : '开发数据',
                    textAlign: extended ? TextAlign.start : TextAlign.center,
                    style: Theme.of(context).textTheme.bodySmall,
                  ),
                ),
                if (onCheckForUpdates != null)
                  IconButton(
                    tooltip: '检查更新',
                    onPressed: checkingForUpdates ? null : onCheckForUpdates,
                    icon: checkingForUpdates
                        ? const SizedBox(
                            width: 20,
                            height: 20,
                            child: CircularProgressIndicator(strokeWidth: 2),
                          )
                        : const Icon(Icons.system_update_alt),
                  ),
                if (extended && onSignOut != null)
                  IconButton(
                    tooltip: '退出登录',
                    onPressed: onSignOut,
                    icon: Icon(Icons.logout),
                  ),
              ],
            ),
          ),
"""
          new_footer = """          Padding(
            padding: EdgeInsets.fromLTRB(
              extended ? AppSpacing.lg : AppSpacing.sm,
              AppSpacing.sm,
              AppSpacing.sm,
              AppSpacing.lg,
            ),
            child: extended
                ? Row(
                    children: [
                      Expanded(
                        child: Text(
                          '权限内数据',
                          style: Theme.of(context).textTheme.bodySmall,
                        ),
                      ),
                      if (onCheckForUpdates != null)
                        IconButton(
                          tooltip: '检查更新',
                          onPressed: checkingForUpdates
                              ? null
                              : onCheckForUpdates,
                          icon: checkingForUpdates
                              ? const SizedBox(
                                  width: 20,
                                  height: 20,
                                  child: CircularProgressIndicator(
                                    strokeWidth: 2,
                                  ),
                                )
                              : const Icon(Icons.system_update_alt),
                        ),
                      if (onSignOut != null)
                        IconButton(
                          tooltip: '退出登录',
                          onPressed: onSignOut,
                          icon: const Icon(Icons.logout),
                        ),
                    ],
                  )
                : Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      if (onCheckForUpdates != null)
                        IconButton(
                          tooltip: '检查更新',
                          onPressed: checkingForUpdates
                              ? null
                              : onCheckForUpdates,
                          icon: checkingForUpdates
                              ? const SizedBox(
                                  width: 20,
                                  height: 20,
                                  child: CircularProgressIndicator(
                                    strokeWidth: 2,
                                  ),
                                )
                              : const Icon(Icons.system_update_alt),
                        ),
                      if (onSignOut != null)
                        IconButton(
                          tooltip: '退出登录',
                          onPressed: onSignOut,
                          icon: const Icon(Icons.logout),
                        ),
                    ],
                  ),
          ),
"""

          if old_footer not in text:
              raise SystemExit('Expected workspace rail footer was not found; refusing to patch.')
          text = text.replace(old_footer, new_footer, 1)

          old_label = '              labelType: NavigationRailLabelType.none,\n'
          new_label = """              labelType: extended
                  ? NavigationRailLabelType.none
                  : NavigationRailLabelType.all,
"""
          if text.count(old_label) != 1:
              raise SystemExit(
                  f'Expected exactly one workspace rail labelType, found {text.count(old_label)}.'
              )
          text = text.replace(old_label, new_label, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/ux-teacher-workflow-polish.yml')
          workflow.unlink()
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format touched Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart lib/features/organization_management/presentation/organization_management_layout.dart

      - name: Check whitespace
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run focused widget tests
        run: flutter test test/features/teacher_workspace_test.dart test/features/organization_management_test.dart test/app/theme_test.dart

      - name: Commit verified polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "Polish teacher workspace navigation [ux-polish-applied]"
          git push origin HEAD:ux/teacher-workflow-polish-20260908
