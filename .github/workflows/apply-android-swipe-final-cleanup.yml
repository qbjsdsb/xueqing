name: Apply Android swipe final cleanup

on:
  push:
    branches:
      - ux/android-root-swipe-navigation-20260913
    paths:
      - .github/android-swipe-final-cleanup.trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ux/android-root-swipe-navigation-20260913

      - name: Remove accidental compact divider
        run: python3 .github/scripts/android_swipe_final_cleanup.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format focused file
        run: dart format lib/features/design_v2/v2_workspace_preview.dart

      - name: Verify diff hygiene
        run: git diff --check

      - name: Run focused navigation tests
        run: flutter test test/features/design_v2_workspace_test.dart test/features/android_predictive_back_contract_test.dart

      - name: Analyze focused implementation
        run: flutter analyze lib/features/design_v2/v2_workspace_preview.dart test/features/design_v2_workspace_test.dart test/features/android_predictive_back_contract_test.dart

      - name: Remove temporary machinery
        run: rm -f .github/workflows/apply-android-swipe-final-cleanup.yml .github/android-swipe-final-cleanup.trigger .github/scripts/android_swipe_final_cleanup.py

      - name: Commit clean result
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "polish(android): keep compact navigation visually quiet"
          git push origin HEAD:ux/android-root-swipe-navigation-20260913
