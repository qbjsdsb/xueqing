name: Apply management navigation fix

on:
  push:
    branches:
      - fix/management-only-navigation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/management-only-navigation

      - name: Apply exact two-file patch
        env:
          GUARD_B64: 
          TEST_B64: 
        run: |
          python3 -c "import base64,os; from pathlib import Path; p=Path('lib/features/teacher_workspace/presentation/teacher_workspace_page.dart'); s=p.read_text(); a=s.index('class _WorkspaceShell extends StatelessWidget'); r=s.index('    return ResponsiveLayout(',a); m='A management-only account has one valid workspace surface'; assert m not in s; g=base64.b64decode(os.environ['GUARD_B64']).decode(); p.write_text(s[:r]+g+s[r:]); t=Path('test/features/teacher_workspace_test.dart'); x=t.read_text(); tm='renders management-only accounts without a navigation assertion'; assert tm not in x and x.endswith('}\\n'); b=base64.b64decode(os.environ['TEST_B64']).decode(); t.write_text(x[:-2]+b+'}\\n')"
          rm .github/workflows/zz-apply-management-navigation-fix.yml

      - name: Verify and commit
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/zz-apply-management-navigation-fix.yml lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render management-only workspace without navigation'
          git push origin HEAD:fix/management-only-navigation
