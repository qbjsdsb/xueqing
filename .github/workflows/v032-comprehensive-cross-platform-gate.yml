name: v0.3.2 comprehensive cross-platform Gate E

on:
  push:
    branches:
      - hotfix/v0.3.2-real-device-ux
    paths:
      - ".github/workflows/v032-comprehensive-cross-platform-gate.yml"
      - "tools/v032_comprehensive_gate_patch.py"

permissions:
  contents: write

concurrency:
  group: v032-comprehensive-cross-platform-gate
  cancel-in-progress: false

jobs:
  linux-core-android-security:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages and protect lockfile
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Apply guarded release fixes
        run: python3 tools/v032_comprehensive_gate_patch.py

      - name: Format and inspect patch boundary
        shell: bash
        run: |
          dart format lib/features/design_v2/v2_workspace_preview.dart test/features/design_v2_workspace_test.dart test/features/organization_management_test.dart test/features/v032_real_device_ux_contract_test.dart test/flutter_test_config.dart
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'.gitignore\nlib/features/design_v2/v2_workspace_preview.dart\nsupabase/functions/organization-member-credentials/index.ts\ntest/features/design_v2_workspace_test.dart\ntest/features/organization_management_test.dart\ntest/features/v032_real_device_ux_contract_test.dart\ntest/flutter_test_config.dart'
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected product patch boundary:'
            echo "$changed"
            exit 1
          fi

      - name: Analyze Flutter
        run: flutter analyze

      - name: Run compact navigation regression
        run: flutter test test/features/design_v2_workspace_test.dart

      - name: Run management regression with fatal hit-test warnings
        run: flutter test test/features/organization_management_test.dart

      - name: Run real-device contract regression
        run: flutter test test/features/v032_real_device_ux_contract_test.dart

      - name: Run full Flutter suite
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check member provisioning Edge Function
        run: deno check supabase/functions/organization-member-credentials/index.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Check shell security test syntax
        run: bash -n supabase/tests/old_token_security.sh supabase/tests/remote_security_spike.sh

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from all migrations and seed
        run: supabase db reset

      - name: Run full pgTAP and RLS suite
        run: supabase test db

      - name: Run revoked old-token regression
        run: bash supabase/tests/old_token_security.sh

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop
          fi

  windows-release-updater-installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages and protect lockfile
        shell: pwsh
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
          if ($LASTEXITCODE -ne 0) { throw "pubspec.lock changed during pub get." }

      - name: Apply guarded release fixes
        run: python tools/v032_comprehensive_gate_patch.py

      - name: Format and inspect patch boundary
        shell: pwsh
        run: |
          dart format lib/features/design_v2/v2_workspace_preview.dart test/features/design_v2_workspace_test.dart test/features/organization_management_test.dart test/features/v032_real_device_ux_contract_test.dart test/flutter_test_config.dart
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patch contains whitespace errors." }
          $changed = @(git diff --name-only | Sort-Object)
          $expected = @('.gitignore','lib/features/design_v2/v2_workspace_preview.dart','supabase/functions/organization-member-credentials/index.ts','test/features/design_v2_workspace_test.dart','test/features/organization_management_test.dart','test/features/v032_real_device_ux_contract_test.dart','test/flutter_test_config.dart')
          if ((Compare-Object $changed $expected).Count -ne 0) { throw "Unexpected product patch boundary: $($changed -join ', ')" }

      - name: Analyze Flutter on Windows
        run: flutter analyze

      - name: Run full Flutter suite on Windows
        run: flutter test

      - name: Build Windows release bundle
        shell: pwsh
        run: flutter build windows --release --dart-define="XUEQING_ALLOW_DEVELOPMENT_RELEASE=true"

      - name: Bundle and verify Visual C++ release runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio locator was not found." }
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw "Visual C++ toolset was not found." }
          $releaseDir = Join-Path $pwd "build/windows/x64/runner/Release"
          $redistRoot = Join-Path $vsPath "VC/Redist/MSVC"
          $runtimeDir = Get-ChildItem -Path $redistRoot -Directory -Recurse | Where-Object { $_.Name -eq 'Microsoft.VC143.CRT' -and (Test-Path (Join-Path $_.FullName 'msvcp140.dll')) -and (Test-Path (Join-Path $_.FullName 'vcruntime140.dll')) -and (Test-Path (Join-Path $_.FullName 'vcruntime140_1.dll')) } | Select-Object -First 1
          if ($null -eq $runtimeDir) { throw "Release Visual C++ runtime was not found." }
          foreach ($name in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) { Copy-Item (Join-Path $runtimeDir.FullName $name) $releaseDir -Force }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath 'VC/Tools/MSVC') -Filter dumpbin.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $dumpbin) { throw "dumpbin.exe was not found." }
          $dependencies = (& $dumpbin.FullName /DEPENDENTS (Join-Path $releaseDir 'xueqing.exe') 2>&1) -join "`n"
          if ($dependencies -match '(?i)MSVCP140D\.dll|VCRUNTIME140D\.dll|VCRUNTIME140_1D\.dll|ucrtbased\.dll') { throw "Release binary depends on a Debug Visual C++ runtime." }

      - name: Analyze and exercise Windows updater helper
        shell: pwsh
        working-directory: tools/windows_updater
        run: |
          dart pub get
          dart analyze
          if ($LASTEXITCODE -ne 0) { throw "Updater analysis failed." }
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'xueqing-updater-fixtures'
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          $helper = Join-Path $fixtureDir 'xueqing_updater_test.exe'
          $bootstrap = Join-Path $fixtureDir 'xueqing_updater_bootstrap.exe'
          $short = Join-Path $fixtureDir 'short_lived_fixture.exe'
          $long = Join-Path $fixtureDir 'long_lived_fixture.exe'
          dart compile exe bin/xueqing_updater.dart -o $helper
          dart compile exe bin/xueqing_updater.dart -o $bootstrap
          dart compile exe test/fixtures/short_lived_fixture.dart -o $short
          dart compile exe test/fixtures/long_lived_fixture.dart -o $long
          $env:XUEQING_UPDATER_HELPER = $helper
          $env:XUEQING_UPDATER_BOOTSTRAP_HELPER = $bootstrap
          $env:XUEQING_UPDATER_SHORT_FIXTURE = $short
          $env:XUEQING_UPDATER_LONG_FIXTURE = $long
          dart test
          if ($LASTEXITCODE -ne 0) { throw "Updater execution tests failed." }
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          dart compile exe bin/xueqing_updater.dart -o (Join-Path $releaseDir 'xueqing_updater.exe')
          dart compile exe bin/xueqing_updater.dart -o (Join-Path $releaseDir 'xueqing_updater_bootstrap.exe')

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/tools/windows_installer/build_installer.ps1" -AppVersion '0.3.2'
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }

      - name: Smoke install and uninstall Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'build/windows/installer') -Filter 'xueqing-setup-*.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not produced." }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs/Xueqing'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke failed with exit code $($install.ExitCode)." }
          foreach ($required in @('xueqing.exe','xueqing_updater.exe','xueqing_updater_bootstrap.exe','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $path = Join-Path $installDir $required
            if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) { throw "Installed file missing or empty: $required" }
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not installed." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall smoke failed with exit code $($uninstall.ExitCode)." }
          foreach ($removed in @('xueqing.exe','xueqing_updater.exe','xueqing_updater_bootstrap.exe')) {
            if (Test-Path (Join-Path $installDir $removed)) { throw "Uninstaller left application file behind: $removed" }
          }

  commit-verified-fix:
    if: github.actor != 'github-actions[bot]'
    needs:
      - linux-core-android-security
      - windows-release-updater-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out verified branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply exact verified patch
        run: |
          python3 tools/v032_comprehensive_gate_patch.py
          dart format lib/features/design_v2/v2_workspace_preview.dart test/features/design_v2_workspace_test.dart test/features/organization_management_test.dart test/features/v032_real_device_ux_contract_test.dart test/flutter_test_config.dart
          git diff --check

      - name: Remove one-time Gate scaffolding and local CLI state, then commit
        shell: bash
        run: |
          rm -f tools/v032_comprehensive_gate_patch.py
          rm -f .github/workflows/v032-comprehensive-cross-platform-gate.yml
          rm -f .github/workflows/v032-flutter-failure-diagnostic.yml
          rm -f .github/workflows/v032-deno-diagnostic.yml
          rm -f supabase/.branches/_current_branch
          git add -A
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/v032-comprehensive-cross-platform-gate.yml\n.github/workflows/v032-deno-diagnostic.yml\n.github/workflows/v032-flutter-failure-diagnostic.yml\n.gitignore\nlib/features/design_v2/v2_workspace_preview.dart\nsupabase/.branches/_current_branch\nsupabase/functions/organization-member-credentials/index.ts\ntest/features/design_v2_workspace_test.dart\ntest/features/organization_management_test.dart\ntest/features/v032_real_device_ux_contract_test.dart\ntest/flutter_test_config.dart\ntools/v032_comprehensive_gate_patch.py'
          if [ "$staged" != "$expected" ]; then
            echo 'Unexpected staged files:'
            echo "$staged"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix compact back navigation and harden release regressions'
          git push origin HEAD:hotfix/v0.3.2-real-device-ux
