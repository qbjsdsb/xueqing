name: Apply supervision priority header quiet

on:
  push:
    branches:
      - ux/supervision-priority-header-quiet-20260913
    paths:
      - .github/supervision-priority-header-quiet.trigger

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ux/supervision-priority-header-quiet-20260913

      - name: Apply focused UX patch
        run: python3 .github/scripts/apply_supervision_priority_header_quiet.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format affected files
        run: >-
          dart format
          lib/features/design_v2/v2_workspace_preview.dart
          lib/features/design_v2/v2_organization_workspace_page.dart
          test/features/v2_organization_workspace_test.dart
          test/features/v2_page_rhythm_test.dart

      - name: Verify diff hygiene
        run: git diff --check

      - name: Run focused UX tests
        run: >-
          flutter test
          test/features/v2_organization_workspace_test.dart
          test/features/v2_page_rhythm_test.dart
          test/features/design_v2_workspace_test.dart
          test/features/v2_typed_organization_navigation_test.dart

      - name: Analyze focused implementation
        run: >-
          flutter analyze
          lib/features/design_v2/v2_workspace_preview.dart
          lib/features/design_v2/v2_organization_workspace_page.dart
          test/features/v2_organization_workspace_test.dart
          test/features/v2_page_rhythm_test.dart

      - name: Remove temporary patch machinery
        run: >-
          rm -f
          .github/workflows/apply-supervision-priority-header-quiet.yml
          .github/supervision-priority-header-quiet.trigger
          .github/scripts/apply_supervision_priority_header_quiet.py

      - name: Commit clean result
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "polish(v2): prioritize supervision and quiet top headers"
          git push origin HEAD:ux/supervision-priority-header-quiet-20260913
