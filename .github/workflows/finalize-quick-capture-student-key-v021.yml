name: Finalize Quick Capture student key v0.2.1

on:
  push:
    branches:
      - ux/quick-capture-student-first-v021

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'RUN_QC_KEY_V021')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ux/quick-capture-student-first-v021
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply student-key cleanup
        run: python tool/finalize_quick_capture_student_key_v021.py

      - name: Remove staging helpers
        run: |
          rm tool/finalize_quick_capture_student_key_v021.py
          rm .github/workflows/finalize-quick-capture-student-key-v021.yml

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart test/features/workflow_clarity_contract_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter tests
        run: flutter test

      - name: Verify focused diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/finalize-quick-capture-student-key-v021.yml"
            "lib/features/teacher_workspace/presentation/teacher_workspace_page.dart"
            "test/features/teacher_workspace_test.dart"
            "test/features/workflow_clarity_contract_test.dart"
            "tool/finalize_quick_capture_student_key_v021.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for expected in "${allowed[@]}"; do
              if [[ "$path" == "$expected" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Unexpected changed path: $path" >&2
              exit 1
            fi
          done
          test -n "$(git diff -- lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart test/features/workflow_clarity_contract_test.dart)"

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: key Quick Capture students by student id"
          git push origin HEAD:ux/quick-capture-student-first-v021
