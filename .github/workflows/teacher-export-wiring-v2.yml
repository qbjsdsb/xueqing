name: Teacher export wiring v2

on:
  push:
    branches:
      - feature/teacher-record-export
    paths:
      - tool/teacher_export_wiring_once.py

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/teacher-record-export
      - name: Apply precise wiring edits
        run: python3 tool/teacher_export_wiring_once.py
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/teacher_workspace/presentation/teacher_workspace_page.dart
          git add lib/features/organization_management/presentation/organization_management_page.dart
          git add lib/features/organization_management/presentation/organization_management_areas.dart
          git add lib/features/organization_management/presentation/organization_management_learning_actions.dart
          git commit -m "feat: wire teacher learning record export UI"
          git push origin HEAD:feature/teacher-record-export
