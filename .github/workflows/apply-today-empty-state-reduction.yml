name: Apply Today empty-state reduction

"on":
  push:
    branches:
      - ux/today-empty-state-reduction-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Apply Today reduction patch
        run: python3 tools/apply_today_empty_state_reduction.py

      - name: Format focused files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart

      - name: Run focused regression tests
        run: |
          flutter pub get
          flutter test test/features/teacher_workspace_test.dart

      - name: Commit product changes only
        shell: bash
        run: |
          rm .github/workflows/apply-today-empty-state-reduction.yml
          rm tools/apply_today_empty_state_reduction.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce empty-state noise on Today"
          git push origin HEAD:ux/today-empty-state-reduction-20260908
