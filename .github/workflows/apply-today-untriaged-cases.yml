name: Apply Today untriaged Cases patch

# One-shot guarded source patch; removed after the product commit lands.
on:
  push:
    branches:
      - ux/today-untriaged-cases-20260908
    paths:
      - .github/workflows/apply-today-untriaged-cases.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/today-untriaged-cases-20260908
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded source replacements
        run: python3 .github/scripts/apply_today_untriaged_cases.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Format, test focused regression, and commit product files
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
          flutter pub get
          flutter test test/features/teacher_workspace_test.dart
          git diff --check
          git diff --exit-code -- .github/scripts/apply_today_untriaged_cases.py .github/workflows/apply-today-untriaged-cases.yml
          if git diff --quiet -- lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart; then
            echo 'No product change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
          git commit -m 'fix: keep new no-action Cases visible in Today'
          git push origin HEAD:ux/today-untriaged-cases-20260908
