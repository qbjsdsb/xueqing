name: Apply teacher shell regression test

on:
  push:
    branches:
      - ux/teacher-shell-polish-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply regression-test patch
        run: python3 .github/scripts/add_teacher_shell_regression_test.py

      - name: Format and inspect test patch
        run: |
          dart format test/features/teacher_workspace_test.dart
          git diff --check

      - name: Commit product-and-test-only branch
        run: |
          rm .github/scripts/add_teacher_shell_regression_test.py
          rm .github/workflows/apply-teacher-shell-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add medium-width workspace shell regression test"
          git push origin HEAD:ux/teacher-shell-polish-20260908
