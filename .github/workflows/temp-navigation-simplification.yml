name: Temporary navigation simplification integration

on:
  push:
    branches:
      - ui/navigation-simplification-v0311-work

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ui/navigation-simplification-v0311-work
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Harden temporary patcher matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/temp_navigation_simplification.py')
          text = p.read_text(encoding='utf-8')

          old_guard = """    if count != 1:\n        raise SystemExit(f'{label}: expected 1 match, got {count}')\n    return text.replace(old, new, 1)\n"""
          new_guard = """    if count != 1:\n        if label == 'organization lifecycle section sync' and count == 2:\n            return text.replace(old, new, 1)\n        raise SystemExit(f'{label}: expected 1 match, got {count}')\n    return text.replace(old, new, 1)\n"""
          if old_guard not in text:
              raise SystemExit('temporary patcher guard not found')
          text = text.replace(old_guard, new_guard, 1)

          start_marker = "# Replace both full five-chip surfaces.\n"
          end_marker = "# Reduce normal responsibility repetition in expanded selection rows.\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          structural = '''# Replace both full five-chip surfaces by structural widget boundaries.
def _call_end(source: str, start: int) -> int:
    open_at = source.index('(', start)
    depth = 0
    for index in range(open_at, len(source)):
        char = source[index]
        if char == '(':
            depth += 1
        elif char == ')':
            depth -= 1
            if depth == 0:
                return index + 1
    raise SystemExit('unbalanced widget call while simplifying filters')

first_search = text.index("key: const Key('v2-organization-learning-search')")
expanded_start = text.index('                      Wrap(', first_search)
expanded_end = _call_end(text, expanded_start)
text = (
    text[:expanded_start]
    + '                      _filterControls(context)'
    + text[expanded_end:]
)

second_search = text.index(
    "key: const Key('v2-organization-learning-search')",
    first_search + 1,
)
compact_start = text.index('                    SingleChildScrollView(', second_search)
compact_end = _call_end(text, compact_start)
text = (
    text[:compact_start]
    + '                    _filterControls(context)'
    + text[compact_end:]
)
'''
          text = text[:start] + structural + text[end:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply navigation simplification patch
        run: python .github/temp_navigation_simplification.py

      - name: Remove temporary patch machinery
        run: |
          rm .github/temp_navigation_simplification.py
          rm .github/workflows/temp-navigation-simplification.yml

      - name: Get packages
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/design_v2 test/features

      - name: Verify lockfile and whitespace
        run: |
          git diff --exit-code -- pubspec.lock
          git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Focused navigation and organization tests
        run: |
          flutter test \
            test/features/v2_adaptive_workspace_test.dart \
            test/features/v2_typed_organization_navigation_test.dart \
            test/features/v2_page_rhythm_test.dart \
            test/features/v2_organization_workspace_test.dart

      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): simplify workspace navigation hierarchy"
          git push origin HEAD:ui/navigation-simplification-v0311-work
