name: Temporary navigation visual consistency
on:
  push:
    branches:
      - ux/navigation-visual-consistency
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ux/navigation-visual-consistency
          fetch-depth: 0
      - name: Apply exact visual patch
        run: python tools/tmp_nav_visual_consistency.py
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib/app/theme/app_theme.dart test/app/theme_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Theme tests
        run: flutter test test/app/theme_test.dart
      - name: Remove temporary machinery
        run: rm tools/tmp_nav_visual_consistency.py .github/workflows/tmp-nav-visual-consistency.yml
      - name: Commit verified product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ux: unify navigation selection with the primary palette'
          git push origin HEAD:ux/navigation-visual-consistency
