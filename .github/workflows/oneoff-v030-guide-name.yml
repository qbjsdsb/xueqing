name: Validate v0.3 guide and product name closure

on:
  push:
    branches:
      - release/v0.3.0-final-guide-name
    paths:
      - .github/workflows/oneoff-v030-guide-name.yml
      - tools/oneoff_v030_guide_name.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v0.3.0-final-guide-name
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/oneoff_v030_guide_name.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/app/app.dart lib/features/design_v2/v2_workspace_preview.dart test/features/v2_final_ergonomics_test.dart test/release_product_identity_contract_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: flutter test test/features/v2_final_ergonomics_test.dart test/release_product_identity_contract_test.dart test/windows_window_chrome_contract_test.dart

      - name: Full test suite
        run: flutter test

      - name: Diff check
        run: git diff --check

      - name: Commit validated product patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-v030-guide-name.yml tools/oneoff_v030_guide_name.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI V2: add concise operation guide and unify product name"
          git push origin HEAD:release/v0.3.0-final-guide-name
