name: One-shot format design preview test

on:
  push:
    branches:
      - ux/teacher-friction-reduction
    paths:
      - .github/workflows/one-shot-format-design-preview-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-friction-reduction
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Format the migrated preview contract test
        run: dart format test/features/design_prototype_test.dart
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-format-design-preview-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: format design preview teacher-flow contract"
          git push origin HEAD:ux/teacher-friction-reduction
