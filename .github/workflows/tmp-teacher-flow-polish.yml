name: Temporary teacher flow polish validation

on:
  push:
    branches:
      - tmp/teacher-flow-polish-validate

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: tmp/teacher-flow-polish-validate
          fetch-depth: 0

      - name: Apply exact teacher-flow patch
        run: python3 tools/tmp_teacher_flow_polish.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run teacher workspace tests
        run: flutter test test/features/teacher_workspace_test.dart

      - name: Check diff whitespace
        run: git diff --check

      - name: Remove temporary patch machinery
        run: rm tools/tmp_teacher_flow_polish.py .github/workflows/tmp-teacher-flow-polish.yml

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ux: make teacher workflow clearer and Chinese-first"
          git push origin HEAD:tmp/teacher-flow-polish-validate
