name: One-shot D1b navigation formatter

on:
  push:
    branches:
      - v0.3.8/typed-organization-navigation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.3.8/typed-organization-navigation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Format touched Dart files
        run: dart format lib/features/design_v2/v2_workspace_preview.dart test/features/v2_typed_organization_navigation_test.dart
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/design_v2/v2_workspace_preview.dart test/features/v2_typed_organization_navigation_test.dart
          git diff --cached --check
          git commit -m "style: format typed organization navigation"
          git push origin HEAD:v0.3.8/typed-organization-navigation
