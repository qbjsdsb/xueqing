name: Xueqing organization header overflow once

on:
  push:
    branches:
      - ux/organization-header-overflow-v14

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply focused organization header polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('lib/features/design_v2/v2_organization_workspace_page.dart')
          source = source_path.read_text()
          pattern = re.compile(
              r"  List<Widget> _organizationHeaderActions\(\{\n.*?\n  \}\n\n  String get _embeddedSectionTitle",
              re.S,
          )
          replacement = '''  List<Widget> _organizationHeaderActions({
            required bool canSignOut,
          }) {
            return [
              if (widget.onRefresh != null)
                IconButton(
                  key: const Key('v2-organization-refresh'),
                  tooltip: _refreshingOrganization ? '正在刷新机构数据' : '刷新机构数据',
                  onPressed: _refreshingOrganization
                      ? null
                      : () => unawaited(_refreshOrganizationScope()),
                  icon: _refreshingOrganization
                      ? const SizedBox(
                          key: Key('v2-organization-refresh-progress'),
                          width: 18,
                          height: 18,
                          child: CircularProgressIndicator(strokeWidth: 2),
                        )
                      : const Icon(Icons.refresh_outlined),
                ),
              PopupMenuButton<_OrganizationPageAction>(
                key: const Key('v2-organization-more'),
                tooltip: '更多操作',
                onSelected: (action) {
                  switch (action) {
                    case _OrganizationPageAction.checkUpdate:
                      unawaited(_checkForUpdates());
                    case _OrganizationPageAction.signOut:
                      widget.runtime.onSignOut?.call();
                  }
                },
                itemBuilder: (_) => [
                  PopupMenuItem<_OrganizationPageAction>(
                    value: _OrganizationPageAction.checkUpdate,
                    enabled: !_checkingForUpdates,
                    child: ListTile(
                      contentPadding: EdgeInsets.zero,
                      leading: const Icon(Icons.system_update_alt_outlined),
                      title: Text(
                        _checkingForUpdates ? '正在检查更新…' : '检查更新',
                      ),
                      subtitle: Text('当前版本 ${widget.runtime.appVersion}'),
                    ),
                  ),
                  if (canSignOut)
                    const PopupMenuItem<_OrganizationPageAction>(
                      value: _OrganizationPageAction.signOut,
                      child: ListTile(
                        contentPadding: EdgeInsets.zero,
                        leading: Icon(Icons.logout_outlined),
                        title: Text('退出登录'),
                      ),
                    ),
                ],
              ),
            ];
          }

          String get _embeddedSectionTitle'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'expected one header action block, found {count}')
          old_call = '''                          actions: _organizationHeaderActions(
                            compact: compact,
                            canSignOut: canSignOut,
                          ),'''
          new_call = '''                          actions: _organizationHeaderActions(
                            canSignOut: canSignOut,
                          ),'''
          if source.count(old_call) != 1:
              raise SystemExit('organization header action call did not match exactly once')
          source = source.replace(old_call, new_call)
          source_path.write_text(source)

          test_path = Path('test/features/v2_organization_workspace_test.dart')
          test = test_path.read_text()
          marker = "  test('soft refresh callers join one coalesced refresh cycle', () {\n"
          if test.count(marker) != 1:
              raise SystemExit('focused test insertion marker did not match exactly once')
          inserted = '''  testWidgets(
            'Organization header keeps update and sign-out in one overflow menu',
            (tester) async {
              await tester.binding.setSurfaceSize(const Size(1100, 800));
              addTearDown(() => tester.binding.setSurfaceSize(null));

              var signOutCount = 0;
              var updateCheckCount = 0;
              final updateService = UpdateService(
                currentVersion: '0.3.8',
                manifestLoader: (_) async {
                  updateCheckCount++;
                  return '{"schema":1,"channel":"stable","version":"0.3.8","minimum_supported":"0.3.0","notes":[],"platforms":{"windows":{"url":"https://example.com/xueqing-windows.zip","sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","size_bytes":42,"format":"zip","file_name":"xueqing-windows.zip"}}}';
                },
              );
              final workspace = _workspace();
              await tester.pumpWidget(
                MaterialApp(
                  theme: V2Theme.light(),
                  home: V2OrganizationWorkspacePage(
                    workspace: workspace,
                    workspaceData: V2ReadModelAdapter.fromWorkspace(workspace)
                        .workspaceData,
                    responsibility: _context(personalProfileIds: const []),
                    runtime: _runtime(
                      includeManagement: false,
                      updateService: updateService,
                      onSignOut: () => signOutCount++,
                    ),
                    rootMode: true,
                    onRefresh: () async {},
                  ),
                ),
              );
              await tester.pumpAndSettle();

              expect(
                find.byKey(const Key('v2-organization-refresh')),
                findsOneWidget,
              );
              expect(
                find.byKey(const Key('v2-organization-more')),
                findsOneWidget,
              );
              expect(find.byTooltip('检查更新'), findsNothing);
              expect(find.byTooltip('退出登录'), findsNothing);

              await tester.tap(find.byKey(const Key('v2-organization-more')));
              await tester.pumpAndSettle();
              expect(find.text('检查更新'), findsOneWidget);
              expect(find.text('当前版本 0.3.8'), findsOneWidget);
              expect(find.text('退出登录'), findsOneWidget);

              await tester.tap(find.text('退出登录'));
              await tester.pumpAndSettle();
              expect(signOutCount, 1);

              await tester.tap(find.byKey(const Key('v2-organization-more')));
              await tester.pumpAndSettle();
              await tester.tap(find.text('检查更新'));
              await tester.pumpAndSettle();
              expect(updateCheckCount, 1);
              expect(find.text('已是最新版本'), findsOneWidget);
              await tester.tap(find.text('关闭'));
              await tester.pumpAndSettle();

              await tester.binding.setSurfaceSize(const Size(390, 800));
              await tester.pumpAndSettle();
              expect(
                find.byKey(const Key('v2-organization-refresh')),
                findsOneWidget,
              );
              expect(
                find.byKey(const Key('v2-organization-more')),
                findsOneWidget,
              );
              expect(tester.takeException(), isNull);
            },
          );

'''
          test = test.replace(marker, inserted + marker)

          old_helper = '''AuthenticatedWorkspaceRuntime _runtime({
            required bool includeManagement,
            OrganizationManagementRepository? managementRepository,
          }) {
            return AuthenticatedWorkspaceRuntime(
              learningRepository: _FakeLearningRepository(),
              organizationManagementRepository: includeManagement
                  ? managementRepository ?? _FakeOrganizationManagementRepository()
                  : null,
              updateService: UpdateService(currentVersion: '0.3.8'),
              updateInstaller: _FakeUpdateInstaller(),
              caseReopenDraftStore: _FakeCaseReopenDraftStore(),
              appVersion: '0.3.8',
              sessionUserId: 'user-manager',
            );
          }'''
          new_helper = '''AuthenticatedWorkspaceRuntime _runtime({
            required bool includeManagement,
            OrganizationManagementRepository? managementRepository,
            UpdateService? updateService,
            VoidCallback? onSignOut,
          }) {
            return AuthenticatedWorkspaceRuntime(
              learningRepository: _FakeLearningRepository(),
              organizationManagementRepository: includeManagement
                  ? managementRepository ?? _FakeOrganizationManagementRepository()
                  : null,
              updateService: updateService ?? UpdateService(currentVersion: '0.3.8'),
              updateInstaller: _FakeUpdateInstaller(),
              caseReopenDraftStore: _FakeCaseReopenDraftStore(),
              appVersion: '0.3.8',
              sessionUserId: 'user-manager',
              onSignOut: onSignOut,
            );
          }'''
          if test.count(old_helper) != 1:
              raise SystemExit('runtime helper did not match exactly once')
          test = test.replace(old_helper, new_helper)
          test_path.write_text(test)
          PY

      - name: Format changed Dart files
        run: dart format lib/features/design_v2/v2_organization_workspace_page.dart test/features/v2_organization_workspace_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused organization workspace tests
        run: flutter test test/features/v2_organization_workspace_test.dart

      - name: Commit verified product changes
        shell: bash
        run: |
          if git diff --quiet -- lib/features/design_v2/v2_organization_workspace_page.dart test/features/v2_organization_workspace_test.dart; then
            echo 'No product changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/design_v2/v2_organization_workspace_page.dart test/features/v2_organization_workspace_test.dart
          git commit -m 'V2: consolidate organization header actions'
          git push origin HEAD:ux/organization-header-overflow-v14
