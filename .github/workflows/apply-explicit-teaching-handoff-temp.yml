name: Apply explicit teaching handoff temporary

on:
  push:
    branches:
      - feature/explicit-teaching-handoff-plan

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/explicit-teaching-handoff-plan
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply client contract
        run: python3 .github/scripts/apply_explicit_teaching_handoff_client.py
      - name: Format and validate Dart contract
        shell: bash
        run: |
          dart format \
            lib/cloud/organization_management_repository.dart \
            lib/cloud/learning_repository.dart \
            test/cloud/organization_management_repository_test.dart
          flutter pub get
          flutter analyze
          flutter test test/cloud/organization_management_repository_test.dart
      - name: Commit implementation and clean temporary helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-explicit-teaching-handoff-temp.yml
          git rm .github/scripts/apply_explicit_teaching_handoff_client.py
          git add \
            lib/cloud/organization_management_repository.dart \
            lib/cloud/learning_repository.dart \
            test/cloud/organization_management_repository_test.dart \
            supabase/migrations/20260912130000_explicit_teaching_handoff_plan.sql \
            supabase/tests/explicit_teaching_handoff_plan_test.sql
          git diff --cached --check
          git commit -m 'feat: add explicit teaching handoff plan contract'
          git push origin HEAD:feature/explicit-teaching-handoff-plan
