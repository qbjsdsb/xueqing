name: One-off V2 workflow formatter

on:
  push:
    branches:
      - ui/v2-production-workflows

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-production-workflows
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: dart format lib/features/design_v2/v2_workflow_controller.dart test/features/design_v2_workflow_controller_test.dart
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/design_v2/v2_workflow_controller.dart test/features/design_v2_workflow_controller_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(v2): format production workflow controller"
          git push origin HEAD:ui/v2-production-workflows
