name: One-off V2 safe reopen retry

on:
  push:
    branches:
      - ui/v2-safe-reopen
    paths:
      - .github/workflows/oneoff-v2-safe-reopen-retry.yml

permissions:
  contents: write

jobs:
  implement-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ui/v2-safe-reopen
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply validated patch with scoped UI and test fake fix
        shell: bash
        run: |
          git show cd98630527b1d5f17a1f150afbb778e1643b3b6c:.github/workflows/oneoff-v2-safe-reopen-retry.yml > /tmp/validated-anchors.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/validated-anchors.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          helper = '''def insert_before_in_range(path, start_anchor, end_anchor, anchor, addition):
              text = read(path)
              start = text.find(start_anchor)
              if start < 0 or text.find(start_anchor, start + 1) >= 0:
                  raise SystemExit(f'{path}: class start anchor is missing or ambiguous: {start_anchor!r}')
              end = text.find(end_anchor, start + len(start_anchor))
              if end < 0:
                  raise SystemExit(f'{path}: class end anchor is missing: {end_anchor!r}')
              segment = text[start:end]
              count = segment.count(anchor)
              if count != 1:
                  raise SystemExit(f'{path}: expected one scoped anchor, found {count}: {anchor!r}')
              segment = segment.replace(anchor, addition + anchor, 1)
              write(path, text[:start] + segment + text[end:])

          '''
          old = """insert_before_once(
              preview,
              '                  if (pendingAction != null) ...[\\n',
          """
          new = """insert_before_in_range(
              preview,
              'class _CaseDetailPane extends StatelessWidget {\\n',
              'class _TodayPane extends StatelessWidget {\\n',
              '                  if (pendingAction != null) ...[\\n',
          """
          if script.count(old) != 1:
              raise SystemExit(f'expected one CaseDetail insertion call, found {script.count(old)}')
          script = helper + script.replace(old, new, 1)
          exec(compile(script, '<safe-reopen-patch>', 'exec'))

          test_path = Path('test/features/design_v2_workflow_controller_test.dart')
          text = test_path.read_text()
          class_start = text.index('class _FakeLearningRepository extends Fake implements LearningRepository {')
          method_sig = 'Future<CaseCommandReceipt> reopenCase(ReopenCaseCommand command) async {'
          method_sig_pos = text.index(method_sig, class_start)
          method_start = text.rfind('  @override', class_start, method_sig_pos)
          next_class = text.index('class _FakeProgressiveCaseRepository extends Fake', method_sig_pos)
          class_close = text.rfind('\n}', class_start, method_start)
          if min(method_start, next_class, class_close) < 0 or not (class_close < method_start < next_class):
              raise SystemExit('could not safely relocate fake reopenCase into _FakeLearningRepository')
          block = text[method_start:next_class].rstrip()
          text = text[:class_close] + '\n\n' + block + '\n}\n\n' + text[next_class:]
          test_path.write_text(text)
          PY

      - name: Format
        run: |
          dart format \
            lib/features/design_v2/v2_workflow_controller.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/design_v2/v2_reopen_composer.dart \
            test/features/design_v2_workflow_controller_test.dart \
            test/features/design_v2_reopen_composer_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/features/design_v2_workflow_controller_test.dart
          flutter test test/features/design_v2_reopen_composer_test.dart
          flutter test test/features/design_v2_workspace_data_injection_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Diff check
        run: git diff --check

      - name: Commit validated product change and remove helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/oneoff-v2-safe-reopen.yml \
            .github/workflows/oneoff-v2-safe-reopen-retry.yml \
            .github/workflows/oneoff-v2-safe-reopen-retry2.yml
          git add \
            lib/features/design_v2/v2_workflow_controller.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/design_v2/v2_reopen_composer.dart \
            test/features/design_v2_workflow_controller_test.dart \
            test/features/design_v2_reopen_composer_test.dart
          git diff --cached --check
          git commit -m 'UI V2: add resumable safe case reopen'
          git push origin HEAD:ui/v2-safe-reopen
