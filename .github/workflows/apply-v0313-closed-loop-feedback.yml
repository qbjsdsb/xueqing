name: Apply v0.3.13 closed-loop feedback

on:
  push:
    branches:
      - polish/v0313-closed-loop-feedback
    paths:
      - .github/workflows/apply-v0313-closed-loop-feedback.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: polish/v0313-closed-loop-feedback
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply feedback polish
        run: python .xueqing-v0313-closed-loop-feedback.py

      - name: Get packages
        run: flutter pub get

      - name: Verify lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Format
        run: dart format lib/features/design_v2/v2_composers.dart test/features/v2_closed_loop_feedback_contract_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused acceptance
        run: |
          flutter test test/features/v2_closed_loop_feedback_contract_test.dart
          flutter test test/features/design_v2_composers_test.dart
          flutter test test/features/v037_existing_case_continuation_test.dart
          flutter test test/features/v037_teacher_flow_polish_test.dart
          flutter test test/features/release_ux_acceptance_matrix_test.dart

      - name: Full Flutter suite
        run: flutter test

      - name: Commit verified product changes only
        run: |
          rm -f .xueqing-v0313-closed-loop-feedback.py .github/workflows/apply-v0313-closed-loop-feedback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "polish: make save feedback reflect the teaching loop"
          git push origin HEAD:polish/v0313-closed-loop-feedback
