name: One-shot teacher friction reduction

on:
  push:
    branches:
      - ux/teacher-friction-reduction
    paths:
      - .github/workflows/one-shot-teacher-friction-reduction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-friction-reduction
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Apply focused UX reductions
        run: python .github/scripts/apply_teacher_friction_reduction.py
      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            lib/features/teacher_workspace/presentation/progressive_case_forms.dart \
            lib/cloud/learning_repository.dart \
            lib/export/learning_record_export.dart
      - name: Remove one-shot tooling and commit
        run: |
          rm .github/scripts/apply_teacher_friction_reduction.py
          rm .github/workflows/one-shot-teacher-friction-reduction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: reduce teacher recording friction"
          git push origin HEAD:ux/teacher-friction-reduction
