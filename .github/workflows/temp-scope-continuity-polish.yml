name: Temporary V2 scope continuity polish

on:
  push:
    branches:
      - ui/v2-scope-continuity-polish
    paths:
      - .github/scope-continuity-polish-marker

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui/v2-scope-continuity-polish
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply scoped polish
        run: |
          python3 .github/scripts/temp_apply_scope_continuity_polish.py
          dart format \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/v2_typed_organization_navigation_test.dart
          git diff --check

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze changed production surface
        run: flutter analyze lib/features/design_v2/v2_workspace_preview.dart test/features/v2_typed_organization_navigation_test.dart

      - name: Run focused navigation and rhythm tests
        run: |
          flutter test test/features/v2_typed_organization_navigation_test.dart
          flutter test test/features/v2_page_rhythm_test.dart
          flutter test test/features/v2_adaptive_workspace_test.dart
          flutter test test/features/v032_real_device_ux_contract_test.dart

      - name: Commit verified patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/v2_typed_organization_navigation_test.dart \
            docs/design/NAVIGATION_STATE_AUDIT.md \
            docs/design/PAGE_RHYTHM_AUDIT.md
          git commit -m "polish(ui): preserve Personal context across Organization visits"
          git push origin HEAD:ui/v2-scope-continuity-polish
