name: Temporary stage v0.3.6 and dispatch stable publisher

on:
  push:
    branches:
      - release/v0.3.6-staging-trigger

permissions:
  contents: write
  actions: write

jobs:
  stage-and-dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          ref: release/v0.3.6-staging-trigger
          fetch-depth: 0

      - name: Verify frozen main and stage prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: f09f568c75029cf7b1f21fb1f65b5e304affd123
          RELEASE_TAG: v0.3.6
          APP_VERSION: 0.3.6+14
        run: |
          set -euo pipefail
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"
          if [[ "$main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "main moved after the v0.3.6 release freeze: $main_sha"
            exit 1
          fi
          source_version="$(git show origin/main:pubspec.yaml | sed -n 's/^version:[[:space:]]*//p' | head -n 1)"
          if [[ "$source_version" != "$APP_VERSION" ]]; then
            echo "pubspec version mismatch: expected $APP_VERSION, got $source_version"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/tmp/v036-release.json 2>/dev/null; then
            release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,tagName)"
            RELEASE_JSON="$release_json" EXPECTED_MAIN_SHA="$EXPECTED_MAIN_SHA" python3 - <<'PY'
          import json, os
          release = json.loads(os.environ['RELEASE_JSON'])
          if release['isDraft'] or not release['isPrerelease']:
              raise SystemExit('Existing v0.3.6 Release is not the expected published prerelease staging state.')
          PY
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
            if [[ "$tag_sha" != "$EXPECTED_MAIN_SHA" ]]; then
              echo "Existing v0.3.6 tag points to $tag_sha, expected $EXPECTED_MAIN_SHA"
              exit 1
            fi
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag $RELEASE_TAG already exists without a matching Release; refusing to overwrite it."
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$EXPECTED_MAIN_SHA" \
              --prerelease \
              --title "学情 v0.3.6" \
              --notes $'v0.3.6 正式发布候选。\n\n- 教师处理提醒接入完整进展闭环：记录真实情况、完成当前提醒并决定下一步\n- 待复检提醒直接进入检查结果，可继续跟进、再次检查或结束跟进\n- 再次检查日期允许暂不确定，未定日期的后续进入“待安排”\n- 学情详情围绕当前状态、教师判断、下一步和成长过程重新组织\n- 学情记录支持作废与恢复，错误或重复记录不再污染日常工作台和导出\n- Excel 导出强化真实日期、历史记录与当前下一步语义，并保留真实题号与标点'
          fi

      - name: Dispatch signed stable publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$'教师处理提醒接入完整进展闭环：记录真实情况、完成当前提醒并决定下一步\n待复检提醒直接进入检查结果，可继续跟进、再次检查或结束跟进\n再次检查日期可暂不确定，未定日期的后续进入“待安排”\n学情详情围绕当前状态、教师判断、下一步和成长过程重新组织\n学情记录支持作废与恢复，错误或重复记录不再污染工作台和导出\nExcel 导出改进日期、历史记录与当前下一步语义，保留真实题号与标点'
          gh workflow run publish-release-assets.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag=v0.3.6 \
            -f app_version=0.3.6+14 \
            -f release_notes="$notes"

      - name: Remove temporary workflow from helper branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qbjsdsb'
          git config user.email '3342513714@qq.com'
          git rm .github/workflows/_tmp_stage_v036_and_dispatch.yml
          git commit -m 'chore: remove temporary v0.3.6 staging trigger'
          git push origin HEAD:release/v0.3.6-staging-trigger
