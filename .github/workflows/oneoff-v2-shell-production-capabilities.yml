name: One-off V2 shell production capabilities

on:
  push:
    branches:
      - ui/v2-shell-production-capabilities
    paths:
      - .github/workflows/oneoff-v2-shell-production-capabilities.yml

permissions:
  contents: write

jobs:
  patch-validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ui/v2-shell-production-capabilities
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Make duplicate constructor guards explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_v2_shell_production_capabilities.py')
          text = path.read_text(encoding='utf-8')
          old_guard = """    if count != 1:\n        raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')\n"""
          new_guard = """    allowed_duplicate = count == 2 and old in {\n        \"    required this.onOpenCase,\\n    required this.onBackFromCase,\\n  });\\n\",\n        \"  final ValueChanged<V2FocusItem> onOpenCase;\\n  final VoidCallback onBackFromCase;\\n\",\n    }\n    if count == 0 or (count != 1 and not allowed_duplicate):\n        raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')\n"""
          if text.count(old_guard) != 1:
              raise SystemExit('unexpected replace_once guard shape')
          path.write_text(text.replace(old_guard, new_guard, 1), encoding='utf-8')
          PY

      - name: Apply shell patch
        run: python3 .github/scripts/patch_v2_shell_production_capabilities.py

      - name: Remove obsolete course placeholder widget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/design_v2/v2_workspace_preview.dart')
          text = path.read_text(encoding='utf-8')
          old = """class _QuietPlaceholder extends StatelessWidget {\n  const _QuietPlaceholder({required this.title, required this.message});\n\n  final String title;\n  final String message;\n\n  @override\n  Widget build(BuildContext context) {\n    return Center(\n      child: ConstrainedBox(\n        constraints: const BoxConstraints(maxWidth: 420),\n        child: Padding(\n          padding: const EdgeInsets.all(28),\n          child: Column(\n            mainAxisSize: MainAxisSize.min,\n            children: [\n              Text(title, style: Theme.of(context).textTheme.headlineSmall),\n              const SizedBox(height: 10),\n              Text(\n                message,\n                textAlign: TextAlign.center,\n                style: Theme.of(context).textTheme.bodyMedium,\n              ),\n            ],\n          ),\n        ),\n      ),\n    );\n  }\n}\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete placeholder, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Format
        run: |
          dart format \
            lib/features/design_v2/v2_update_flow.dart \
            lib/features/design_v2/v2_management_page.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/v2_shell_production_capabilities_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/features/v2_shell_production_capabilities_test.dart
          flutter test test/features/design_v2_workspace_test.dart
          flutter test test/features/design_v2_workspace_loader_test.dart
          flutter test test/features/design_v2_real_preview_page_test.dart
          flutter test test/features/organization_management_test.dart
          flutter test test/update_dialog_test.dart
          flutter test test/update/update_service_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated product change and remove helpers
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/design_v2/v2_update_flow.dart \
            lib/features/design_v2/v2_management_page.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/v2_shell_production_capabilities_test.dart
          git rm .github/scripts/patch_v2_shell_production_capabilities.py
          git rm .github/workflows/oneoff-v2-shell-production-capabilities.yml
          git commit -m "UI V2: wire real management update and account actions"
          git push origin HEAD:ui/v2-shell-production-capabilities
