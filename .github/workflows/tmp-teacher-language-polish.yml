name: Temporary teacher language polish
on:
  push:
    branches:
      - tmp/teacher-flow-polish-validate
permissions:
  contents: write
jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: tmp/teacher-flow-polish-validate
          fetch-depth: 0
      - name: Apply exact copy patch
        run: python tools/tmp_apply_teacher_language_polish.py
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Teacher workspace tests
        run: flutter test test/features/teacher_workspace_test.dart
      - name: Remove temporary machinery
        run: rm tools/tmp_apply_teacher_language_polish.py .github/workflows/tmp-teacher-language-polish.yml docs/tmp-teacher-flow-polish-plan.md
      - name: Commit verified product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ux: make teacher workflow language natural'
          git push origin HEAD:tmp/teacher-flow-polish-validate
