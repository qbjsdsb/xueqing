name: Quiet Professional density hierarchy v4

on:
  push:
    branches:
      - ux/quiet-professional-density-hierarchy-v4

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ux/quiet-professional-density-hierarchy-v4
          fetch-depth: 0

      - name: Refine hierarchy and density
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f'{label}: expected 1 match, found {count}'
              return text.replace(old, new, 1)

          def replace_in_section(text, start, end, old, new, label, expected=None):
              start_index = text.index(start)
              end_index = text.index(end, start_index + len(start))
              section = text[start_index:end_index]
              count = section.count(old)
              if expected is None:
                  assert count > 0, f'{label}: expected at least 1 match'
              else:
                  assert count == expected, f'{label}: expected {expected} matches, found {count}'
              section = section.replace(old, new)
              return text[:start_index] + section + text[end_index:]

          header_path = Path('lib/features/design_v2/v2_page_header.dart')
          header = header_path.read_text()
          header = replace_once(
              header,
              '        Text(title, style: theme.textTheme.headlineSmall),',
              '''        Text(\n          title,\n          style: theme.textTheme.titleLarge?.copyWith(\n            fontSize: 22,\n            height: 1.35,\n          ),\n        ),''',
              'V2 top-level title hierarchy',
          )
          header_path.write_text(header)

          management_path = Path(
              'lib/features/organization_management/presentation/organization_management_layout.dart'
          )
          management = management_path.read_text()
          management = replace_once(
              management,
              '''                style: Theme.of(context).textTheme.headlineSmall,\n''',
              '''                style: Theme.of(context).textTheme.titleLarge?.copyWith(\n                  fontSize: 22,\n                  height: 1.35,\n                ),\n''',
              'standalone management title hierarchy',
          )
          management_path.write_text(management)

          workspace_path = Path('lib/features/design_v2/v2_workspace_preview.dart')
          workspace = workspace_path.read_text()

          workspace = replace_in_section(
              workspace,
              'class _StudentListPaneState',
              'class _StudentRow',
              '                const SizedBox(height: 14),',
              '                const SizedBox(height: 8),',
              'student list search-to-count rhythm',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _StudentListPaneState',
              'class _StudentRow',
              '                const SizedBox(height: 18),',
              '                const SizedBox(height: 14),',
              'student list header-to-search rhythm',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _StudentListPaneState',
              'class _StudentRow',
              '                  style: Theme.of(context).textTheme.labelLarge,',
              '''                  style: Theme.of(context).textTheme.bodySmall?.copyWith(\n                    color: scheme.onSurfaceVariant,\n                  ),''',
              'student list count emphasis',
              1,
          )

          workspace = replace_in_section(
              workspace,
              'class _StudentRow',
              'class _InitialMark',
              'padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),',
              'padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),',
              'student row density',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _InitialMark',
              'class _StudentDetailPane',
              '''      width: 34,\n      height: 34,''',
              '''      width: 32,\n      height: 32,''',
              'student initial mark density',
              1,
          )

          workspace = replace_in_section(
              workspace,
              'class _SectionTitle',
              'class _FocusRow',
              'Text(title, style: Theme.of(context).textTheme.titleLarge)',
              'Text(title, style: Theme.of(context).textTheme.titleMedium)',
              'section title hierarchy',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _SectionTitle',
              'class _FocusRow',
              "Text('$count', style: Theme.of(context).textTheme.bodySmall)",
              "Text('$count', style: Theme.of(context).textTheme.labelMedium)",
              'section count hierarchy',
              1,
          )

          workspace = replace_in_section(
              workspace,
              'class _FocusRow',
              'class _Timeline',
              'padding: const EdgeInsets.symmetric(vertical: 16),',
              'padding: const EdgeInsets.symmetric(vertical: 12),',
              'focus row density',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _FocusRow',
              'class _Timeline',
              '              height: 58,',
              '              height: 52,',
              'focus row accent height',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _FocusRow',
              'class _Timeline',
              'const SizedBox(width: 16),',
              'const SizedBox(width: 14),',
              'focus row horizontal rhythm',
              2,
          )
          workspace = replace_in_section(
              workspace,
              'class _FocusRow',
              'class _Timeline',
              '                  const SizedBox(height: 8),',
              '                  const SizedBox(height: 6),',
              'focus row next-step rhythm',
              1,
          )

          workspace = replace_in_section(
              workspace,
              'class _TodayPane',
              'String _todayLabel',
              'const SizedBox(height: 28),',
              'const SizedBox(height: 24),',
              'today section rhythm',
          )
          workspace = replace_in_section(
              workspace,
              'class _TodayPane',
              'String _todayLabel',
              '                const SizedBox(height: 18),',
              '                const SizedBox(height: 14),',
              'today recent-students rhythm',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _TodayAction',
              'String _todayActionStatus',
              'padding: const EdgeInsets.symmetric(vertical: 15),',
              'padding: const EdgeInsets.symmetric(vertical: 12),',
              'today action density',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _TodayAction',
              'String _todayActionStatus',
              '                  height: 62,',
              '                  height: 56,',
              'today action accent height',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _TodayAction',
              'String _todayActionStatus',
              '                const SizedBox(width: 15),',
              '                const SizedBox(width: 14),',
              'today action horizontal rhythm',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _TodayRecentStudentRow',
              'String _recentActivityLabel',
              'padding: const EdgeInsets.symmetric(vertical: 11),',
              'padding: const EdgeInsets.symmetric(vertical: 9),',
              'today recent student density',
              1,
          )

          workspace = replace_in_section(
              workspace,
              'class _CaseIndexPaneState',
              'class _V2OperationGuide',
              '              const SizedBox(height: 12),',
              '              const SizedBox(height: 8),',
              'learning result-count rhythm',
              1,
          )
          workspace = replace_in_section(
              workspace,
              'class _CaseIndexPaneState',
              'class _V2OperationGuide',
              '              const SizedBox(height: 16),',
              '              const SizedBox(height: 12),',
              'learning controls rhythm',
              2,
          )

          workspace_path.write_text(workspace)
          PY

      - name: Add density hierarchy contract
        run: |
          cat > test/features/v2_density_hierarchy_contract_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          String _slice(String source, String start, String end) {
            final startIndex = source.indexOf(start);
            final endIndex = source.indexOf(end, startIndex + start.length);
            expect(startIndex, greaterThanOrEqualTo(0), reason: 'Missing $start');
            expect(endIndex, greaterThan(startIndex), reason: 'Missing $end after $start');
            return source.substring(startIndex, endIndex);
          }

          void main() {
            test('top-level headers stay quieter than entity detail headlines', () {
              final header = File('lib/features/design_v2/v2_page_header.dart')
                  .readAsStringSync();
              expect(header, contains('theme.textTheme.titleLarge?.copyWith('));
              expect(header, contains('fontSize: 22'));
              expect(header, isNot(contains('Text(title, style: theme.textTheme.headlineSmall)')));

              final management = File(
                'lib/features/organization_management/presentation/organization_management_layout.dart',
              ).readAsStringSync();
              final managementHeader = _slice(
                management,
                'class _ManagementHeader',
                'class _ManagementToolbar',
              );
              expect(managementHeader, contains('textTheme.titleLarge?.copyWith('));
              expect(managementHeader, contains('fontSize: 22'));
            });

            test('sections and rows use a denser editorial hierarchy', () {
              final workspace = File('lib/features/design_v2/v2_workspace_preview.dart')
                  .readAsStringSync();

              final sectionTitle = _slice(
                workspace,
                'class _SectionTitle',
                'class _FocusRow',
              );
              expect(sectionTitle, contains('textTheme.titleMedium'));
              expect(sectionTitle, contains('textTheme.labelMedium'));
              expect(sectionTitle, isNot(contains('textTheme.titleLarge')));

              final studentRow = _slice(
                workspace,
                'class _StudentRow',
                'class _InitialMark',
              );
              expect(
                studentRow,
                contains('EdgeInsets.symmetric(horizontal: 12, vertical: 10)'),
              );

              final focusRow = _slice(
                workspace,
                'class _FocusRow',
                'class _Timeline',
              );
              expect(focusRow, contains('EdgeInsets.symmetric(vertical: 12)'));
              expect(focusRow, contains('height: 52'));

              final todayAction = _slice(
                workspace,
                'class _TodayAction',
                'String _todayActionStatus',
              );
              expect(todayAction, contains('EdgeInsets.symmetric(vertical: 12)'));
              expect(todayAction, contains('height: 56'));
            });
          }
          DART

      - name: Remove one-shot workflow
        run: rm .github/workflows/quiet-professional-density-hierarchy-v4.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format
        run: |
          dart format \
            lib/features/design_v2/v2_page_header.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/organization_management/presentation/organization_management_layout.dart \
            test/features/v2_density_hierarchy_contract_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Focused visual acceptance
        run: |
          flutter test \
            test/features/v2_density_hierarchy_contract_test.dart \
            test/features/v2_visual_polish_contract_test.dart \
            test/features/v2_adaptive_workspace_test.dart \
            test/features/windows_workspace_acceptance_matrix_test.dart \
            test/features/v032_real_device_ux_contract_test.dart \
            test/features/management_workflow_clarity_contract_test.dart

      - name: Full suite
        run: flutter test

      - name: Commit verified refinement
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(v2): tighten editorial hierarchy and density"
          git push origin HEAD:ux/quiet-professional-density-hierarchy-v4
