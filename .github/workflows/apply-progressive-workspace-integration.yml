name: Apply progressive workspace integration

on:
  push:
    branches:
      - ux/progressive-teacher-workflow-20260908
    paths:
      - .github/workflows/apply-progressive-workspace-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/progressive-teacher-workflow-20260908
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded source replacements
        run: python3 .github/scripts/apply_progressive_workspace.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Format and commit product file
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart
          git diff --check
          git diff --exit-code -- .github/scripts/apply_progressive_workspace.py .github/workflows/apply-progressive-workspace-integration.yml
          if git diff --quiet -- lib/features/teacher_workspace/presentation/teacher_workspace_page.dart; then
            echo 'No product change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/teacher_workspace/presentation/teacher_workspace_page.dart
          git commit -m 'feat: connect progressive Case flow to teacher workspace'
          git push origin HEAD:ux/progressive-teacher-workflow-20260908
