name: Publish signed Xueqing v0.2.0 Pilot 2

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-requests/v0.2.0-pilot.2"

permissions:
  contents: write

concurrency:
  group: publish-pilot-v0.2.0-pilot.2
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.2.0-pilot.2
  RELEASE_VERSION: 0.2.0-pilot.2+3
  RELEASE_VERSION_NAME: 0.2.0-pilot.2
  RELEASE_BUILD_NUMBER: "3"
  RELEASE_COMMIT: ab02af57ea7e4af031e5cc9ce6499e48e93d3e42
  XUEQING_ENV: development
  XUEQING_SUPABASE_URL: https://czuctoulgnfytcfonkhc.supabase.co
  XUEQING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yjUy-gjUSSFkCpbK_AjLSA_I0FgOXTI
  XUEQING_ALLOW_DEVELOPMENT_RELEASE: "true"
  XUEQING_SHOW_DEV_TOOLS: "false"
  XUEQING_ANDROID_CERT_SHA256: ${{ vars.XUEQING_ANDROID_CERT_SHA256 || '' }}

jobs:
  validate:
    name: Validate pilot release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify frozen candidate and release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          XUEQING_ANDROID_KEYSTORE_BASE64: ${{ secrets.XUEQING_ANDROID_KEYSTORE_BASE64 }}
          XUEQING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.XUEQING_ANDROID_KEYSTORE_PASSWORD }}
          XUEQING_ANDROID_KEY_ALIAS: ${{ secrets.XUEQING_ANDROID_KEY_ALIAS }}
          XUEQING_ANDROID_KEY_PASSWORD: ${{ secrets.XUEQING_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+\+[1-9][0-9]*$ ]]; then
            echo "Pilot version must be an explicit semantic prerelease with a positive build number."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v${RELEASE_VERSION%%+*}" ]]; then
            echo "Pilot tag must equal v + app version without the +build suffix."
            exit 1
          fi
          required=(
            XUEQING_ANDROID_KEYSTORE_BASE64
            XUEQING_ANDROID_KEYSTORE_PASSWORD
            XUEQING_ANDROID_KEY_ALIAS
            XUEQING_ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing permanent Android release secret: $name"
              exit 1
            fi
          done
          cert_sha="$(printf '%s' "$XUEQING_ANDROID_CERT_SHA256" | sed 's/[:[:space:]]//g' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$cert_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Pinned Android certificate fingerprint is missing or malformed."
            exit 1
          fi
          compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...main" --jq '.status')"
          behind_by="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...main" --jq '.behind_by')"
          if [[ "$behind_by" != "0" ]] || [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
            echo "Frozen pilot commit is no longer reachable from main."
            exit 1
          fi
          echo "Pilot release inputs validated without printing secret values."

  android-release:
    name: Signed Android pilot APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure permanent Android release signing
        shell: bash
        env:
          XUEQING_ANDROID_KEYSTORE_BASE64: ${{ secrets.XUEQING_ANDROID_KEYSTORE_BASE64 }}
          XUEQING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.XUEQING_ANDROID_KEYSTORE_PASSWORD }}
          XUEQING_ANDROID_KEY_ALIAS: ${{ secrets.XUEQING_ANDROID_KEY_ALIAS }}
          XUEQING_ANDROID_KEY_PASSWORD: ${{ secrets.XUEQING_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$XUEQING_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          {
            printf 'storeFile=release-keystore.jks\n'
            printf 'storePassword=%s\n' "$XUEQING_ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$XUEQING_ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$XUEQING_ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/release-keystore.jks android/key.properties

      - name: Build signed Android pilot APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="$RELEASE_VERSION_NAME" \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --dart-define="XUEQING_ENV=$XUEQING_ENV" \
            --dart-define="XUEQING_APP_VERSION=$RELEASE_VERSION" \
            --dart-define="XUEQING_SUPABASE_URL=$XUEQING_SUPABASE_URL" \
            --dart-define="XUEQING_SUPABASE_PUBLISHABLE_KEY=$XUEQING_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="XUEQING_ALLOW_DEVELOPMENT_RELEASE=$XUEQING_ALLOW_DEVELOPMENT_RELEASE" \
            --dart-define="XUEQING_SHOW_DEV_TOOLS=$XUEQING_SHOW_DEV_TOOLS"

      - name: Verify Android pilot signer
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "apksigner was not found."
            exit 1
          fi
          apk="build/app/outputs/flutter-apk/app-release.apk"
          verify_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          actual_cert_sha="$(printf '%s\n' "$verify_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | sed 's/[:[:space:]]//g' | tr '[:upper:]' '[:lower:]')"
          expected_cert_sha="$(printf '%s' "$XUEQING_ANDROID_CERT_SHA256" | sed 's/[:[:space:]]//g' | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_cert_sha" != "$expected_cert_sha" ]]; then
            echo "Android pilot certificate fingerprint does not match the permanent pinned release identity."
            exit 1
          fi
          echo "Android pilot signer matches the permanent release certificate."

      - name: Upload Android pilot build
        uses: actions/upload-artifact@v4
        with:
          name: pilot-android-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/release-keystore.jks

  windows-release:
    name: Windows pilot bundle and installer
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows pilot release bundle
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define="XUEQING_ENV=$env:XUEQING_ENV" `
            --dart-define="XUEQING_APP_VERSION=$env:RELEASE_VERSION" `
            --dart-define="XUEQING_SUPABASE_URL=$env:XUEQING_SUPABASE_URL" `
            --dart-define="XUEQING_SUPABASE_PUBLISHABLE_KEY=$env:XUEQING_SUPABASE_PUBLISHABLE_KEY" `
            --dart-define="XUEQING_ALLOW_DEVELOPMENT_RELEASE=$env:XUEQING_ALLOW_DEVELOPMENT_RELEASE" `
            --dart-define="XUEQING_SHOW_DEV_TOOLS=$env:XUEQING_SHOW_DEV_TOOLS"
          if ($LASTEXITCODE -ne 0) { throw "Windows pilot build failed." }

      - name: Bundle Visual C++ release runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio locator was not found." }
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw "Visual C++ toolset installation was not found." }
          $releaseDir = Join-Path $pwd "build/windows/x64/runner/Release"
          $redistRoot = Join-Path $vsPath "VC/Redist/MSVC"
          $runtimeDir = Get-ChildItem -Path $redistRoot -Directory -Recurse |
            Where-Object {
              $_.Name -eq "Microsoft.VC143.CRT" -and
              (Test-Path (Join-Path $_.FullName "msvcp140.dll")) -and
              (Test-Path (Join-Path $_.FullName "vcruntime140.dll")) -and
              (Test-Path (Join-Path $_.FullName "vcruntime140_1.dll"))
            } | Select-Object -First 1
          if ($null -eq $runtimeDir) { throw "Visual C++ release runtime directory was not found." }
          foreach ($name in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item -Path (Join-Path $runtimeDir.FullName $name) -Destination $releaseDir -Force
          }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath "VC/Tools/MSVC") -Filter "dumpbin.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $dumpbin) { throw "dumpbin.exe was not found." }
          $deps = (& $dumpbin.FullName /DEPENDENTS (Join-Path $releaseDir "xueqing.exe") 2>&1) -join "`n"
          if ($deps -match "(?i)MSVCP140D\.dll|VCRUNTIME140D\.dll|VCRUNTIME140_1D\.dll|ucrtbased\.dll") {
            throw "Pilot binary depends on a Debug Visual C++ runtime."
          }

      - name: Build and test Windows updater helpers
        shell: pwsh
        working-directory: tools/windows_updater
        run: |
          dart pub get
          dart analyze
          if ($LASTEXITCODE -ne 0) { throw "Windows updater analysis failed." }
          dart test
          if ($LASTEXITCODE -ne 0) { throw "Windows updater tests failed." }
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build/windows/x64/runner/Release"
          dart compile exe bin/xueqing_updater.dart -o (Join-Path $releaseDir "xueqing_updater.exe")
          dart compile exe bin/xueqing_updater.dart -o (Join-Path $releaseDir "xueqing_updater_bootstrap.exe")

      - name: Build Windows pilot installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/tools/windows_installer/build_installer.ps1" -AppVersion "$env:RELEASE_VERSION_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Windows pilot installer build failed." }

      - name: Smoke install and uninstall Windows pilot installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "build/windows/installer") `
            -Filter "xueqing-setup-*.exe" `
            -File |
            Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not found for smoke installation." }
          $installDir = Join-Path $env:LOCALAPPDATA "Programs/Xueqing"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $installProcess = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') `
            -Wait `
            -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Windows installer smoke failed with exit code $($installProcess.ExitCode)." }
          foreach ($requiredFile in @(
            "xueqing.exe",
            "xueqing_updater.exe",
            "xueqing_updater_bootstrap.exe",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )) {
            $installedPath = Join-Path $installDir $requiredFile
            if (-not (Test-Path $installedPath)) { throw "Installer did not install required file: $installedPath" }
            if ((Get-Item $installedPath).Length -le 0) { throw "Installer produced an empty required file: $installedPath" }
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Windows uninstaller was not installed." }
          $uninstallProcess = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait `
            -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Windows uninstaller smoke failed with exit code $($uninstallProcess.ExitCode)." }
          foreach ($removedFile in @("xueqing.exe", "xueqing_updater.exe", "xueqing_updater_bootstrap.exe")) {
            if (Test-Path (Join-Path $installDir $removedFile)) { throw "Windows uninstaller left application file behind: $removedFile" }
          }

      - name: Upload Windows pilot bundle
        uses: actions/upload-artifact@v4
        with:
          name: pilot-windows-bundle-${{ github.run_id }}
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows pilot installer
        uses: actions/upload-artifact@v4
        with:
          name: pilot-windows-installer-${{ github.run_id }}
          path: build/windows/installer/xueqing-setup-${{ env.RELEASE_VERSION_NAME }}.exe
          if-no-files-found: error
          retention-days: 1

  package-and-publish:
    name: Package and publish Pilot Pre-release
    needs: [validate, android-release, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Android pilot
        uses: actions/download-artifact@v4
        with:
          name: pilot-android-${{ github.run_id }}
          path: release-input/android

      - name: Download Windows pilot bundle
        uses: actions/download-artifact@v4
        with:
          name: pilot-windows-bundle-${{ github.run_id }}
          path: release-input/windows

      - name: Download Windows pilot installer
        uses: actions/download-artifact@v4
        with:
          name: pilot-windows-installer-${{ github.run_id }}
          path: release-input/installer

      - name: Package candidate assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          android_asset="xueqing-${RELEASE_TAG}-android.apk"
          windows_asset="xueqing-${RELEASE_TAG}-windows.zip"
          setup_asset="xueqing-${RELEASE_TAG}-windows-setup.exe"
          cp release-input/android/app-release.apk "release-assets/$android_asset"
          test -f release-input/windows/xueqing.exe
          test -f release-input/windows/xueqing_updater.exe
          test -f release-input/windows/xueqing_updater_bootstrap.exe
          (cd release-input/windows && zip -q -r "$GITHUB_WORKSPACE/release-assets/$windows_asset" .)
          installer="release-input/installer/xueqing-setup-${RELEASE_VERSION_NAME}.exe"
          test -s "$installer"
          cp "$installer" "release-assets/$setup_asset"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          info = {
              "channel": "development-candidate",
              "version": os.environ["RELEASE_VERSION"],
              "tag": os.environ["RELEASE_TAG"],
              "source_commit": os.environ["RELEASE_COMMIT"],
              "supabase_environment": "development",
              "android_signing": "permanent-release-certificate-verified",
              "windows_installer_smoke": "passed-before-publish",
              "stable_latest": False,
          }
          Path("release-assets/candidate-info.json").write_text(
              json.dumps(info, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          (cd release-assets && sha256sum *.apk *.zip *.exe candidate-info.json | sort) > release-assets/SHA256SUMS.txt
          cat release-assets/candidate-info.json
          cat release-assets/SHA256SUMS.txt

      - name: Create or verify Pilot Pre-release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
            RELEASE_JSON="$release_json" python3 - <<'PY'
          import json, os
          release = json.loads(os.environ["RELEASE_JSON"])
          if release["isDraft"] or not release["isPrerelease"]:
              raise SystemExit("Existing pilot tag is not a published Pre-release.")
          PY
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --prerelease \
              --title "Xueqing v0.2.0 Pilot 2" \
              --notes $'当前主线成果的第二个实机 Pilot 候选版。\n\n- 包含当前 main 已验证的学生多学科服务、学科结束/恢复、整名学生暂停/恢复与更严格归档边界。\n- 保留现有 Learning Case、Action、Evidence 和任课上下文，不把临时暂停误当作结案或结束教学。\n- Android 使用永久 release keystore 签名，可继续做覆盖升级验证。\n- Windows 提供直接安装的 Setup EXE，并在发布前执行静默安装/卸载 smoke。\n- 本版本连接虚构开发环境，仅用于内部试点与真实设备验收，不是 Production Stable。\n- Stable 通道与 releases/latest 保持隔离。'
          fi
          actual_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          if [[ "$actual_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Pilot tag does not point to the frozen candidate commit."
            exit 1
          fi

      - name: Upload candidate assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify final Pilot Pre-release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url)"
          RELEASE_JSON="$release_json" python3 - <<'PY'
          import json, os
          release = json.loads(os.environ["RELEASE_JSON"])
          if release["isDraft"] or not release["isPrerelease"]:
              raise SystemExit("Pilot Release must remain a published Pre-release.")
          assets = {item["name"]: item for item in release["assets"]}
          tag = os.environ["RELEASE_TAG"]
          expected = {
              f"xueqing-{tag}-android.apk",
              f"xueqing-{tag}-windows.zip",
              f"xueqing-{tag}-windows-setup.exe",
              "candidate-info.json",
              "SHA256SUMS.txt",
          }
          missing = sorted(expected - set(assets))
          if missing:
              raise SystemExit(f"Missing Pilot Release assets: {missing}")
          empty = sorted(name for name in expected if int(assets[name].get("size", 0)) <= 0)
          if empty:
              raise SystemExit(f"Empty Pilot Release assets: {empty}")
          print(release["url"])
          PY
