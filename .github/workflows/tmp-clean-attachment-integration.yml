name: Temporary clean attachment integration

on:
  push:
    branches:
      - phase0b1/evidence-attachments-clean

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out clean candidate
        uses: actions/checkout@v6
        with:
          ref: phase0b1/evidence-attachments-clean
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Integrate only attachment overlap hunks
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin phase0b1/evidence-attachments
          git diff 175f6677f325b22ed5035d18106f361e18ea9c42 origin/phase0b1/evidence-attachments -- \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            test/features/teacher_workspace_test.dart \
            supabase/tests/public_rpc_security_boundary_test.sql \
            > /tmp/attachment-overlap.patch
          test -s /tmp/attachment-overlap.patch
          git apply --3way --index /tmp/attachment-overlap.patch
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Attachment overlap produced unresolved conflicts.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Add image picker without changing app version
        shell: python
        run: |
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          if '  image_picker: ^1.2.3\n' not in text:
              anchor = '  crypto: ^3.0.7\n'
              if anchor not in text:
                  raise SystemExit('pubspec dependency anchor not found')
              text = text.replace(anchor, anchor + '  image_picker: ^1.2.3\n', 1)
          if 'version: 0.1.0+1' not in text:
              raise SystemExit('clean candidate unexpectedly changed app version')
          path.write_text(text, encoding='utf-8')

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format attachment integration
        run: dart format lib/cloud/evidence_attachment_repository.dart lib/features/teacher_workspace/presentation/evidence_attachment_picker.dart lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/cloud/evidence_attachment_repository_test.dart test/features/evidence_attachment_picker_test.dart test/features/teacher_workspace_test.dart

      - name: Verify no merge debris
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' lib test supabase pubspec.yaml
          git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run full Flutter tests
        run: flutter test

      - name: Commit verified clean attachment integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-clean-attachment-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate Evidence attachments on stabilized main'
          git push origin HEAD:phase0b1/evidence-attachments-clean
