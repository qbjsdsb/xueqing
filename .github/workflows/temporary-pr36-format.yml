name: temporary Dart formatter for PR 36

on:
  push:
    branches:
      - phase0b0f/read-boundary-business-date

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Format files
        run: dart format .
      - name: Print formatter diff
        run: git diff --no-ext-diff --color=never -- lib/cloud/learning_repository.dart lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
