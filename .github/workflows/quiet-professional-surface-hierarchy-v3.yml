name: Quiet Professional surface hierarchy v3

on:
  push:
    branches:
      - ux/quiet-professional-surface-hierarchy-v3

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/quiet-professional-surface-hierarchy-v3
          fetch-depth: 0

      - name: Refine workspace surface hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace_path = Path('lib/features/design_v2/v2_workspace_preview.dart')
          workspace = workspace_path.read_text()

          rail_old = 'color: scheme.surfaceContainerLowest,'
          assert workspace.count(rail_old) == 1, 'Expected one desktop rail surfaceContainerLowest fill'
          workspace = workspace.replace(rail_old, 'color: scheme.surface,', 1)

          list_old = 'color: widget.compact ? scheme.surface : scheme.surfaceContainerLowest,'
          assert workspace.count(list_old) == 1, 'Expected one student-list split surface fill'
          workspace = workspace.replace(list_old, 'color: scheme.surface,', 1)
          workspace_path.write_text(workspace)

          management_path = Path(
              'lib/features/organization_management/presentation/organization_management_layout.dart'
          )
          management = management_path.read_text()
          old_fill = 'color: colorScheme.surfaceContainerLow,'
          assert management.count(old_fill) == 2, 'Expected role pill and setup hint muted fills'
          management = management.replace(old_fill, 'color: Colors.transparent,')
          management_path.write_text(management)

          legacy_contract_path = Path('test/features/v032_real_device_ux_contract_test.dart')
          legacy_contract = legacy_contract_path.read_text()
          old_contract = '''  test('compact student canvas no longer mixes list and scaffold surfaces', () {\n    final source = File('lib/features/design_v2/v2_workspace_preview.dart')\n        .readAsStringSync();\n    expect(\n      source,\n      contains(\n        'widget.compact ? scheme.surface : scheme.surfaceContainerLowest',\n      ),\n    );\n    expect(\n      source,\n      contains('backgroundColor: Theme.of(context).colorScheme.surface'),\n    );\n  });'''
          new_contract = '''  test('student canvas uses one base surface across compact and split layouts', () {\n    final source = File('lib/features/design_v2/v2_workspace_preview.dart')\n        .readAsStringSync();\n    expect(source, contains('color: scheme.surface,'));\n    expect(\n      source,\n      isNot(\n        contains(\n          'widget.compact ? scheme.surface : scheme.surfaceContainerLowest',\n        ),\n      ),\n    );\n    expect(\n      source,\n      contains('backgroundColor: Theme.of(context).colorScheme.surface'),\n    );\n  });'''
          assert old_contract in legacy_contract, 'Expected legacy student-surface contract'
          legacy_contract_path.write_text(legacy_contract.replace(old_contract, new_contract, 1))
          PY

      - name: Add surface hierarchy contract
        run: |
          cat > test/features/v2_surface_hierarchy_contract_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          String _slice(String source, String start, String end) {
            final startIndex = source.indexOf(start);
            final endIndex = source.indexOf(end, startIndex + start.length);
            expect(startIndex, greaterThanOrEqualTo(0), reason: 'Missing $start');
            expect(endIndex, greaterThan(startIndex), reason: 'Missing $end after $start');
            return source.substring(startIndex, endIndex);
          }

          void main() {
            test('workspace structural panes share one quiet base surface', () {
              final workspace = File('lib/features/design_v2/v2_workspace_preview.dart')
                  .readAsStringSync();

              final rail = _slice(
                workspace,
                'class _NavigationRail',
                'class _RailGroupLabel',
              );
              expect(rail, contains('color: scheme.surface,'));
              expect(rail, isNot(contains('surfaceContainerLowest')));

              final studentList = _slice(
                workspace,
                'class _StudentListPaneState',
                'class _StudentRow',
              );
              expect(studentList, contains('color: scheme.surface,'));
              expect(studentList, isNot(contains('surfaceContainerLowest')));
            });

            test('management utility cues use line and spacing before extra fills', () {
              final management = File(
                'lib/features/organization_management/presentation/organization_management_layout.dart',
              ).readAsStringSync();

              final header = _slice(
                management,
                'class _ManagementHeader',
                'class _ManagementToolbar',
              );
              expect(header, contains('color: Colors.transparent,'));
              expect(header, isNot(contains('surfaceContainerLow')));

              final setupHint = _slice(
                management,
                'class _ManagementSetupHint',
                'class _ManagementEmptyState',
              );
              expect(setupHint, contains('color: Colors.transparent,'));
              expect(setupHint, isNot(contains('surfaceContainerLow')));
            });
          }
          DART

      - name: Remove one-shot assets
        run: rm .github/workflows/quiet-professional-surface-hierarchy-v3.yml .xueqing-full-test-failure.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format
        run: |
          dart format lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/organization_management/presentation/organization_management_layout.dart \
            test/features/v032_real_device_ux_contract_test.dart \
            test/features/v2_surface_hierarchy_contract_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Focused visual acceptance
        run: |
          flutter test \
            test/features/v032_real_device_ux_contract_test.dart \
            test/features/v2_surface_hierarchy_contract_test.dart \
            test/features/v2_visual_polish_contract_test.dart \
            test/features/v2_adaptive_workspace_test.dart \
            test/features/windows_workspace_acceptance_matrix_test.dart \
            test/features/management_workflow_clarity_contract_test.dart

      - name: Full suite with failure capture
        id: full-suite
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/xueqing-full-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/xueqing-full-test.log').read_text(errors='replace').splitlines()
          markers = (
              'Test failed',
              'Some tests failed',
              'Expected:',
              'Actual:',
              'Which:',
              '══╡',
              '[E]',
              'FAILED',
          )
          hits = [i for i, line in enumerate(lines) if any(marker in line for marker in markers)]
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 12), min(len(lines), i + 28)))
          selected.update(range(max(0, len(lines) - 120), len(lines)))
          output = '\n'.join(lines[i] for i in sorted(selected))
          Path('.xueqing-full-test-failure.txt').write_text(output + '\n')
          print(output)
          PY
            exit "$status"
          fi

      - name: Commit diagnostic failure summary only
        if: failure() && steps.full-suite.outcome == 'failure'
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .xueqing-full-test-failure.txt
          git commit -m "chore(ci): refresh full-suite failure capture"
          git push origin HEAD:ux/quiet-professional-surface-hierarchy-v3

      - name: Commit verified refinement
        if: success()
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(v2): unify quiet workspace surfaces"
          git push origin HEAD:ux/quiet-professional-surface-hierarchy-v3
