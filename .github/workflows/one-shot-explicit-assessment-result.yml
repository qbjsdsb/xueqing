name: One-shot explicit assessment result

on:
  push:
    branches:
      - ux/explicit-assessment-result
    paths:
      - .github/workflows/one-shot-explicit-assessment-result.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/explicit-assessment-result
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Require an explicit assessment result
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          forms_path = Path('lib/features/teacher_workspace/presentation/progressive_case_forms.dart')
          forms = forms_path.read_text(encoding='utf-8')
          forms = replace_once(
              forms,
              'CaseAssessmentResult _assessmentResult = CaseAssessmentResult.partial;',
              'CaseAssessmentResult? _assessmentResult;',
              'nullable assessment result',
          )
          forms = replace_once(
              forms,
              'String? _summaryError;\n  String? _reminderError;',
              'String? _summaryError;\n  String? _assessmentError;\n  String? _reminderError;',
              'assessment error state',
          )
          forms = replace_once(
              forms,
              '_assessmentResult != CaseAssessmentResult.partial ||',
              '_assessmentResult != null ||',
              'assessment dirty baseline',
          )
          forms = replace_once(
              forms,
              "    if (_nextStep == CaseProgressNextStep.remind && reminder.isEmpty) {\n      _reminderError = '请写下需要提醒自己做什么';\n      valid = false;\n    }",
              "    if (_kind == CaseProgressKind.assessment && _assessmentResult == null) {\n      _assessmentError = '请选择这次检查结果';\n      valid = false;\n    }\n    if (_nextStep == CaseProgressNextStep.remind && reminder.isEmpty) {\n      _reminderError = '请写下需要提醒自己做什么';\n      valid = false;\n    }",
              'assessment validation',
          )
          forms = replace_once(
              forms,
              "        ? '检查结果：${_assessmentResult.label}'",
              "        ? '检查结果：${_assessmentResult!.label}'",
              'assessment summary null assertion',
          )
          forms = replace_once(
              forms,
              "                                : (_) => setState(() {\n                                    _kind = kind;\n                                    _summaryError = null;\n                                  }),",
              "                                : (_) => setState(() {\n                                    _kind = kind;\n                                    _summaryError = null;\n                                    if (kind != CaseProgressKind.assessment) {\n                                      _assessmentResult = null;\n                                      _assessmentError = null;\n                                    }\n                                  }),",
              'clear hidden assessment state',
          )
          forms = replace_once(
              forms,
              "                      decoration: const InputDecoration(labelText: '检查结果 *'),",
              "                      decoration: InputDecoration(\n                        labelText: '检查结果 *',\n                        errorText: _assessmentError,\n                      ),",
              'assessment field error',
          )
          forms = replace_once(
              forms,
              "                              if (result != null) {\n                                setState(() => _assessmentResult = result);\n                              }",
              "                              if (result != null) {\n                                setState(() {\n                                  _assessmentResult = result;\n                                  _assessmentError = null;\n                                });\n                              }",
              'clear assessment error on selection',
          )
          forms = replace_once(
              forms,
              "                      '只选检查结果也可以保存；需要时再补一句说明。',",
              "                      '先明确选择检查结果；补充说明仍然可以不写。',",
              'assessment helper copy',
          )
          forms_path.write_text(forms, encoding='utf-8')

          test_path = Path('test/features/progressive_case_forms_test.dart')
          test = test_path.read_text(encoding='utf-8')
          marker = "  testWidgets('assessment result can be saved without manufacturing notes', (\n"
          if test.count(marker) != 1:
              raise SystemExit(f'assessment test marker: expected one match, got {test.count(marker)}')
          addition = r'''  testWidgets('assessment requires the teacher to choose a result explicitly', (
    tester,
  ) async {
    final repository = _FakeProgressiveCaseRepository();
    await tester.pumpWidget(
      _host(CaseProgressForm(repository: repository, learningCase: _case())),
    );

    await tester.tap(find.byKey(const Key('progress-record-options-toggle')));
    await tester.pumpAndSettle();
    await tester.tap(find.byKey(const Key('progress-kind-assessment')));
    await tester.pumpAndSettle();

    final resultPicker = find.byKey(const Key('progress-assessment-result'));
    expect(resultPicker, findsOneWidget);
    expect(
      tester.widget<DropdownButtonFormField<CaseAssessmentResult>>(resultPicker).initialValue,
      isNull,
    );

    await _tapVisible(tester, find.byKey(const Key('progress-save')));
    await tester.pumpAndSettle();

    expect(repository.progressCommands, isEmpty);
    expect(find.text('请选择这次检查结果'), findsOneWidget);
  });

'''
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Format and run focused tests
        run: |
          dart format \
            lib/features/teacher_workspace/presentation/progressive_case_forms.dart \
            test/features/progressive_case_forms_test.dart
          flutter test test/features/progressive_case_forms_test.dart
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-explicit-assessment-result.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: require explicit assessment result"
          git push origin HEAD:ux/explicit-assessment-result
