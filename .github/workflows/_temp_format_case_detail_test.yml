name: Temporary format case detail test

on:
  push:
    branches:
      - ux/case-detail-teacher-workflow
    paths:
      - .github/workflows/_temp_format_case_detail_test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/case-detail-teacher-workflow
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Format reviewed test
        run: dart format test/features/design_v2_read_model_adapter_test.dart
      - name: Commit formatted result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_temp_format_case_detail_test.yml
          git config user.name "xueqing-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format case detail regression test"
          git push origin HEAD:ux/case-detail-teacher-workflow
