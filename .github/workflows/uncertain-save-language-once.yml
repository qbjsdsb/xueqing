name: One-shot uncertain-save teacher language cleanup

on:
  push:
    branches:
      - ux/teacher-error-language
    paths:
      - .github/workflows/uncertain-save-language-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-error-language
          fetch-depth: 0

      - name: Replace server-centric uncertain-save language
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          progressive = 'lib/features/teacher_workspace/presentation/progressive_case_forms.dart'
          workspace = 'lib/features/teacher_workspace/presentation/teacher_workspace_page.dart'
          workspace_test = 'test/features/teacher_workspace_test.dart'

          replace(progressive, '提交结果还没确认', '刚才是否保存成功还不能确认', 2)
          replace(
              progressive,
              '上一次提交可能已经到达服务器。建议重新保存，不要重新填写另一份。',
              '刚才的记录可能已经保存成功。请点“重新保存”继续，不要重新填写另一份。',
              1,
          )
          replace(
              progressive,
              '上一次提交可能已经到达服务器。建议重新保存。',
              '刚才的记录可能已经保存成功。请点“重新保存”继续，系统不会重复保存。',
              1,
          )
          replace(
              progressive,
              '网络暂时不可用，服务器结果还不能确认。输入已经锁定，请直接重新保存。',
              '网络暂时不可用，刚才是否保存成功还不能确认。内容还在，请直接重新保存，系统不会重复保存。',
              1,
          )

          replace(workspace, '提交结果未确认', '刚才是否保存成功还不能确认', 1)
          replace(
              workspace,
              '上一次提交可能已经到达服务器。建议重新保存。',
              '刚才的记录可能已经保存成功。请点“重新保存”继续，系统不会重复保存。',
              1,
          )

          replace(workspace_test, '提交结果未确认', '刚才是否保存成功还不能确认', 2)

          for path in (progressive, workspace):
              text = Path(path).read_text(encoding='utf-8')
              for stale in ('提交结果未确认', '提交结果还没确认', '可能已经到达服务器', '服务器结果还不能确认'):
                  if stale in text:
                      raise SystemExit(f'{path}: stale teacher-facing wording remains: {stale}')
          PY

      - name: Verify exact scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "$(printf '%s\n' \
            lib/features/teacher_workspace/presentation/progressive_case_forms.dart \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            test/features/teacher_workspace_test.dart | sort | tr '\n' ' ')"

      - name: Commit real patch and remove one-shot workflow
        run: |
          rm .github/workflows/uncertain-save-language-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: explain uncertain saves in teacher language"
          git push origin HEAD:ux/teacher-error-language
