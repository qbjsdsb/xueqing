name: One-shot teacher error language

on:
  push:
    branches:
      - ux/teacher-error-language
    paths:
      - tool/one_shot_teacher_error_language.py
      - .github/workflows/one-shot-teacher-error-language.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-error-language
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Apply focused copy cleanup
        run: python3 tool/one_shot_teacher_error_language.py
      - name: Run focused tests and capture diagnostics
        shell: bash
        run: |
          flutter pub get
          dart format lib/features/teacher_workspace/presentation/progressive_case_forms.dart lib/features/teacher_workspace/presentation/teacher_workspace_page.dart lib/features/teacher_workspace/presentation/evidence_attachment_picker.dart test/features/teacher_workspace_test.dart test/features/evidence_attachment_picker_test.dart
          set +e
          : > teacher-error-language-diagnostics.txt
          for test_file in \
            test/features/progressive_case_forms_test.dart \
            test/features/teacher_workspace_test.dart \
            test/features/evidence_attachment_picker_test.dart
          do
            echo "===== $test_file =====" | tee -a teacher-error-language-diagnostics.txt
            flutter test "$test_file" -r expanded 2>&1 | tee -a teacher-error-language-diagnostics.txt
            code=${PIPESTATUS[0]}
            echo "EXIT_CODE=$code" | tee -a teacher-error-language-diagnostics.txt
          done
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-error-language-diagnostics
          path: teacher-error-language-diagnostics.txt
          if-no-files-found: error
