name: Apply student actions progressive disclosure v0.2.1

on:
  push:
    branches:
      - ux/student-actions-progressive-disclosure-v021

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply focused student action patch
        run: python3 tool/apply_student_actions_progressive_disclosure_v021.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/organization_management/presentation/organization_management_rows.dart lib/features/organization_management/presentation/organization_management_learning_actions.dart test/features/organization_management_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated product changes
        run: |
          rm -f tool/apply_student_actions_progressive_disclosure_v021.py .github/workflows/apply-student-actions-progressive-disclosure-v021.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "UX: hide low-frequency student actions behind more menu"
          git push origin HEAD:ux/student-actions-progressive-disclosure-v021
