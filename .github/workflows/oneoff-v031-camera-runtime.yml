name: One-off v0.3.1 camera runtime recovery

on:
  push:
    branches:
      - hotfix/v0.3.1-reliability-mobile
    paths:
      - .github/workflows/oneoff-v031-camera-runtime.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.3.1-reliability-mobile
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply production recovery wiring
        run: |
          python3 .github/scripts/apply_v031_camera_runtime.py
          python3 .github/scripts/fix_v031_camera_runtime_preview.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format focused changes
        run: |
          dart format \
            lib/features/teacher_workspace/workspace_runtime.dart \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/v2_quick_capture_runtime_recovery_test.dart \
            test/features/v2_quick_capture_runtime_wiring_contract_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused production recovery tests
        run: |
          flutter test test/features/v2_quick_capture_runtime_recovery_test.dart
          flutter test test/features/v2_quick_capture_runtime_wiring_contract_test.dart
          flutter test test/features/v2_quick_capture_recovery_test.dart
          flutter test test/features/design_v2_workspace_loader_test.dart
          flutter test test/features/design_v2_workspace_page_test.dart
          flutter test test/features/design_v2_composers_test.dart

      - name: Full tests
        run: flutter test

      - name: Verify patch boundary
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(lib/features/teacher_workspace/workspace_runtime\.dart|lib/features/teacher_workspace/presentation/teacher_workspace_page\.dart|lib/features/design_v2/v2_workspace_loader\.dart|lib/features/design_v2/v2_workspace_preview\.dart|test/features/v2_quick_capture_runtime_recovery_test\.dart|test/features/v2_quick_capture_runtime_wiring_contract_test\.dart)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed by camera runtime patch:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit verified changes and remove one-off harness
        shell: bash
        run: |
          rm -f .github/scripts/apply_v031_camera_runtime.py
          rm -f .github/scripts/fix_v031_camera_runtime_preview.py
          rm -f .github/workflows/oneoff-v031-camera-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Restore Android quick-capture drafts after process death'
          git push origin HEAD:hotfix/v0.3.1-reliability-mobile
