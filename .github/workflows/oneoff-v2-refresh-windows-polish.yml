name: One-off V2 refresh and Windows polish

on:
  push:
    branches:
      - ui/v2-refresh-windows-polish

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ui/v2-refresh-windows-polish
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Apply refresh and polish patch
        run: python3 .github/scripts/patch_v2_refresh_windows_polish.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/design_v2/v2_theme.dart \
            lib/features/organization_management/presentation/organization_management_core.dart \
            lib/features/organization_management/presentation/organization_management_page.dart \
            lib/features/organization_management/presentation/organization_management_layout.dart \
            lib/app/theme/app_theme.dart \
            lib/app/theme/app_spacing.dart \
            test/features/design_v2_workspace_loader_test.dart \
            test/features/v2_refresh_polish_test.dart \
            test/features/v2_shell_production_capabilities_test.dart \
            test/windows_window_chrome_contract_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run focused refresh and polish tests
        run: |
          flutter test test/features/design_v2_workspace_loader_test.dart
          flutter test test/features/design_v2_workspace_test.dart
          flutter test test/features/v2_refresh_polish_test.dart
          flutter test test/features/v2_shell_production_capabilities_test.dart
          flutter test test/windows_window_chrome_contract_test.dart

      - name: Run full Flutter test suite
        run: flutter test

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated product changes and remove one-off machinery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/design_v2/v2_theme.dart \
            lib/features/organization_management/presentation/organization_management_core.dart \
            lib/features/organization_management/presentation/organization_management_page.dart \
            lib/features/organization_management/presentation/organization_management_layout.dart \
            lib/app/theme/app_theme.dart \
            lib/app/theme/app_spacing.dart \
            windows/runner/win32_window.cpp \
            test/features/design_v2_workspace_loader_test.dart \
            test/features/v2_refresh_polish_test.dart \
            test/features/v2_shell_production_capabilities_test.dart \
            test/windows_window_chrome_contract_test.dart
          git rm -f .github/scripts/patch_v2_refresh_windows_polish.py
          git rm -f .github/workflows/oneoff-v2-refresh-windows-polish.yml
          git diff --cached --check
          git commit -m 'UI V2: add refresh and refine Windows chrome'
          git push origin HEAD:ui/v2-refresh-windows-polish
