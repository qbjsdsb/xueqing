name: Apply management quiet actions polish

on:
  push:
    branches:
      - ux/management-quiet-actions-20260913
    paths:
      - .github/ux-management-quiet-actions.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/management-quiet-actions-20260913

      - name: Apply focused UI polish
        run: python3 .github/scripts/management_quiet_actions_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format focused files
        run: dart format lib/features/organization_management/presentation/organization_management_rows.dart test/features/organization_management_test.dart

      - name: Run targeted management tests
        run: flutter test test/features/organization_management_test.dart test/features/management_visual_density_test.dart

      - name: Remove temporary patch machinery
        run: rm -f .github/workflows/apply-management-quiet-actions.yml .github/ux-management-quiet-actions.trigger .github/scripts/management_quiet_actions_patch.py

      - name: Commit polished source
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "polish(ui): 收紧机构管理行内动作"
          git push origin HEAD:ux/management-quiet-actions-20260913
