name: Temporary management analyzer diagnostics

on:
  push:
    branches:
      - ux/simplify-management-and-member-names

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/simplify-management-and-member-names
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Reproduce proposed polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/tmp-management-ux-polish.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply teacher-facing UX polish'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          script = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - ') and not line.startswith('          '):
                  break
              if line.startswith('          '):
                  script.append(line[10:])
              elif line.strip() == '':
                  script.append('')
              else:
                  break
          Path('/tmp/apply-management-polish.py').write_text('\n'.join(script) + '\n', encoding='utf-8')
          PY
          python /tmp/apply-management-polish.py

      - run: flutter pub get

      - name: Format proposed files
        run: dart format lib/features/organization_management/presentation lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/organization_management_test.dart test/features/teacher_workspace_test.dart

      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze > tmp-management-analyze.txt 2>&1
          cat tmp-management-analyze.txt
          exit 0

      - name: Keep diagnostics only
        shell: bash
        run: |
          git restore lib test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-management-analyze.txt
          git commit -m "ci: capture management UX analyzer diagnostics"
          git push origin HEAD:ux/simplify-management-and-member-names
