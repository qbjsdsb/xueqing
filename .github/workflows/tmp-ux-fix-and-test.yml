name: Temporary UX fix and test

on:
  push:
    branches:
      - ux/simplify-management-and-member-names

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out UX branch
        uses: actions/checkout@v6
        with:
          ref: ux/simplify-management-and-member-names
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'lib/features/organization_management/presentation/organization_management_layout.dart': [
                  ('AppRadii.large', 'AppRadii.medium'),
              ],
              'lib/features/organization_management/presentation/organization_management_dialogs.dart': [
                  ('姓名用于机构内显示；邮箱用于登录。新账号会生成一次性临时密码。',
                   '姓名用于机构内显示，邮箱用于登录。新账号会使用这里的姓名；已有账号接受邀请时会再次确认姓名。'),
              ],
              'test/features/organization_management_test.dart': [
                  ("expect(find.text('学生任课关系'), findsOneWidget);", "expect(find.text('任课老师'), findsOneWidget);"),
                  ("expect(find.text('主责：新老师 · new-teacher@example.com'), findsOneWidget);", "expect(find.text('主责老师：新老师 · new-teacher@example.com'), findsOneWidget);"),
                  ("await tester.tap(find.text('配置教学范围'));", "await tester.tap(find.text('配置老师可教学科'));"),
                  ("expect(find.text('停用教学范围？'), findsOneWidget);", "expect(find.text('停用这门可教学科？'), findsOneWidget);"),
                  ("await tester.tap(find.widgetWithText(FilledButton, '停用教学范围'));", "await tester.tap(find.widgetWithText(FilledButton, '确认停用'));"),
                  ("expect(find.text('重新启用教学范围？'), findsOneWidget);", "expect(find.text('重新启用这门可教学科？'), findsOneWidget);"),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {file_name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              if text == original:
                  raise SystemExit(f'No change applied to {file_name}')

          for temporary in [
              Path('.github/workflows/tmp-analyze-ux.yml'),
              Path('tmp-flutter-analyze.txt'),
          ]:
              if temporary.exists():
                  temporary.unlink()

      - name: Install packages
        run: flutter pub get

      - name: Format
        run: dart format lib/cloud/organization_member_provisioning_repository.dart lib/features/organization_management/presentation test/features/organization_management_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit verified fixes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/tmp-ux-fix-and-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: verify simplified organization management UX"
          git push origin HEAD:ux/simplify-management-and-member-names
