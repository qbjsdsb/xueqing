name: Integrate V2 composers retry

on:
  push:
    paths:
      - '.github/workflows/integrate-v2-composers-retry.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-prototype-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Reuse scoped integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/integrate-v2-composers-once.yml').read_text().splitlines()
          capture = False
          lines = []
          for line in workflow:
            if "python3 - <<'PY'" in line:
              capture = True
              continue
            if capture and line.strip() == 'PY':
              break
            if capture:
              lines.append(line[10:] if line.startswith('          ') else line)
          assert lines
          exec('\n'.join(lines), {'__name__': '__main__'})
          PY
      - name: Make compact footer genuinely responsive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/design_v2/v2_composers.dart')
          text = path.read_text()
          old = """    return Padding(\n      padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 14),\n      child: Row(\n        children: [\n          Text('V2 预览 · 不写入正式学情', style: Theme.of(context).textTheme.bodySmall),\n          const Spacer(),\n          FilledButton(onPressed: onPrimary, child: Text(primaryLabel)),\n        ],\n      ),\n    );\n"""
          new = """    return Padding(\n      padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 14),\n      child: LayoutBuilder(\n        builder: (context, constraints) {\n          final compact = constraints.maxWidth < 360;\n          final note = Text(\n            'V2 预览 · 不写入正式学情',\n            style: Theme.of(context).textTheme.bodySmall,\n          );\n          final action = FilledButton(\n            onPressed: onPrimary,\n            child: Text(primaryLabel),\n          );\n          if (compact) {\n            return Column(\n              crossAxisAlignment: CrossAxisAlignment.stretch,\n              children: [\n                note,\n                const SizedBox(height: 8),\n                action,\n              ],\n            );\n          }\n          return Row(\n            children: [\n              note,\n              const Spacer(),\n              action,\n            ],\n          );\n        },\n      ),\n    );\n"""
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format, analyze, and test V2
        run: |
          dart format \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_composers_test.dart
          flutter analyze \
            lib/main_v2.dart \
            lib/features/design_v2/v2_theme.dart \
            lib/features/design_v2/v2_fixture.dart \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart
          flutter test \
            test/features/design_v2_workspace_test.dart \
            test/features/design_v2_composers_test.dart
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_composers_test.dart
          git commit -m 'ui(v2): integrate adaptive capture and progress flows'
          git push origin HEAD:ui/v2-prototype-foundation
