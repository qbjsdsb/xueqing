name: Apply Android root swipe polish

on:
  push:
    branches:
      - ux/android-root-swipe-navigation-20260913
    paths:
      - .github/android-root-swipe.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/android-root-swipe-navigation-20260913

      - name: Apply focused Android swipe polish
        run: python3 .github/scripts/android_root_swipe_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format focused files
        run: dart format lib/features/design_v2/v2_workspace_preview.dart test/features/design_v2_workspace_test.dart

      - name: Run focused navigation tests
        run: flutter test test/features/design_v2_workspace_test.dart test/features/v2_final_ergonomics_test.dart test/features/v2_typed_organization_navigation_test.dart

      - name: Analyze focused implementation
        run: flutter analyze lib/features/design_v2/v2_workspace_preview.dart test/features/design_v2_workspace_test.dart

      - name: Remove temporary patch machinery
        run: rm -f .github/workflows/apply-android-root-swipe.yml .github/android-root-swipe.trigger .github/scripts/android_root_swipe_patch.py

      - name: Commit polished source
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "polish(android): add guarded root page swipe"
          git push origin HEAD:ux/android-root-swipe-navigation-20260913
