name: One-off v0.3.1 embedded export images

on:
  push:
    branches:
      - hotfix/v0.3.1-reliability-mobile
    paths:
      - .github/workflows/oneoff-v031-embedded-export-images.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.1-reliability-mobile
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply attachment-aware workbook export
        run: python3 .github/scripts/oneoff_v031_embed_images.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/cloud/evidence_attachment_repository.dart \
            lib/cloud/teacher_learning_record_repository.dart \
            lib/export/learning_record_export.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_management_page.dart \
            lib/features/organization_management/presentation/organization_management_page.dart \
            lib/features/organization_management/presentation/organization_management_learning_actions.dart \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            test/cloud/teacher_learning_record_repository_test.dart \
            test/cloud/student_learning_record_repository_test.dart \
            test/export/learning_record_export_images_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused export tests
        run: |
          flutter test test/export/learning_record_export_images_test.dart
          flutter test test/export/learning_record_export_test.dart
          flutter test test/export/student_learning_record_export_test.dart
          flutter test test/export/teacher_learning_record_export_test.dart
          flutter test test/cloud/student_learning_record_repository_test.dart
          flutter test test/cloud/teacher_learning_record_repository_test.dart
          flutter test test/features/v2_shell_production_capabilities_test.dart
          flutter test test/features/organization_management_test.dart

      - name: Full tests
        run: flutter test

      - name: Verify diff
        run: git diff --check

      - name: Commit verified embedded-image export
        run: |
          rm -f .github/workflows/oneoff-v031-embedded-export-images.yml
          rm -f .github/scripts/oneoff_v031_embed_images.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Embed compressed evidence images in learning record exports'
          git push origin HEAD:hotfix/v0.3.1-reliability-mobile
