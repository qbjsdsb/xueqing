name: One-shot v0.3.8 release gate patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.3.8-final-hardening
      - name: Require organization responsibility capability
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          grep -F 'organization_profile_responsibility' .github/workflows/publish-release-assets.yml
      - name: Commit verified release gate and remove workflow
        shell: bash
        run: |
          rm .github/workflows/zz-v038-release-gate-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish-release-assets.yml .github/workflows/zz-v038-release-gate-once.yml
          git commit -m "release: require organization responsibility capability"
          git push origin HEAD:release/v0.3.8-final-hardening
