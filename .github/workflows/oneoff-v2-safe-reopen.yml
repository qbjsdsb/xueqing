name: One-off V2 safe reopen implementation

on:
  push:
    branches:
      - ui/v2-safe-reopen
    paths:
      - .github/workflows/oneoff-v2-safe-reopen.yml

permissions:
  contents: write

jobs:
  implement-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ui/v2-safe-reopen
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply guarded safe reopen patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          controller = 'lib/features/design_v2/v2_workflow_controller.dart'
          replace_once(
              controller,
              "import '../../cloud/evidence_attachment_repository.dart';\n",
              "import '../../cloud/case_reopen_draft_store.dart';\nimport '../../cloud/evidence_attachment_repository.dart';\n",
          )

          replace_once(
              controller,
              'class V2PendingActionSnapshot {\n',
              '''class V2ReopenWrite {
            const V2ReopenWrite({
              required this.caseId,
              required this.recurrenceSummary,
              required this.nextActionTitle,
              this.nextActionDueOn,
              this.observedAt,
            });

            final String caseId;
            final String recurrenceSummary;
            final String nextActionTitle;
            final DateTime? nextActionDueOn;
            final DateTime? observedAt;
          }

          class V2ReopenDraftSnapshot {
            const V2ReopenDraftSnapshot({
              required this.caseId,
              required this.recurrenceSummary,
              required this.nextActionTitle,
              required this.nextActionDueOn,
            });

            final String caseId;
            final String recurrenceSummary;
            final String nextActionTitle;
            final DateTime? nextActionDueOn;
          }

          class V2PendingActionSnapshot {
          ''',
          )

          replace_once(
              controller,
              '''    this.evidenceAttachmentRepository,
            DateTime Function()? now,
          }) : _now = now ?? DateTime.now;

          final TeacherWorkspace workspace;
          final LearningRepository learningRepository;
          final ProgressiveCaseRepository progressiveCaseRepository;
          final EvidenceAttachmentRepository? evidenceAttachmentRepository;
          final DateTime Function() _now;
          ''',
              '''    this.evidenceAttachmentRepository,
            this.caseReopenDraftStore,
            this.sessionUserId,
            DateTime Function()? now,
          }) : _now = now ?? DateTime.now;

          final TeacherWorkspace workspace;
          final LearningRepository learningRepository;
          final ProgressiveCaseRepository progressiveCaseRepository;
          final EvidenceAttachmentRepository? evidenceAttachmentRepository;
          final CaseReopenDraftStore? caseReopenDraftStore;
          final String? sessionUserId;
          final DateTime Function() _now;
          ''',
          )

          replace_once(
              controller,
              '  List<V2CaseTypeChoice> get caseTypeChoices {\n',
              '''  bool canReopenClosedCase(String caseId) {
            if (caseReopenDraftStore == null || _reopenDraftScopeKey(caseId) == null) {
              return false;
            }
            try {
              return _caseFor(caseId).status == LearningCaseStatus.closed;
            } on StateError {
              return false;
            }
          }

          Future<V2ReopenDraftSnapshot?> loadPendingReopen(String caseId) async {
            if (!canReopenClosedCase(caseId)) {
              return null;
            }
            final scopeKey = _reopenDraftScopeKey(caseId)!;
            try {
              final draft = await caseReopenDraftStore!.load(scopeKey);
              if (draft == null) {
                return null;
              }
              if (draft.caseId != caseId) {
                throw const FormatException('Case reopen draft identity mismatch.');
              }
              return V2ReopenDraftSnapshot(
                caseId: draft.caseId,
                recurrenceSummary: draft.evidenceSummary,
                nextActionTitle: draft.nextActionTitle,
                nextActionDueOn: draft.nextActionDueOn,
              );
            } catch (error) {
              throw V2WorkflowSaveException(
                '上次未完成的重新跟进暂时无法恢复，请重试。',
                recordMayBeSaved: false,
                cause: error,
              );
            }
          }

          Future<V2WorkflowResult> reopenClosedCase(V2ReopenWrite write) async {
            final learningCase = _caseFor(write.caseId);
            if (learningCase.status != LearningCaseStatus.closed) {
              throw const V2WorkflowSaveException(
                '这个问题已经不是已结束状态，请刷新后再处理。',
                recordMayBeSaved: false,
              );
            }
            final store = caseReopenDraftStore;
            final scopeKey = _reopenDraftScopeKey(write.caseId);
            if (store == null || scopeKey == null) {
              throw const V2WorkflowSaveException(
                '当前登录状态无法安全恢复重新跟进，请刷新或重新登录后再试。',
                recordMayBeSaved: false,
              );
            }

            CaseReopenDraft? draft;
            try {
              draft = await store.load(scopeKey);
            } catch (error) {
              throw V2WorkflowSaveException(
                '上次未完成的重新跟进暂时无法恢复，请重试。',
                recordMayBeSaved: false,
                cause: error,
              );
            }

            if (draft == null) {
              final summary = write.recurrenceSummary.trim();
              final nextActionTitle = write.nextActionTitle.trim();
              if (summary.isEmpty) {
                throw const V2WorkflowSaveException(
                  '请先写清楚这次为什么需要重新跟进。',
                  recordMayBeSaved: false,
                );
              }
              if (nextActionTitle.isEmpty) {
                throw const V2WorkflowSaveException(
                  '请写清楚下一步准备做什么。',
                  recordMayBeSaved: false,
                );
              }
              final dueOn = write.nextActionDueOn;
              if (dueOn != null) {
                final dueDay = DateTime(dueOn.year, dueOn.month, dueOn.day);
                final currentBusinessDate = businessDate;
                final businessDay = DateTime(
                  currentBusinessDate.year,
                  currentBusinessDate.month,
                  currentBusinessDate.day,
                );
                if (dueDay.isBefore(businessDay)) {
                  throw const V2WorkflowSaveException(
                    '下一次跟进日期不能早于机构业务日。',
                    recordMayBeSaved: false,
                  );
                }
              }
              draft = CaseReopenDraft(
                schemaVersion: CaseReopenDraft.currentSchemaVersion,
                caseId: learningCase.id,
                expectedCaseVersion: learningCase.version,
                evidenceOperationId: createOperationId(),
                reopenOperationId: createOperationId(),
                sourceType: 'observation',
                evidenceTitle: '问题再次出现',
                evidenceSummary: summary,
                observedAt: write.observedAt ?? _now(),
                evidenceVersion: 1,
                nextActionTypeWire: CaseActionType.verify.wireValue,
                nextActionTitle: nextActionTitle,
                nextActionDueOn: dueOn,
              );
              try {
                await store.save(scopeKey, draft);
              } catch (error) {
                throw V2WorkflowSaveException(
                  '重新跟进还没有开始保存，请检查本机存储后重试。',
                  recordMayBeSaved: false,
                  cause: error,
                );
              }
            } else if (draft.caseId != learningCase.id) {
              throw const V2WorkflowSaveException(
                '恢复的重新跟进与当前问题不一致，请刷新后再试。',
                recordMayBeSaved: false,
              );
            }

            var currentDraft = draft;
            var evidenceId = currentDraft.evidenceId;
            if (evidenceId == null) {
              late final CaseCommandReceipt evidenceReceipt;
              try {
                evidenceReceipt = await learningRepository.addCaseEvidence(
                  AddCaseEvidenceCommand(
                    operationId: currentDraft.evidenceOperationId,
                    caseId: currentDraft.caseId,
                    expectedCaseVersion: currentDraft.expectedCaseVersion,
                    sourceType: currentDraft.sourceType,
                    title: currentDraft.evidenceTitle,
                    observedAt: currentDraft.observedAt,
                    summary: currentDraft.evidenceSummary,
                  ),
                );
              } catch (error) {
                throw V2WorkflowSaveException(
                  '“再次出现”的证据尚未确认保存完整。原操作已经保留，请直接重试。',
                  recordMayBeSaved: true,
                  cause: error,
                );
              }
              evidenceId = evidenceReceipt.recordId;
              if (evidenceId == null || evidenceId.trim().isEmpty) {
                throw const V2WorkflowSaveException(
                  '“再次出现”的证据可能已保存，但没有拿到关联信息。请直接重试。',
                  recordMayBeSaved: true,
                );
              }
              currentDraft = CaseReopenDraft(
                schemaVersion: currentDraft.schemaVersion,
                caseId: currentDraft.caseId,
                expectedCaseVersion: evidenceReceipt.caseVersion,
                evidenceOperationId: currentDraft.evidenceOperationId,
                reopenOperationId: currentDraft.reopenOperationId,
                sourceType: currentDraft.sourceType,
                evidenceTitle: currentDraft.evidenceTitle,
                evidenceSummary: currentDraft.evidenceSummary,
                observedAt: currentDraft.observedAt,
                evidenceId: evidenceId,
                evidenceVersion: currentDraft.evidenceVersion,
                nextActionTypeWire: currentDraft.nextActionTypeWire,
                nextActionTitle: currentDraft.nextActionTitle,
                nextActionDueOn: currentDraft.nextActionDueOn,
              );
              try {
                await store.save(scopeKey, currentDraft);
              } catch (error) {
                throw V2WorkflowSaveException(
                  '“再次出现”的证据已处理，但恢复信息还没保存完整。请直接重试。',
                  recordMayBeSaved: true,
                  cause: error,
                );
              }
            }

            late final CaseCommandReceipt reopenReceipt;
            try {
              reopenReceipt = await learningRepository.reopenCase(
                ReopenCaseCommand(
                  operationId: currentDraft.reopenOperationId,
                  caseId: currentDraft.caseId,
                  expectedCaseVersion: currentDraft.expectedCaseVersion,
                  recurrenceEvidenceIds: <String>[evidenceId],
                  expectedEvidenceVersions: <String, int>{
                    evidenceId: currentDraft.evidenceVersion,
                  },
                  nextActionType: _caseActionTypeFromWire(
                    currentDraft.nextActionTypeWire,
                  ),
                  nextActionTitle: currentDraft.nextActionTitle,
                  nextActionDueOn: currentDraft.nextActionDueOn,
                ),
              );
            } catch (error) {
              throw V2WorkflowSaveException(
                '重新跟进尚未完整完成。证据和操作编号已经保留，请直接重试。',
                recordMayBeSaved: true,
                cause: error,
              );
            }

            try {
              await store.clear(scopeKey);
            } catch (_) {
              // Keep the committed draft rather than hiding a successful server result.
              // Reusing the same operation id is idempotent and therefore safe.
            }

            return V2WorkflowResult(
              caseId: reopenReceipt.caseId,
              caseVersion: reopenReceipt.caseVersion,
              attachmentCount: 0,
            );
          }

          List<V2CaseTypeChoice> get caseTypeChoices {
          ''',
          )

          replace_once(
              controller,
              '''  String _headline(String body) {
          ''',
              '''  String? _reopenDraftScopeKey(String caseId) {
            final userId = sessionUserId?.trim();
            final organizationId = workspace.organizationId?.trim();
            final normalizedCaseId = caseId.trim();
            if (userId == null ||
                userId.isEmpty ||
                organizationId == null ||
                organizationId.isEmpty ||
                normalizedCaseId.isEmpty) {
              return null;
            }
            return 'user:$userId|organization:$organizationId|case:$normalizedCaseId';
          }

          CaseActionType _caseActionTypeFromWire(String wire) => switch (wire) {
            'reteach' => CaseActionType.reteach,
            'practice' => CaseActionType.practice,
            'verify' => CaseActionType.verify,
            'communicate' => CaseActionType.communicate,
            'review' => CaseActionType.review,
            'other' => CaseActionType.other,
            _ => throw StateError('Unsupported reopen next action type: $wire'),
          };

          String _headline(String body) {
          ''',
          )

          loader = 'lib/features/design_v2/v2_workspace_loader.dart'
          replace_once(
              loader,
              '''                evidenceAttachmentRepository: evidenceAttachmentRepository,
              )
          ''',
              '''                evidenceAttachmentRepository: evidenceAttachmentRepository,
                caseReopenDraftStore: widget.runtime?.caseReopenDraftStore,
                sessionUserId: widget.runtime?.sessionUserId,
              )
          ''',
          )

          preview = 'lib/features/design_v2/v2_workspace_preview.dart'
          replace_once(
              preview,
              "import 'v2_action_composers.dart';\n",
              "import 'v2_action_composers.dart';\nimport 'v2_reopen_composer.dart';\n",
          )
          replace_once(
              preview,
              '''Future<void> _showV2ProgressForCase(
          ''',
              '''Future<void> _showV2ReopenClosedCase(
            BuildContext context,
            V2Student student,
            V2FocusItem item,
          ) async {
            final runtime = _V2RuntimeScope.maybeOf(context);
            final controller = runtime?.workflowController;
            if (controller == null || !controller.canReopenClosedCase(item.id)) {
              return;
            }

            V2ReopenDraftSnapshot? pendingDraft;
            try {
              pendingDraft = await controller.loadPendingReopen(item.id);
            } catch (error) {
              if (!context.mounted) return;
              final message = error is V2WorkflowSaveException
                  ? error.userMessage
                  : '上次未完成的重新跟进暂时无法恢复，请重试。';
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(message)),
              );
              return;
            }
            if (!context.mounted) return;

            final saved = await showV2ReopenCaseComposer(
              context,
              studentName: student.name,
              subject: item.subject,
              caseTitle: item.title,
              businessDate: controller.businessDate,
              pendingDraft: pendingDraft,
              onSave: (draft) => controller.reopenClosedCase(
                V2ReopenWrite(
                  caseId: item.id,
                  recurrenceSummary: draft.recurrenceSummary,
                  nextActionTitle: draft.nextActionTitle,
                  nextActionDueOn: draft.nextActionDueOn,
                ),
              ),
            );
            if (saved && context.mounted) {
              runtime?.onWorkspaceChanged?.call();
            }
          }

          Future<void> _showV2ProgressForCase(
          ''',
          )
          replace_once(
              preview,
              '''    final pendingAction = item.closed
                ? null
                : controller?.pendingActionFor(item.id);
          ''',
              '''    final pendingAction = item.closed
                ? null
                : controller?.pendingActionFor(item.id);
            final canReopen =
                item.closed && (controller?.canReopenClosedCase(item.id) ?? false);
          ''',
          )
          replace_once(
              preview,
              '''                  if (pendingAction != null) ...[
          ''',
              '''                  if (canReopen) ...[
                    const SizedBox(height: 16),
                    FilledButton.tonalIcon(
                      key: ValueKey<String>('v2-reopen-${item.id}'),
                      onPressed: () => _showV2ReopenClosedCase(
                        context,
                        student,
                        item,
                      ),
                      icon: const Icon(Icons.restart_alt, size: 18),
                      label: const Text('再次出现，重新跟进'),
                    ),
                  ],
                  if (pendingAction != null) ...[
          ''',
          )

          test = 'test/features/design_v2_workflow_controller_test.dart'
          replace_once(
              test,
              "import 'package:xueqing/cloud/evidence_attachment_repository.dart';\n",
              "import 'package:xueqing/cloud/case_reopen_draft_store.dart';\nimport 'package:xueqing/cloud/evidence_attachment_repository.dart';\n",
          )

          replace_once(
              test,
              '''    test(
              'case type choices use real active types and one unclassified option',
          ''',
              '''    test('safe reopen writes recurrence evidence before reopening', () async {
              final log = <String>[];
              final learning = _FakeLearningRepository(log: log)
                ..addEvidenceReceipt = const CaseCommandReceipt(
                  operationId: 'evidence-op-receipt',
                  caseId: 'case-existing',
                  eventId: 'event-recurrence',
                  status: 'closed',
                  caseVersion: 4,
                  recordId: 'evidence-recurrence',
                );
              final store = InMemoryCaseReopenDraftStore();
              final controller = V2WorkflowController(
                workspace: _workspaceWithCase(
                  _case(status: LearningCaseStatus.closed),
                ),
                learningRepository: learning,
                progressiveCaseRepository: _FakeProgressiveCaseRepository(),
                caseReopenDraftStore: store,
                sessionUserId: 'user-1',
                now: () => DateTime(2026, 9, 10, 18, 30),
              );

              final result = await controller.reopenClosedCase(
                V2ReopenWrite(
                  caseId: 'case-existing',
                  recurrenceSummary: '今天又出现漏掉结果信息的情况。',
                  nextActionTitle: '周五再检查一次概括题',
                  nextActionDueOn: DateTime(2026, 9, 11),
                ),
              );

              expect(result.caseVersion, 5);
              expect(log, <String>['add-evidence', 'reopen']);
              expect(learning.addEvidenceCalls, hasLength(1));
              final evidence = learning.addEvidenceCalls.single;
              expect(evidence.expectedCaseVersion, 3);
              expect(evidence.sourceType, 'observation');
              expect(evidence.title, '问题再次出现');
              expect(evidence.summary, '今天又出现漏掉结果信息的情况。');
              expect(learning.reopenCalls, hasLength(1));
              final reopen = learning.reopenCalls.single;
              expect(reopen.expectedCaseVersion, 4);
              expect(reopen.recurrenceEvidenceIds, <String>['evidence-recurrence']);
              expect(reopen.expectedEvidenceVersions, <String, int>{
                'evidence-recurrence': 1,
              });
              expect(reopen.nextActionType, CaseActionType.verify);
              expect(reopen.nextActionTitle, '周五再检查一次概括题');
              expect(reopen.nextActionDueOn, DateTime(2026, 9, 11));
              expect(
                await store.load(
                  'user:user-1|organization:org-1|case:case-existing',
                ),
                isNull,
              );
            });

            test(
              'failed reopen resumes same stored evidence and operation id',
              () async {
                final learning = _FakeLearningRepository()
                  ..failFirstReopen = true
                  ..addEvidenceReceipt = const CaseCommandReceipt(
                    operationId: 'evidence-op-receipt',
                    caseId: 'case-existing',
                    eventId: 'event-recurrence',
                    status: 'closed',
                    caseVersion: 4,
                    recordId: 'evidence-recurrence',
                  );
                final store = InMemoryCaseReopenDraftStore();
                final controller = V2WorkflowController(
                  workspace: _workspaceWithCase(
                    _case(status: LearningCaseStatus.closed),
                  ),
                  learningRepository: learning,
                  progressiveCaseRepository: _FakeProgressiveCaseRepository(),
                  caseReopenDraftStore: store,
                  sessionUserId: 'user-1',
                );
                const scope =
                    'user:user-1|organization:org-1|case:case-existing';

                await expectLater(
                  controller.reopenClosedCase(
                    const V2ReopenWrite(
                      caseId: 'case-existing',
                      recurrenceSummary: '第一次保存的复发描述。',
                      nextActionTitle: '第一次保存的下一步',
                    ),
                  ),
                  throwsA(
                    isA<V2WorkflowSaveException>().having(
                      (error) => error.recordMayBeSaved,
                      'recordMayBeSaved',
                      isTrue,
                    ),
                  ),
                );

                final stored = await store.load(scope);
                expect(stored, isNotNull);
                expect(stored!.evidenceId, 'evidence-recurrence');
                final evidenceOperationId =
                    learning.addEvidenceCalls.single.operationId;
                final reopenOperationId = learning.reopenCalls.single.operationId;

                await controller.reopenClosedCase(
                  const V2ReopenWrite(
                    caseId: 'case-existing',
                    recurrenceSummary: '这次重试不应该覆盖原描述。',
                    nextActionTitle: '这次重试也不应该覆盖原下一步',
                  ),
                );

                expect(learning.addEvidenceCalls, hasLength(1));
                expect(learning.reopenCalls, hasLength(2));
                expect(
                  learning.addEvidenceCalls.single.operationId,
                  evidenceOperationId,
                );
                expect(learning.reopenCalls[1].operationId, reopenOperationId);
                expect(learning.reopenCalls[1].nextActionTitle, '第一次保存的下一步');
                expect(await store.load(scope), isNull);
              },
            );

            test(
              'failed recurrence evidence retry reuses the original evidence operation',
              () async {
                final learning = _FakeLearningRepository()
                  ..failFirstAddEvidence = true
                  ..addEvidenceReceipt = const CaseCommandReceipt(
                    operationId: 'evidence-op-receipt',
                    caseId: 'case-existing',
                    eventId: 'event-recurrence',
                    status: 'closed',
                    caseVersion: 4,
                    recordId: 'evidence-recurrence',
                  );
                final store = InMemoryCaseReopenDraftStore();
                final controller = V2WorkflowController(
                  workspace: _workspaceWithCase(
                    _case(status: LearningCaseStatus.closed),
                  ),
                  learningRepository: learning,
                  progressiveCaseRepository: _FakeProgressiveCaseRepository(),
                  caseReopenDraftStore: store,
                  sessionUserId: 'user-1',
                );
                const write = V2ReopenWrite(
                  caseId: 'case-existing',
                  recurrenceSummary: '同一个复发证据必须幂等重试。',
                  nextActionTitle: '继续核验',
                );

                await expectLater(
                  controller.reopenClosedCase(write),
                  throwsA(isA<V2WorkflowSaveException>()),
                );
                final firstOperationId =
                    learning.addEvidenceCalls.single.operationId;
                final pending = await controller.loadPendingReopen(
                  'case-existing',
                );
                expect(pending?.recurrenceSummary, '同一个复发证据必须幂等重试。');

                await controller.reopenClosedCase(write);

                expect(learning.addEvidenceCalls, hasLength(2));
                expect(
                  learning.addEvidenceCalls[1].operationId,
                  firstOperationId,
                );
                expect(learning.reopenCalls, hasLength(1));
              },
            );

            test('reopen stays hidden without resumable identity capability', () {
              final controller = V2WorkflowController(
                workspace: _workspaceWithCase(
                  _case(status: LearningCaseStatus.closed),
                ),
                learningRepository: _FakeLearningRepository(),
                progressiveCaseRepository: _FakeProgressiveCaseRepository(),
              );

              expect(controller.canReopenClosedCase('case-existing'), isFalse);
            });

            test(
              'case type choices use real active types and one unclassified option',
          ''',
          )

          replace_once(
              test,
              '''  final rescheduleActionCalls = <RescheduleCaseActionCommand>[];
          ''',
              '''  final rescheduleActionCalls = <RescheduleCaseActionCommand>[];
            final reopenCalls = <ReopenCaseCommand>[];
            bool failFirstAddEvidence = false;
            bool failFirstReopen = false;
          ''',
          )

          replace_once(
              test,
              '''  Future<CaseCommandReceipt> addCaseEvidence(
            AddCaseEvidenceCommand command,
          ) async {
            addEvidenceCalls.add(command);
            log?.add('add-evidence');
            return addEvidenceReceipt;
          }
          }
          ''',
              '''  Future<CaseCommandReceipt> addCaseEvidence(
            AddCaseEvidenceCommand command,
          ) async {
            addEvidenceCalls.add(command);
            log?.add('add-evidence');
            if (failFirstAddEvidence && addEvidenceCalls.length == 1) {
              throw Exception('network timeout while saving recurrence evidence');
            }
            return addEvidenceReceipt;
          }

            @override
            Future<CaseCommandReceipt> reopenCase(ReopenCaseCommand command) async {
              reopenCalls.add(command);
              log?.add('reopen');
              if (failFirstReopen && reopenCalls.length == 1) {
                throw Exception('network timeout while reopening case');
              }
              return CaseCommandReceipt(
                operationId: command.operationId,
                caseId: command.caseId,
                actionId: 'action-reopened',
                eventId: 'event-reopened',
                status: 'confirmed',
                caseVersion: command.expectedCaseVersion + 1,
              );
            }
          }
          ''',
          )
          PY

      - name: Format
        run: |
          dart format \
            lib/features/design_v2/v2_workflow_controller.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/design_v2/v2_reopen_composer.dart \
            test/features/design_v2_workflow_controller_test.dart \
            test/features/design_v2_reopen_composer_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/features/design_v2_workflow_controller_test.dart
          flutter test test/features/design_v2_reopen_composer_test.dart
          flutter test test/features/design_v2_workspace_data_injection_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Diff check
        run: git diff --check

      - name: Commit validated product change and remove one-off workflow
        shell: bash
        run: |
