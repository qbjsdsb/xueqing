name: Package Windows app

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Optional Supabase URL"
        required: false
        type: string
      supabase_publishable_key:
        description: "Optional Supabase publishable key"
        required: false
        type: string
      app_version:
        description: "Optional app version including build number; defaults to pubspec.yaml"
        required: false
        type: string

permissions:
  contents: read

env:
  XUEQING_ENV: development
  XUEQING_SUPABASE_URL: ${{ github.event.inputs.supabase_url || 'https://czuctoulgnfytcfonkhc.supabase.co' }}
  XUEQING_SUPABASE_PUBLISHABLE_KEY: ${{ github.event.inputs.supabase_publishable_key || 'sb_publishable_yjUy-gjUSSFkCpbK_AjLSA_I0FgOXTI' }}

jobs:
  windows-release:
    name: Windows release bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        run: flutter pub get

      - name: Resolve app version
        shell: pwsh
        run: |
          $appVersion = "${{ github.event.inputs.app_version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            $versionLine = Get-Content pubspec.yaml |
              Where-Object { $_ -match '^version:\s*\S+\s*$' } |
              Select-Object -First 1
            if ($null -eq $versionLine) {
              throw "pubspec.yaml does not contain a version field."
            }
            $appVersion = ($versionLine -replace '^version:\s*', '').Trim()
          }
          if ($appVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?\+[1-9]\d*$') {
            throw "App version must match major.minor.patch[-prerelease]+positive_build."
          }
          $versionName = $appVersion.Split('+')[0]
          "XUEQING_APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XUEQING_VERSION_NAME=$versionName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaging Xueqing $appVersion"

      - name: Build Windows release bundle
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define="XUEQING_ENV=$env:XUEQING_ENV" `
            --dart-define="XUEQING_APP_VERSION=$env:XUEQING_APP_VERSION" `
            --dart-define="XUEQING_SUPABASE_URL=$env:XUEQING_SUPABASE_URL" `
            --dart-define="XUEQING_SUPABASE_PUBLISHABLE_KEY=$env:XUEQING_SUPABASE_PUBLISHABLE_KEY" `
            --dart-define="XUEQING_ALLOW_DEVELOPMENT_RELEASE=true"

      - name: Bundle Visual C++ release runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio locator was not found."
          }

          $vsPath = (& $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual C++ toolset installation was not found."
          }

          $releaseDir = Join-Path $pwd "build/windows/x64/runner/Release"
          $redistRoot = Join-Path $vsPath "VC/Redist/MSVC"
          $runtimeDir = Get-ChildItem -Path $redistRoot -Directory -Recurse `
            | Where-Object {
                $_.Name -eq "Microsoft.VC143.CRT" -and
                (Test-Path (Join-Path $_.FullName "msvcp140.dll")) -and
                (Test-Path (Join-Path $_.FullName "vcruntime140.dll")) -and
                (Test-Path (Join-Path $_.FullName "vcruntime140_1.dll"))
              } `
            | Select-Object -First 1
          if ($null -eq $runtimeDir) {
            throw "The Visual C++ release runtime directory was not found."
          }

          $requiredRuntime = @(
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )
          foreach ($runtimeName in $requiredRuntime) {
            Copy-Item `
              -Path (Join-Path $runtimeDir.FullName $runtimeName) `
              -Destination $releaseDir `
              -Force
          }

          $dumpbin = Get-ChildItem `
            -Path (Join-Path $vsPath "VC/Tools/MSVC") `
            -Filter "dumpbin.exe" `
            -File `
            -Recurse `
            | Select-Object -First 1
          if ($null -eq $dumpbin) {
            throw "dumpbin.exe was not found for dependency verification."
          }

          $exePath = Join-Path $releaseDir "xueqing.exe"
          if (-not (Test-Path $exePath)) {
            throw "The Windows executable was not found."
          }
          $dependencies = (& $dumpbin.FullName /DEPENDENTS $exePath 2>&1) -join "`n"
          if ($dependencies -match "(?i)MSVCP140D\.dll|VCRUNTIME140D\.dll|VCRUNTIME140_1D\.dll|ucrtbased\.dll") {
            throw "Release binary still depends on a Debug Visual C++ runtime."
          }

          foreach ($runtimeName in $requiredRuntime) {
            if (-not (Test-Path (Join-Path $releaseDir $runtimeName))) {
              throw "Missing bundled runtime: $runtimeName"
            }
          }

      - name: Build Windows updater helpers
        shell: pwsh
        working-directory: tools/windows_updater
        run: |
          dart pub get
          dart analyze
          if ($LASTEXITCODE -ne 0) {
            throw "Windows updater analysis failed with exit code $LASTEXITCODE."
          }
          dart test
          if ($LASTEXITCODE -ne 0) {
            throw "Windows updater tests failed with exit code $LASTEXITCODE."
          }
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build/windows/x64/runner/Release"
          $updaterPath = Join-Path $releaseDir "xueqing_updater.exe"
          $bootstrapPath = Join-Path $releaseDir "xueqing_updater_bootstrap.exe"
          dart compile exe bin/xueqing_updater.dart -o $updaterPath
          dart compile exe bin/xueqing_updater.dart -o $bootstrapPath
          foreach ($helperPath in @($updaterPath, $bootstrapPath)) {
            if (-not (Test-Path $helperPath)) {
              throw "Windows updater helper was not produced: $helperPath"
            }
            if ((Get-Item $helperPath).Length -le 0) {
              throw "Windows updater helper is empty: $helperPath"
            }
          }

      - name: Verify Windows bundle
        shell: pwsh
        run: |
          $releaseDir = Join-Path $pwd "build/windows/x64/runner/Release"
          foreach ($requiredFile in @("xueqing.exe", "xueqing_updater.exe", "xueqing_updater_bootstrap.exe")) {
            $requiredPath = Join-Path $releaseDir $requiredFile
            if (-not (Test-Path $requiredPath)) {
              throw "Required Windows release file was not found: $requiredPath"
            }
            if ((Get-Item $requiredPath).Length -le 0) {
              throw "Required Windows release file is empty: $requiredPath"
            }
          }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-windows-release-${{ github.sha }}
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 7

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/tools/windows_installer/build_installer.ps1" `
            -AppVersion "$env:XUEQING_VERSION_NAME"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-windows-installer-${{ github.sha }}
          path: build/windows/installer/xueqing-setup-*.exe
          if-no-files-found: error
          retention-days: 7
