name: Fix export logger once

on:
  push:
    branches:
      - ux/teacher-readable-history

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-readable-history
      - name: Use the existing workspace logger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/teacher_workspace/presentation/teacher_workspace_page.dart')
          text = path.read_text()
          old = 'AppLogger.instance.error('
          if old not in text:
            raise SystemExit('logger anchor missing')
          path.write_text(text.replace(old, '_workspaceLogger.error(', 1))
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/teacher_workspace/presentation/teacher_workspace_page.dart
          git commit -m "fix: use workspace logger for export failures"
          git push origin HEAD:ux/teacher-readable-history
