name: Apply lesson navigation resolver temporary

on:
  push:
    branches:
      - docs/resolve-lesson-navigation-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/resolve-lesson-navigation-contract
          fetch-depth: 0
      - name: Apply contract patch
        run: python3 .github/scripts/resolve_lesson_nav_temp.py
      - name: Commit verified docs and clean helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-lesson-navigation-contract-temp.yml
          git rm .github/workflows/apply-lesson-navigation-contract-retry-temp.yml
          git rm .github/workflows/apply-lesson-navigation-contract-final-temp.yml
          git rm .github/scripts/resolve_lesson_nav_temp.py
          git add README.md docs/RESPONSIBILITY_MODEL.md docs/design/INFORMATION_ARCHITECTURE.md docs/design/SCREEN_SPECS.md docs/product/DUAL_WORKSPACE_UX.md docs/product/ROLE_ACCESS_CONTRACT.md docs/product/LESSON_NAVIGATION_DECISION.md
          git diff --cached --check
          git commit -m 'docs: resolve v0.3.x lesson navigation contract'
          git push origin HEAD:docs/resolve-lesson-navigation-contract
