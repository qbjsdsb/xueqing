name: V0.3.3 cross-platform ergonomics gate

on:
  push:
    branches:
      - polish/v0.3.3-cross-platform-ergonomics
    paths:
      - .github/ui-polish-v033-request

permissions:
  contents: write

concurrency:
  group: v033-cross-platform-ergonomics
  cancel-in-progress: false

jobs:
  linux-android:
    name: Android ergonomics and full Flutter gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout request baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply deterministic ergonomics patch
        run: python3 tools/v033_ui_polish_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format patched files
        run: >-
          dart format
          lib/features/design_v2/v2_workspace_preview.dart
          test/features/design_v2_workspace_data_injection_test.dart
          test/features/v2_final_ergonomics_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run focused workspace ergonomics tests
        run: >-
          flutter test
          test/features/design_v2_workspace_test.dart
          test/features/design_v2_workspace_data_injection_test.dart
          test/features/v2_final_ergonomics_test.dart
          test/features/v2_student_focus_presentation_test.dart

      - name: Run full Flutter suite
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

  windows:
    name: Windows ergonomics and release build gate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout request baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply deterministic ergonomics patch
        run: python tools/v033_ui_polish_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Format patched files
        run: >-
          dart format
          lib/features/design_v2/v2_workspace_preview.dart
          test/features/design_v2_workspace_data_injection_test.dart
          test/features/v2_final_ergonomics_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run focused workspace ergonomics tests
        run: >-
          flutter test
          test/features/design_v2_workspace_test.dart
          test/features/design_v2_workspace_data_injection_test.dart
          test/features/v2_final_ergonomics_test.dart

      - name: Run full Flutter suite
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

  commit-verified-source:
    name: Commit only after both platform gates pass
    needs:
      - linux-android
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout polish branch
        uses: actions/checkout@v4
        with:
          ref: polish/v0.3.3-cross-platform-ergonomics
          fetch-depth: 0

      - name: Refuse a moved request baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test -f .github/ui-polish-v033-request

      - name: Apply deterministic ergonomics patch
        run: python3 tools/v033_ui_polish_patch.py

      - name: Set up Flutter for deterministic formatting
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Format exactly the verified source files
        run: >-
          dart format
          lib/features/design_v2/v2_workspace_preview.dart
          test/features/design_v2_workspace_data_injection_test.dart
          test/features/v2_final_ergonomics_test.dart

      - name: Verify commit boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_workspace_data_injection_test.dart \
            test/features/v2_final_ergonomics_test.dart | sort)"
          [[ "$changed" == "$expected" ]] || {
            echo "Unexpected patch boundary:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Commit verified ergonomics polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_workspace_data_injection_test.dart \
            test/features/v2_final_ergonomics_test.dart
          git commit -m "Polish Android and Windows workspace ergonomics"
          git push origin HEAD:polish/v0.3.3-cross-platform-ergonomics
