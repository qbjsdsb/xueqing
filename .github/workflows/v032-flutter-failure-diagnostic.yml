name: v0.3.2 Flutter failure diagnostic

on:
  push:
    branches:
      - hotfix/v0.3.2-real-device-ux
    paths:
      - ".github/workflows/v032-flutter-failure-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose-full-flutter-suite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run full Flutter suite with captured output
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test-expanded.log

      - name: Upload diagnostic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-flutter-test-expanded-log
          path: flutter-test-expanded.log
          if-no-files-found: error
          retention-days: 1
