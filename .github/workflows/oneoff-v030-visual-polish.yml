name: Validate v0.3 visual polish and app icon

on:
  push:
    branches:
      - release/v0.3.0-visual-polish-icon
    paths:
      - .github/workflows/oneoff-v030-visual-polish.yml
      - tools/oneoff_v030_visual_polish.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v0.3.0-visual-polish-icon
          fetch-depth: 0

      - name: Apply focused visual patch and generate icon assets
        run: python3 tools/oneoff_v030_visual_polish.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/app/theme/app_motion.dart lib/app/theme/app_theme.dart lib/features/design_v2/v2_theme.dart lib/features/design_v2/v2_workspace_preview.dart lib/features/design_v2/v2_workspace_loader.dart test/release_app_icon_contract_test.dart test/features/v2_visual_polish_contract_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused visual and release tests
        run: flutter test test/release_app_icon_contract_test.dart test/features/v2_visual_polish_contract_test.dart test/features/v2_final_ergonomics_test.dart test/features/design_v2_workspace_test.dart test/windows_window_chrome_contract_test.dart test/release_product_identity_contract_test.dart

      - name: Full Flutter test suite
        run: flutter test

      - name: Diff check
        run: git diff --check

      - name: Commit validated visual patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-v030-visual-polish.yml tools/oneoff_v030_visual_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI V2: polish motion, surfaces, and release icon"
          git push origin HEAD:release/v0.3.0-visual-polish-icon
