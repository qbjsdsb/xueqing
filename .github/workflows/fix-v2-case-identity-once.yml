name: Fix V2 case identity once

on:
  push:
    paths:
      - '.github/workflows/fix-v2-case-identity-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-prototype-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Make student and Case identity real inside V2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixture = Path('lib/features/design_v2/v2_fixture.dart')
          ftext = fixture.read_text()
          marker = "List<V2TimelineEntry> v2TimelineForCase(V2FocusItem item) =>"
          helper = """List<V2TimelineEntry> v2TimelineForStudent(V2Student student) {\n  final caseIds = v2FocusItemsForStudent(student).map((item) => item.id).toSet();\n  return v2Timeline\n      .where((entry) => caseIds.contains(entry.caseId))\n      .toList(growable: false);\n}\n\n"""
          assert marker in ftext
          if 'v2TimelineForStudent' not in ftext:
              ftext = ftext.replace(marker, helper + marker, 1)
          fixture.write_text(ftext)

          path = Path('lib/features/design_v2/v2_workspace_preview.dart')
          text = path.read_text()

          def replace_block(source, start_marker, end_marker, replacement):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement.rstrip() + '\n\n' + source[end:]

          text = replace_block(
              text,
              'Future<void> _showV2ProgressCasePicker(',
              'class V2WorkspacePreview',
              r'''Future<void> _showV2ProgressCasePicker(
            BuildContext context,
            V2Student student,
          ) async {
            final items = v2FocusItemsForStudent(student);
            if (items.isEmpty) {
              return;
            }

            Widget choices(BuildContext sheetContext) => ListView.separated(
              shrinkWrap: true,
              itemCount: items.length,
              separatorBuilder: (_, _) => Divider(
                height: 1,
                color: Theme.of(sheetContext).colorScheme.outlineVariant,
              ),
              itemBuilder: (_, index) {
                final item = items[index];
                return ListTile(
                  title: Text(item.title),
                  subtitle: Text(item.subject),
                  trailing: const Icon(Icons.chevron_right),
                  onTap: () => Navigator.of(sheetContext).pop(item),
                );
              },
            );

            final compact = MediaQuery.sizeOf(context).width < 720;
            final selected = compact
                ? await showModalBottomSheet<V2FocusItem>(
                    context: context,
                    useSafeArea: true,
                    builder: (sheetContext) => Padding(
                      padding: const EdgeInsets.fromLTRB(18, 18, 18, 28),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            '选择要记录进展的问题',
                            style: Theme.of(sheetContext).textTheme.titleLarge,
                          ),
                          const SizedBox(height: 12),
                          choices(sheetContext),
                        ],
                      ),
                    ),
                  )
                : await showDialog<V2FocusItem>(
                    context: context,
                    builder: (dialogContext) => AlertDialog(
                      title: const Text('选择要记录进展的问题'),
                      content: SizedBox(width: 420, child: choices(dialogContext)),
                    ),
                  );
            if (selected == null || !context.mounted) {
              return;
            }
            await showV2ProgressComposer(
              context,
              studentName: student.name,
              subject: selected.subject,
              caseTitle: selected.title,
            );
          }''',
          )

          text = replace_block(
              text,
              'class _V2WorkspacePreviewState',
              'class _DesktopWorkspace',
              r'''class _V2WorkspacePreviewState extends State<V2WorkspacePreview> {
            int _destination = 1;
            V2Student _selectedStudent = v2Students.first;
            V2FocusItem _selectedCase = v2FocusItems.first;
            bool _showCase = false;

            void _openStudent(V2Student student) {
              setState(() {
                _selectedStudent = student;
                _showCase = false;
              });
            }

            void _openCase(V2FocusItem item) {
              setState(() {
                _selectedStudent = v2StudentForFocusItem(item);
                _selectedCase = item;
                _showCase = true;
              });
            }

            void _closeCase() => setState(() => _showCase = false);

            void _changeDestination(int value) {
              setState(() {
                _destination = value;
                _showCase = false;
              });
            }

            @override
            Widget build(BuildContext context) {
              return LayoutBuilder(
                builder: (context, constraints) {
                  if (constraints.maxWidth < 720) {
                    return _CompactWorkspace(
                      destination: _destination,
                      selectedStudent: _selectedStudent,
                      selectedCase: _selectedCase,
                      showCase: _showCase,
                      onDestinationChanged: _changeDestination,
                      onStudentSelected: _openStudent,
                      onOpenCase: _openCase,
                      onBackFromCase: _closeCase,
                    );
                  }
                  return _DesktopWorkspace(
                    destination: _destination,
                    selectedStudent: _selectedStudent,
                    selectedCase: _selectedCase,
                    showCase: _showCase,
                    onDestinationChanged: _changeDestination,
                    onStudentSelected: _openStudent,
                    onOpenCase: _openCase,
                    onBackFromCase: _closeCase,
                  );
                },
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _DesktopWorkspace',
              'class _CompactWorkspace',
              r'''class _DesktopWorkspace extends StatelessWidget {
            const _DesktopWorkspace({
              required this.destination,
              required this.selectedStudent,
              required this.selectedCase,
              required this.showCase,
              required this.onDestinationChanged,
              required this.onStudentSelected,
              required this.onOpenCase,
              required this.onBackFromCase,
            });

            final int destination;
            final V2Student selectedStudent;
            final V2FocusItem selectedCase;
            final bool showCase;
            final ValueChanged<int> onDestinationChanged;
            final ValueChanged<V2Student> onStudentSelected;
            final ValueChanged<V2FocusItem> onOpenCase;
            final VoidCallback onBackFromCase;

            @override
            Widget build(BuildContext context) {
              final border = Theme.of(context).colorScheme.outlineVariant;
              return Scaffold(
                body: SafeArea(
                  child: Row(
                    children: [
                      SizedBox(
                        width: 72,
                        child: _NavigationRail(
                          selectedIndex: destination,
                          onSelected: onDestinationChanged,
                        ),
                      ),
                      VerticalDivider(width: 1, color: border),
                      if (destination == 1) ...[
                        SizedBox(
                          width: 336,
                          child: _StudentListPane(
                            selectedStudent: selectedStudent,
                            onSelected: onStudentSelected,
                          ),
                        ),
                        VerticalDivider(width: 1, color: border),
                        Expanded(
                          child: showCase
                              ? _CaseDetailPane(
                                  student: selectedStudent,
                                  item: selectedCase,
                                  onBack: onBackFromCase,
                                )
                              : _StudentDetailPane(
                                  student: selectedStudent,
                                  onOpenCase: onOpenCase,
                                ),
                        ),
                      ] else if (destination == 0) ...[
                        Expanded(child: _TodayPane(onOpenCase: onOpenCase)),
                      ] else if (destination == 3) ...[
                        Expanded(child: _CaseIndexPane(onOpenCase: onOpenCase)),
                      ] else ...[
                        const Expanded(
                          child: _QuietPlaceholder(
                            title: '课程',
                            message: 'V2 第一阶段先确定教师高频工作流。课程入口将在 Shell 稳定后接入。',
                          ),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _CompactWorkspace',
              'class _NavigationRail',
              r'''class _CompactWorkspace extends StatefulWidget {
            const _CompactWorkspace({
              required this.destination,
              required this.selectedStudent,
              required this.selectedCase,
              required this.showCase,
              required this.onDestinationChanged,
              required this.onStudentSelected,
              required this.onOpenCase,
              required this.onBackFromCase,
            });

            final int destination;
            final V2Student selectedStudent;
            final V2FocusItem selectedCase;
            final bool showCase;
            final ValueChanged<int> onDestinationChanged;
            final ValueChanged<V2Student> onStudentSelected;
            final ValueChanged<V2FocusItem> onOpenCase;
            final VoidCallback onBackFromCase;

            @override
            State<_CompactWorkspace> createState() => _CompactWorkspaceState();
          }

          class _CompactWorkspaceState extends State<_CompactWorkspace> {
            bool _studentOpen = false;

            @override
            Widget build(BuildContext context) {
              Widget body;
              if (widget.showCase) {
                body = _CaseDetailPane(
                  student: widget.selectedStudent,
                  item: widget.selectedCase,
                  onBack: widget.onBackFromCase,
                  compact: true,
                );
              } else if (widget.destination == 1 && _studentOpen) {
                body = _StudentDetailPane(
                  student: widget.selectedStudent,
                  onOpenCase: widget.onOpenCase,
                  compact: true,
                  onBack: () => setState(() => _studentOpen = false),
                );
              } else if (widget.destination == 1) {
                body = _StudentListPane(
                  selectedStudent: widget.selectedStudent,
                  compact: true,
                  onSelected: (student) {
                    widget.onStudentSelected(student);
                    setState(() => _studentOpen = true);
                  },
                );
              } else if (widget.destination == 0) {
                body = _TodayPane(onOpenCase: widget.onOpenCase, compact: true);
              } else if (widget.destination == 3) {
                body = _CaseIndexPane(onOpenCase: widget.onOpenCase, compact: true);
              } else {
                body = const _QuietPlaceholder(
                  title: '课程',
                  message: '课程入口将在下一阶段接入 V2。',
                );
              }

              return Scaffold(
                body: SafeArea(child: body),
                bottomNavigationBar: widget.showCase || _studentOpen
                    ? null
                    : NavigationBar(
                        selectedIndex: widget.destination,
                        onDestinationSelected: (value) {
                          setState(() => _studentOpen = false);
                          widget.onDestinationChanged(value);
                        },
                        destinations: const [
                          NavigationDestination(
                            icon: Icon(Icons.today_outlined),
                            selectedIcon: Icon(Icons.today),
                            label: '今日',
                          ),
                          NavigationDestination(
                            icon: Icon(Icons.people_outline),
                            selectedIcon: Icon(Icons.people),
                            label: '学生',
                          ),
                          NavigationDestination(
                            icon: Icon(Icons.menu_book_outlined),
                            selectedIcon: Icon(Icons.menu_book),
                            label: '课程',
                          ),
                          NavigationDestination(
                            icon: Icon(Icons.fact_check_outlined),
                            selectedIcon: Icon(Icons.fact_check),
                            label: '学情',
                          ),
                        ],
                      ),
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _StudentDetailPane',
              'class _StudentHeader',
              r'''class _StudentDetailPane extends StatelessWidget {
            const _StudentDetailPane({
              required this.student,
              required this.onOpenCase,
              this.compact = false,
              this.onBack,
            });

            final V2Student student;
            final ValueChanged<V2FocusItem> onOpenCase;
            final bool compact;
            final VoidCallback? onBack;

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              final focusItems = v2FocusItemsForStudent(student);
              final timelineEntries = v2TimelineForStudent(student);
              return ColoredBox(
                color: scheme.surface,
                child: CustomScrollView(
                  slivers: [
                    SliverToBoxAdapter(
                      child: Center(
                        child: ConstrainedBox(
                          constraints: const BoxConstraints(maxWidth: 900),
                          child: Padding(
                            padding: EdgeInsets.fromLTRB(
                              compact ? 18 : 32,
                              22,
                              compact ? 18 : 32,
                              48,
                            ),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                if (onBack != null) ...[
                                  IconButton(
                                    tooltip: '返回学生列表',
                                    onPressed: onBack,
                                    icon: const Icon(Icons.arrow_back),
                                  ),
                                  const SizedBox(height: 4),
                                ],
                                _StudentHeader(student: student, compact: compact),
                                const SizedBox(height: 30),
                                _SectionTitle(
                                  title: '现在最重要',
                                  count: focusItems.length,
                                ),
                                const SizedBox(height: 8),
                                if (focusItems.isEmpty)
                                  Padding(
                                    padding: const EdgeInsets.symmetric(vertical: 18),
                                    child: Text(
                                      '暂无进行中的问题',
                                      style: Theme.of(context).textTheme.bodyMedium,
                                    ),
                                  )
                                else
                                  for (var i = 0; i < focusItems.length; i++) ...[
                                    _FocusRow(
                                      item: focusItems[i],
                                      onTap: () => onOpenCase(focusItems[i]),
                                    ),
                                    if (i < focusItems.length - 1)
                                      Divider(
                                        height: 1,
                                        color: scheme.outlineVariant,
                                      ),
                                  ],
                                const SizedBox(height: 34),
                                const _SectionTitle(title: '最近成长'),
                                const SizedBox(height: 14),
                                _Timeline(entries: timelineEntries),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _StudentHeader',
              'class _SectionTitle',
              r'''class _StudentHeader extends StatelessWidget {
            const _StudentHeader({required this.student, required this.compact});

            final V2Student student;
            final bool compact;

            @override
            Widget build(BuildContext context) {
              final focusItems = v2FocusItemsForStudent(student);
              final buttons = Wrap(
                spacing: 8,
                runSpacing: 8,
                children: [
                  OutlinedButton.icon(
                    onPressed: () => showV2QuickCapture(
                      context,
                      studentName: student.name,
                      subjects: student.subjects,
                    ),
                    icon: const Icon(Icons.note_add_outlined, size: 18),
                    label: const Text('记录问题'),
                  ),
                  FilledButton.icon(
                    onPressed: focusItems.isEmpty
                        ? null
                        : () => _showV2ProgressCasePicker(context, student),
                    icon: const Icon(Icons.edit_note_outlined, size: 18),
                    label: const Text('记进展'),
                  ),
                  IconButton(
                    onPressed: () {},
                    tooltip: '更多',
                    icon: const Icon(Icons.more_horiz),
                  ),
                ],
              );
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(
                    '学生  /  ${student.name}',
                    style: Theme.of(context).textTheme.bodySmall,
                  ),
                  const SizedBox(height: 18),
                  if (compact) ...[
                    Text(
                      student.name,
                      style: Theme.of(context).textTheme.headlineSmall,
                    ),
                    const SizedBox(height: 5),
                    Text(
                      '${student.grade} · ${student.subjects.join(' / ')}',
                      style: Theme.of(context).textTheme.bodyLarge,
                    ),
                    const SizedBox(height: 5),
                    Text(
                      student.teacherSummary,
                      style: Theme.of(context).textTheme.bodySmall,
                    ),
                    const SizedBox(height: 16),
                    buttons,
                  ] else
                    Row(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(
                                student.name,
                                style: Theme.of(context).textTheme.headlineSmall,
                              ),
                              const SizedBox(height: 5),
                              Text(
                                '${student.grade} · ${student.subjects.join(' / ')}',
                                style: Theme.of(context).textTheme.bodyLarge,
                              ),
                              const SizedBox(height: 5),
                              Text(
                                student.teacherSummary,
                                style: Theme.of(context).textTheme.bodySmall,
                              ),
                            ],
                          ),
                        ),
                        buttons,
                      ],
                    ),
                ],
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _FocusRow',
              'class _Timeline',
              r'''class _FocusRow extends StatelessWidget {
            const _FocusRow({
              required this.item,
              required this.onTap,
              this.studentName,
            });

            final V2FocusItem item;
            final VoidCallback onTap;
            final String? studentName;

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              return InkWell(
                onTap: onTap,
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 16),
                  child: Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        width: 2,
                        height: 58,
                        color: scheme.primary.withValues(alpha: 0.5),
                      ),
                      const SizedBox(width: 16),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              item.title,
                              style: Theme.of(context).textTheme.titleMedium,
                            ),
                            const SizedBox(height: 4),
                            Text(
                              item.summary,
                              style: Theme.of(context).textTheme.bodyMedium,
                            ),
                            const SizedBox(height: 8),
                            Text(
                              '下一步  ${item.nextStep}',
                              style: Theme.of(context).textTheme.bodySmall,
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(width: 16),
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.end,
                        children: [
                          Text(
                            studentName == null
                                ? item.subject
                                : '$studentName · ${item.subject}',
                            style: Theme.of(context).textTheme.bodySmall,
                          ),
                          const SizedBox(height: 17),
                          Text(
                            item.dueLabel,
                            style: Theme.of(context).textTheme.bodySmall,
                          ),
                        ],
                      ),
                      const SizedBox(width: 4),
                      const Icon(Icons.chevron_right, size: 20),
                    ],
                  ),
                ),
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _Timeline extends StatelessWidget',
              'class _TimelineRow',
              r'''class _Timeline extends StatelessWidget {
            const _Timeline({required this.entries});

            final List<V2TimelineEntry> entries;

            @override
            Widget build(BuildContext context) {
              if (entries.isEmpty) {
                return Text(
                  '暂时还没有成长记录',
                  style: Theme.of(context).textTheme.bodyMedium,
                );
              }
              return Column(
                children: [
                  for (var i = 0; i < entries.length; i++)
                    _TimelineRow(
                      entry: entries[i],
                      last: i == entries.length - 1,
                    ),
                ],
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _CaseDetailPane',
              'class _TodayPane',
              r'''class _CaseDetailPane extends StatelessWidget {
            const _CaseDetailPane({
              required this.student,
              required this.item,
              required this.onBack,
              this.compact = false,
            });

            final V2Student student;
            final V2FocusItem item;
            final VoidCallback onBack;
            final bool compact;

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              final timelineEntries = v2TimelineForCase(item);
              return ColoredBox(
                color: scheme.surface,
                child: SingleChildScrollView(
                  child: Center(
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(maxWidth: 860),
                      child: Padding(
                        padding: EdgeInsets.fromLTRB(
                          compact ? 18 : 32,
                          20,
                          compact ? 18 : 32,
                          48,
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            IconButton(
                              tooltip: '返回',
                              onPressed: onBack,
                              icon: const Icon(Icons.arrow_back),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              '${student.name} · ${item.subject}',
                              style: Theme.of(context).textTheme.bodySmall,
                            ),
                            const SizedBox(height: 12),
                            Row(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Expanded(
                                  child: Text(
                                    item.title,
                                    style: Theme.of(context).textTheme.headlineSmall,
                                  ),
                                ),
                                const SizedBox(width: 16),
                                FilledButton.icon(
                                  onPressed: () => showV2ProgressComposer(
                                    context,
                                    studentName: student.name,
                                    subject: item.subject,
                                    caseTitle: item.title,
                                  ),
                                  icon: const Icon(
                                    Icons.edit_note_outlined,
                                    size: 18,
                                  ),
                                  label: const Text('记进展'),
                                ),
                              ],
                            ),
                            const SizedBox(height: 8),
                            Text(
                              item.summary,
                              style: Theme.of(context).textTheme.bodyLarge,
                            ),
                            const SizedBox(height: 28),
                            Text(
                              '下一步',
                              style: Theme.of(context).textTheme.titleMedium,
                            ),
                            const SizedBox(height: 6),
                            Row(
                              children: [
                                Icon(
                                  Icons.arrow_forward,
                                  size: 17,
                                  color: scheme.primary,
                                ),
                                const SizedBox(width: 8),
                                Expanded(
                                  child: Text(
                                    item.nextStep,
                                    style: Theme.of(context).textTheme.bodyMedium,
                                  ),
                                ),
                                Text(
                                  item.dueLabel,
                                  style: Theme.of(context).textTheme.bodySmall,
                                ),
                              ],
                            ),
                            const SizedBox(height: 30),
                            Divider(color: scheme.outlineVariant),
                            const SizedBox(height: 28),
                            const _SectionTitle(title: '成长过程'),
                            const SizedBox(height: 16),
                            _Timeline(entries: timelineEntries),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _TodayPane',
              'class _TodayAction',
              r'''class _TodayPane extends StatelessWidget {
            const _TodayPane({required this.onOpenCase, this.compact = false});

            final ValueChanged<V2FocusItem> onOpenCase;
            final bool compact;

            @override
            Widget build(BuildContext context) {
              return SingleChildScrollView(
                padding: EdgeInsets.all(compact ? 18 : 32),
                child: Center(
                  child: ConstrainedBox(
                    constraints: const BoxConstraints(maxWidth: 900),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('今日', style: Theme.of(context).textTheme.headlineSmall),
                        const SizedBox(height: 5),
                        Text(
                          '9 月 9 日 · 周三',
                          style: Theme.of(context).textTheme.bodySmall,
                        ),
                        const SizedBox(height: 28),
                        const _SectionTitle(title: '需要处理'),
                        const SizedBox(height: 8),
                        for (final item in v2FocusItems.take(4))
                          _TodayAction(item: item, onOpenCase: onOpenCase),
                        const SizedBox(height: 28),
                        const _SectionTitle(title: '待验证'),
                        const SizedBox(height: 10),
                        _TodayAction(
                          item: v2FocusItems[4],
                          onOpenCase: onOpenCase,
                          verification: true,
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _TodayAction',
              'class _CaseIndexPane',
              r'''class _TodayAction extends StatelessWidget {
            const _TodayAction({
              required this.item,
              required this.onOpenCase,
              this.verification = false,
            });

            final V2FocusItem item;
            final ValueChanged<V2FocusItem> onOpenCase;
            final bool verification;

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              final student = v2StudentForFocusItem(item);
              return InkWell(
                onTap: () => onOpenCase(item),
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 15),
                  child: Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        width: 2,
                        height: 56,
                        color: verification
                            ? scheme.primary
                            : const Color(0xFFB77728),
                      ),
                      const SizedBox(width: 15),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              '${student.name} · ${item.subject}',
                              style: Theme.of(context).textTheme.titleMedium,
                            ),
                            const SizedBox(height: 3),
                            Text(
                              item.title,
                              style: Theme.of(context).textTheme.bodyMedium,
                            ),
                            const SizedBox(height: 4),
                            Text(
                              verification
                                  ? '等待确认是否已经稳定'
                                  : '下一步 · ${item.nextStep}',
                              style: Theme.of(context).textTheme.bodySmall,
                            ),
                          ],
                        ),
                      ),
                      Text(
                        verification ? '待验证' : item.dueLabel,
                        style: Theme.of(context).textTheme.bodySmall,
                      ),
                      const SizedBox(width: 4),
                      const Icon(Icons.chevron_right, size: 20),
                    ],
                  ),
                ),
              );
            }
          }''',
          )

          text = replace_block(
              text,
              'class _CaseIndexPane',
              'class _QuietPlaceholder',
              r'''class _CaseIndexPane extends StatelessWidget {
