name: One-shot optional closure details

on:
  push:
    branches:
      - ux/optional-closure-details
    paths:
      - .github/workflows/one-shot-optional-closure-details.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/optional-closure-details
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Make closure details optional in the UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              if text.count(start) != 1 or text.count(end) < 1:
                  raise SystemExit(f'{label}: markers not unique/present')
              start_i = text.index(start)
              end_i = text.index(end, start_i)
              return text[:start_i] + replacement + text[end_i:]

          forms_path = Path('lib/features/teacher_workspace/presentation/progressive_case_forms.dart')
          forms = forms_path.read_text(encoding='utf-8')
          forms = replace_once(forms, '  bool _showNextStepOptions = false;\n  RecordCaseProgressCommand? _submittedCommand;', '  bool _showNextStepOptions = false;\n  bool _showClosureDetails = false;\n  RecordCaseProgressCommand? _submittedCommand;', 'progress closure detail state')
          forms = replace_once(forms, '  bool _submissionAttempted = false;\n\n  @override\n  void initState() {\n    super.initState();\n    _operationId = createOperationId();\n    _noteController = TextEditingController();', '  bool _submissionAttempted = false;\n  bool _showClosureDetails = false;\n\n  @override\n  void initState() {\n    super.initState();\n    _operationId = createOperationId();\n    _noteController = TextEditingController();', 'direct closure detail state')
          progress_block = base64.b64decode('').decode('utf-8')
          progress_start = '                  if (_nextStep == CaseProgressNextStep.close) ...[\n'
          progress_end = '                  if (_saveError != null) ...[\n'
          forms = replace_between(forms, progress_start, progress_end, progress_block, 'progress close details')

          direct_marker = 'class _EndCaseFollowUpFormState extends State<EndCaseFollowUpForm> {'
          head, tail = forms.split(direct_marker, 1)
          direct_block = base64.b64decode('').decode('utf-8')
          direct_start = "                  const SizedBox(height: AppSpacing.md),\n                  DropdownButtonFormField<CaseClosureReason>(\n                    key: const Key('end-follow-up-reason'),"
          direct_end = '                  if (_saveError != null) ...[\n'
          tail = replace_between(tail, direct_start, direct_end, direct_block, 'direct close details')
          forms = head + direct_marker + tail
          forms_path.write_text(forms, encoding='utf-8')

          test_path = Path('test/features/progressive_case_forms_test.dart')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(test, "      expect(find.byKey(const Key('progress-close-reason')), findsOneWidget);", "      expect(find.byKey(const Key('progress-close-reason')), findsNothing);\n      expect(\n        find.byKey(const Key('progress-close-details-toggle')),\n        findsOneWidget,\n      );", 'progress default close details test')
          test = replace_once(test, "    expect(find.text('结束当前跟进'), findsOneWidget);\n    await tester.tap(find.byKey(const Key('end-follow-up-save')));", "    expect(find.byKey(const Key('end-follow-up-details-toggle')), findsOneWidget);\n    expect(find.byKey(const Key('end-follow-up-reason')), findsNothing);\n    expect(find.byKey(const Key('end-follow-up-note')), findsNothing);\n    await tester.tap(find.byKey(const Key('end-follow-up-save')));", 'direct default close details test')
          test = replace_once(test, "    final reasonField = find.byKey(const Key('end-follow-up-reason'));\n    await _tapVisible(tester, reasonField);", "    await _tapVisible(\n      tester,\n      find.byKey(const Key('end-follow-up-details-toggle')),\n    );\n    await tester.pumpAndSettle();\n    final reasonField = find.byKey(const Key('end-follow-up-reason'));\n    await _tapVisible(tester, reasonField);", 'direct explicit closure detail expansion')
          marker = "  testWidgets('a new case can end follow-up directly', (tester) async {\n"
          if test.count(marker) != 1:
              raise SystemExit(f'progress explicit closure test marker: expected one match, got {test.count(marker)}')
          addition = base64.b64decode('').decode('utf-8')
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Format and run focused tests
        run: |
          dart format lib/features/teacher_workspace/presentation/progressive_case_forms.dart test/features/progressive_case_forms_test.dart
          flutter test test/features/progressive_case_forms_test.dart
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-optional-closure-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: hide closure details until requested"
          git push origin HEAD:ux/optional-closure-details
