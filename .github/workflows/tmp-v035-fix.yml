name: Temporary v0.3.5 finalizer

on:
  push:
    branches:
      - fix/v0.3.5-record-dedup-backend-compat

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.5-record-dedup-backend-compat
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Persist production backend compatibility gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish-release-assets.yml')
          text = path.read_text()
          if 'xueqing_backend_compatibility' in text:
              raise SystemExit('compatibility gate already present unexpectedly')

          anchor = '''          if [[ -z "$XUEQING_SUPABASE_URL" || -z "$XUEQING_SUPABASE_PUBLISHABLE_KEY" || -z "$XUEQING_SUPABASE_ALLOWED_HOSTS" ]]; then
            echo "Stable production releases require Supabase URL, publishable key, and allowed hosts."
            exit 1
          fi
'''
          gate = anchor + '''          backend_json="$(curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \\
            -X POST "${XUEQING_SUPABASE_URL%/}/rest/v1/rpc/xueqing_backend_compatibility" \\
            -H "apikey: $XUEQING_SUPABASE_PUBLISHABLE_KEY" \\
            -H "Content-Type: application/json" \\
            -d '{}')"
          BACKEND_JSON="$backend_json" python3 - <<'PY_BACKEND'
          import json
          import os

          required_schema = "20260911153000"
          payload = json.loads(os.environ["BACKEND_JSON"])
          actual_schema = str(payload.get("schema_version", ""))
          capabilities = payload.get("capabilities") or {}
          if actual_schema < required_schema:
              raise SystemExit(
                  f"Production backend is older than this client requires: {actual_schema!r} < {required_schema}."
              )
          required_capabilities = (
              "student_profile_edit",
              "learning_record_export_attachments",
          )
          missing = [
              name for name in required_capabilities
              if capabilities.get(name) is not True
          ]
          if missing:
              raise SystemExit(
                  "Production backend is missing required capabilities: "
                  + ", ".join(missing)
              )
          print(f"production backend schema {actual_schema} is compatible")
          PY_BACKEND
'''
          if text.count(anchor) != 1:
              raise SystemExit('stable publisher compatibility insertion anchor not unique')
          path.write_text(text.replace(anchor, gate, 1))
          PY

      - name: Validate release contract
        run: |
          flutter pub get
          flutter test test/update/stable_release_workflow_contract_test.dart

      - name: Commit final clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-release-assets.yml
          git rm .github/workflows/tmp-v035-fix.yml
          git commit -m "ci: gate stable releases on production backend compatibility"
          git push origin HEAD:fix/v0.3.5-record-dedup-backend-compat
