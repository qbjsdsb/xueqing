name: Temporary v0.3.5 patch runner

on:
  push:
    branches:
      - fix/v0.3.5-record-dedup-backend-compat

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.5-record-dedup-backend-compat
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Apply focused patch
        shell: bash
        run: |
          sed -i "s/error.code.trim().toUpperCase()/error.code?.trim().toUpperCase() ?? ''/" tool/tmp_v035_patch.py
          python3 tool/tmp_v035_patch.py

      - name: Format
        run: |
          dart format \
            lib/features/design_v2/v2_read_model_adapter.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/export/learning_record_export.dart \
            lib/cloud/organization_management_repository.dart \
            lib/features/organization_management/presentation/organization_student_edit_dialog.dart \
            test/features/design_v2_read_model_adapter_test.dart \
            test/export/student_learning_record_export_test.dart \
            test/cloud/organization_management_repository_test.dart \
            test/update/stable_release_workflow_contract_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused regression tests
        run: |
          flutter test \
            test/features/design_v2_read_model_adapter_test.dart \
            test/export/student_learning_record_export_test.dart \
            test/cloud/organization_management_repository_test.dart \
            test/update/stable_release_workflow_contract_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tool/tmp_v035_patch.py
          git checkout -- .github/workflows/publish-release-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib \
            supabase/migrations/20260911153000_backend_compatibility_contract.sql \
            test
          git commit -m "fix: dedupe learning records and add backend contract"
          git push origin HEAD:fix/v0.3.5-record-dedup-backend-compat
