name: Temporary v0.3.5 finalizer

on:
  push:
    branches:
      - fix/v0.3.5-record-dedup-backend-compat

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.5-record-dedup-backend-compat
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Persist production backend compatibility gate
        run: python3 tool/tmp_finalize_v035.py

      - name: Validate release contract
        run: |
          flutter pub get
          flutter test test/update/stable_release_workflow_contract_test.dart

      - name: Commit final clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-release-assets.yml
          git rm .github/workflows/tmp-v035-fix.yml tool/tmp_finalize_v035.py
          git commit -m "ci: gate stable releases on production backend compatibility"
          git push origin HEAD:fix/v0.3.5-record-dedup-backend-compat
