name: Finish V2 search with small patch once

on:
  push:
    paths:
      - '.github/workflows/finish-v2-search-small-patch-once.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-prototype-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply the already-reviewed search patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/make-v2-search-real-once.yml').read_text().splitlines()
          capture = False
          lines = []
          for line in workflow:
              if "python3 - <<'PY'" in line:
                  capture = True
                  continue
              if capture and line.strip() == 'PY':
                  break
              if capture:
                  lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines)
          old_insert = "marker = '\\n          }\\n'\npos = t.rfind(marker)\nassert pos >= 0\nt = t[:pos] + insertion + t[pos:]\ntest.write_text(t)"
          new_insert = "pos = t.rfind('\\n}')\nassert pos >= 0\nt = t[:pos] + insertion + t[pos:]\ntest.write_text(t)"
          assert old_insert in script
          exec(script.replace(old_insert, new_insert), {'__name__': '__main__'})
          PY
      - name: Fix exact cross-entry Case navigation and test scope
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/design_v2/v2_workspace_preview.dart')
          text = path.read_text()
          needle = "      _selectedStudent = v2StudentForFocusItem(item);\n      _selectedCase = item;"
          replacement = "      _destination = 1;\n      _selectedStudent = v2StudentForFocusItem(item);\n      _selectedCase = item;"
          assert text.count(needle) == 1
          path.write_text(text.replace(needle, replacement, 1))

          test = Path('test/features/design_v2_workspace_test.dart')
          t = test.read_text()
          wrong_scope = "    expect(find.text('林同学'), findsNothing);"
          right_scope = """    expect(\n      find.descendant(\n        of: find.byType(ListView),\n        matching: find.text('林同学'),\n      ),\n      findsNothing,\n    );"""
          assert t.count(wrong_scope) == 1
          t = t.replace(wrong_scope, right_scope, 1)

          extra = r'''

            testWidgets('Today deep link really enters Case detail', (tester) async {
              await tester.binding.setSurfaceSize(const Size(1440, 900));
              addTearDown(() => tester.binding.setSurfaceSize(null));

              await tester.pumpWidget(app());
              await tester.pumpAndSettle();

              await tester.tap(find.byTooltip('今日'));
              await tester.pumpAndSettle();
              await tester.tap(find.text('王同学 · 英语'));
              await tester.pumpAndSettle();

              expect(find.text('成长过程'), findsOneWidget);
              expect(find.text('用一篇完形再检查'), findsOneWidget);
              expect(find.textContaining('语篇中仍会被最近一个时间状语干扰'), findsOneWidget);
            });
          '''
          pos = t.rfind('\n}')
          assert pos >= 0
          t = t[:pos] + extra + t[pos:]
          test.write_text(t)
          PY
      - name: Format analyze and test all V2 behavior
        run: |
          dart format \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_workspace_test.dart
          flutter analyze \
            lib/main_v2.dart \
            lib/features/design_v2/v2_theme.dart \
            lib/features/design_v2/v2_fixture.dart \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart
          flutter test \
            test/features/design_v2_workspace_test.dart \
            test/features/design_v2_composers_test.dart
      - name: Commit validated product changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_workspace_test.dart
          git commit -m 'ui(v2): make search and cross-entry Case navigation real'
          git push origin HEAD:ui/v2-prototype-foundation
