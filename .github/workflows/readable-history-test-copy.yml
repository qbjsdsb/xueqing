name: One-shot readable history test copy update

on:
  push:
    branches:
      - ux/teacher-readable-history
    paths:
      - .github/workflows/readable-history-test-copy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/teacher-readable-history
      - name: Update teacher workspace copy expectations
        shell: python
        run: |
          from pathlib import Path
          path = Path('test/features/teacher_workspace_test.dart')
          text = path.read_text(encoding='utf-8')
          replacements = {
            "尚未记录教学动作。": "尚未记录教学处理。",
            "收起历史": "收起记录",
            "展开历史": "查看更早记录",
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing test copy anchor: {old}')
            text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - run: dart format test/features/teacher_workspace_test.dart
      - name: Commit and push
        run: |
          git config user.name 'xueqing-bot'
          git config user.email 'xueqing-bot@users.noreply.github.com'
          git add test/features/teacher_workspace_test.dart
          git commit -m 'test: align workspace assertions with readable copy'
          git push origin HEAD:ux/teacher-readable-history
