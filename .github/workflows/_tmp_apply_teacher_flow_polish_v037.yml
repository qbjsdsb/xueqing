name: Temporary apply v0.3.7 teacher flow polish

on:
  push:
    branches:
      - ux/teacher-flow-polish-v037

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: ux/teacher-flow-polish-v037
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 tool/_tmp_apply_teacher_flow_polish_v037.py

      - name: Align existing UI contracts with Today-first flow
        run: python3 tool/_tmp_patch_v037_tests.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format touched Dart and test files
        run: |
          dart format \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_fixture.dart \
            lib/features/design_v2/v2_read_model_adapter.dart \
            lib/features/design_v2/v2_workspace_data.dart \
            test/features/v037_teacher_flow_polish_test.dart \
            test/features/design_v2_workspace_test.dart \
            test/features/v2_student_focus_presentation_test.dart \
            test/features/design_v2_workspace_data_injection_test.dart \
            test/features/v2_final_ergonomics_test.dart \
            test/features/design_v2_workspace_loader_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run focused regression tests
        run: |
          flutter test \
            test/features/v037_teacher_flow_polish_test.dart \
            test/features/design_v2_workspace_test.dart \
            test/features/v2_student_focus_presentation_test.dart \
            test/features/design_v2_workspace_data_injection_test.dart \
            test/features/v2_final_ergonomics_test.dart \
            test/features/design_v2_workspace_loader_test.dart

      - name: Run full Flutter suite
        run: flutter test

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qbjsdsb'
          git config user.email '3342513714@qq.com'
          git rm \
            .github/workflows/_tmp_apply_teacher_flow_polish_v037.yml \
            tool/_tmp_apply_teacher_flow_polish_v037.py \
            tool/_tmp_patch_v037_tests.py
          git add \
            lib/features/design_v2/v2_workspace_preview.dart \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_fixture.dart \
            lib/features/design_v2/v2_read_model_adapter.dart \
            lib/features/design_v2/v2_workspace_data.dart \
            test/features/v037_teacher_flow_polish_test.dart \
            test/features/design_v2_workspace_test.dart \
            test/features/v2_student_focus_presentation_test.dart \
            test/features/design_v2_workspace_data_injection_test.dart \
            test/features/v2_final_ergonomics_test.dart \
            test/features/design_v2_workspace_loader_test.dart
          git commit -m 'UX: polish teacher flow and student history clarity'
          git push origin HEAD:ux/teacher-flow-polish-v037
