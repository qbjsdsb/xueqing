name: Temporary final teacher flow polish

on:
  push:
    branches:
      - ux/final-teacher-flow-polish-v037

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: ux/final-teacher-flow-polish-v037
          fetch-depth: 0

      - name: Apply focused polish
        run: python3 tool/_tmp_apply_final_teacher_flow_polish_v037.py

      - name: Prepare diagnostic fixture
        run: python3 tool/_tmp_diagnose_final_polish.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format touched Dart files
        run: |
          dart format \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/v037_final_teacher_flow_resilience_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run narrow diagnostic test
        run: flutter test test/features/v037_final_teacher_flow_resilience_test.dart
