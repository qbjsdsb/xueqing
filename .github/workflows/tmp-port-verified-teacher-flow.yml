name: Temporary port verified teacher flow polish
on:
  push:
    branches:
      - ux/teacher-flow-chinese-first
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v6
        with:
          ref: ux/teacher-flow-chinese-first
          fetch-depth: 0
      - name: Port previously verified product files
        run: |
          git fetch origin 95b73d2fbc5a7ba84bb71575557684a863d54bb8
          git checkout 95b73d2fbc5a7ba84bb71575557684a863d54bb8 -- \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            test/features/teacher_workspace_test.dart
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Teacher workspace tests
        run: flutter test test/features/teacher_workspace_test.dart
      - name: Check product diff
        run: git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-port-verified-teacher-flow.yml
      - name: Commit clean product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ux: make teacher workflow clearer and Chinese-first'
          git push origin HEAD:ux/teacher-flow-chinese-first
