name: v0.3.4 Today semantic cleanup

on:
  push:
    branches:
      - ux/v0.3.4-today-semantic-cleanup
    paths:
      - .github/workflows/v034-today-semantic-cleanup.yml
      - tool/v034_today_cleanup.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v0.3.4-today-semantic-cleanup
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply bounded Today cleanup
        run: python3 tool/v034_today_cleanup.py

      - name: Format
        run: dart format lib/features/design_v2/v2_fixture.dart lib/features/design_v2/v2_read_model_adapter.dart lib/features/design_v2/v2_action_composers.dart lib/features/design_v2/v2_workspace_preview.dart test/features/design_v2_workspace_data_injection_test.dart test/features/v2_final_ergonomics_test.dart test/features/v2_action_composers_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: flutter test test/features/design_v2_workspace_data_injection_test.dart test/features/v2_final_ergonomics_test.dart test/features/v2_action_composers_test.dart test/features/design_v2_read_model_adapter_test.dart test/features/design_v2_workflow_controller_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit implementation and remove one-shot runner
        shell: bash
        run: |
          rm .github/workflows/v034-today-semantic-cleanup.yml
          rm tool/v034_today_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "UX: make Today action-driven and teacher-readable"
          git push origin HEAD:ux/v0.3.4-today-semantic-cleanup
