name: v0.3.4 Today semantic cleanup

on:
  push:
    branches:
      - ux/v0.3.4-today-semantic-cleanup
    paths:
      - .github/workflows/v034-today-semantic-cleanup.yml

permissions:
  contents: write

jobs:
  diagnose-full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v0.3.4-today-semantic-cleanup
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply known analyzer fixes
        shell: bash
        run: |
          sed -i 's/<PickedEvidenceAttachment>//g' lib/features/design_v2/v2_workspace_preview.dart
          sed -i 's/lastActivityAt!/lastActivityAt/g' lib/features/design_v2/v2_read_model_adapter.dart
          dart format lib/features/design_v2/v2_workspace_preview.dart lib/features/design_v2/v2_read_model_adapter.dart
      - run: flutter pub get
      - name: Capture full-test output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee v034-full-test.txt
      - name: Persist diagnostics
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v034-full-test.txt
          git commit -m "chore: capture v0.3.4 full-test diagnostics"
          git push origin HEAD:ux/v0.3.4-today-semantic-cleanup
      - name: Fail on test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
