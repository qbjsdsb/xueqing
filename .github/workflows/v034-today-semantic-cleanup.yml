name: v0.3.4 Today semantic cleanup

on:
  push:
    branches:
      - ux/v0.3.4-today-semantic-cleanup

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'Bootstrap v0.3.4 Today semantic cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v0.3.4-today-semantic-cleanup
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply bounded Today cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              text = read(path)
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{path}: start marker not found: {start}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'{path}: end marker not found: {end}')
              write(path, text[:a] + replacement + text[b:])

          # V2 student presentation data: structured recent-activity signal only.
          replace_once(
              'lib/features/design_v2/v2_fixture.dart',
              "    required this.teacherSummary,\n  });",
              "    required this.teacherSummary,\n    this.lastActivityAt,\n  });",
          )
          replace_once(
              'lib/features/design_v2/v2_fixture.dart',
              "  final String teacherSummary;\n}",
              "  final String teacherSummary;\n  final DateTime? lastActivityAt;\n}",
          )

          # Derive recent student activity without changing Supabase/schema.
          replace_once(
              'lib/features/design_v2/v2_read_model_adapter.dart',
              "      var openCaseCount = 0;\n      var hasLearningHistory = false;",
              "      var openCaseCount = 0;\n      var hasLearningHistory = false;\n      DateTime? lastActivityAt;",
          )
          replace_once(
              'lib/features/design_v2/v2_read_model_adapter.dart',
              "        if (profile.cases.isNotEmpty || profile.recentFacts.isNotEmpty) {\n          hasLearningHistory = true;\n        }\n        openCaseCount += profile.cases.where(_isActiveCase).length;",
              "        if (profile.cases.isNotEmpty || profile.recentFacts.isNotEmpty) {\n          hasLearningHistory = true;\n        }\n        for (final fact in profile.recentFacts) {\n          if (lastActivityAt == null || fact.occurredAt.isAfter(lastActivityAt!)) {\n            lastActivityAt = fact.occurredAt;\n          }\n        }\n        for (final learningCase in profile.cases) {\n          if (lastActivityAt == null ||\n              learningCase.firstObservedAt.isAfter(lastActivityAt!)) {\n            lastActivityAt = learningCase.firstObservedAt;\n          }\n          for (final event in learningCase.timeline) {\n            if (lastActivityAt == null || event.occurredAt.isAfter(lastActivityAt!)) {\n              lastActivityAt = event.occurredAt;\n            }\n          }\n        }\n        openCaseCount += profile.cases.where(_isActiveCase).length;",
          )
          replace_once(
              'lib/features/design_v2/v2_read_model_adapter.dart',
              "          updatedLabel: hasLearningHistory ? '已有更新' : '暂无记录',\n          teacherSummary: '',",
              "          updatedLabel: hasLearningHistory ? '已有更新' : '暂无记录',\n          teacherSummary: '',\n          lastActivityAt: lastActivityAt,",
          )

          # Turn the existing complete-action composer into the lightweight Today processing path.
          replace_once(
              'lib/features/design_v2/v2_action_composers.dart',
              "typedef V2CompleteActionSave = Future<void> Function();\ntypedef V2RescheduleActionSave = Future<void> Function(DateTime? dueOn);",
              "typedef V2CompleteActionSave = Future<void> Function();\ntypedef V2CompleteActionProgressSave = Future<void> Function(String summary);\ntypedef V2RescheduleActionSave = Future<void> Function(DateTime? dueOn);",
          )
          replace_once(
              'lib/features/design_v2/v2_action_composers.dart',
              "Future<bool> showV2CompleteActionComposer(\n  BuildContext context, {\n  required String actionTitle,\n  required V2CompleteActionSave onSave,\n}) async {\n  return await _showActionComposer<bool>(\n        context,\n        child: V2CompleteActionComposer(\n          actionTitle: actionTitle,\n          onSave: onSave,\n        ),\n      ) ??\n      false;\n}",
              "Future<bool> showV2CompleteActionComposer(\n  BuildContext context, {\n  required String actionTitle,\n  required V2CompleteActionSave onSave,\n  String? studentName,\n  String? subject,\n  String? caseTitle,\n  V2CompleteActionProgressSave? onSaveProgress,\n}) async {\n  return await _showActionComposer<bool>(\n        context,\n        child: V2CompleteActionComposer(\n          actionTitle: actionTitle,\n          onSave: onSave,\n          studentName: studentName,\n          subject: subject,\n          caseTitle: caseTitle,\n          onSaveProgress: onSaveProgress,\n        ),\n      ) ??\n      false;\n}",
          )

          process_composer = r'''class V2CompleteActionComposer extends StatefulWidget {
            const V2CompleteActionComposer({
              required this.actionTitle,
              required this.onSave,
              this.studentName,
              this.subject,
              this.caseTitle,
              this.onSaveProgress,
              super.key,
            });

            final String actionTitle;
            final V2CompleteActionSave onSave;
            final String? studentName;
            final String? subject;
            final String? caseTitle;
            final V2CompleteActionProgressSave? onSaveProgress;

            @override
            State<V2CompleteActionComposer> createState() =>
                _V2CompleteActionComposerState();
          }

          class _V2CompleteActionComposerState extends State<V2CompleteActionComposer> {
            final _progressController = TextEditingController();
            bool _saving = false;
            bool _attempted = false;
            String? _error;

            bool get _hasProgress => _progressController.text.trim().isNotEmpty;

            @override
            void dispose() {
              _progressController.dispose();
              super.dispose();
            }

            Future<void> _save() async {
              if (_saving) return;
              setState(() {
                _saving = true;
                _attempted = true;
                _error = null;
              });
              try {
                final summary = _progressController.text.trim();
                final saveProgress = widget.onSaveProgress;
                if (summary.isNotEmpty && saveProgress != null) {
                  await saveProgress(summary);
                } else {
                  await widget.onSave();
                }
                if (mounted) Navigator.of(context).pop(true);
              } catch (error) {
                if (!mounted) return;
                setState(() {
                  _saving = false;
                  _error = _describeActionSaveError(error);
                });
              }
            }

            Future<void> _close() async {
              if (_saving) return;
              if (!_attempted && _hasProgress) {
                final discard = await showDialog<bool>(
                  context: context,
                  builder: (context) => AlertDialog(
                    title: const Text('放弃这次处理？'),
                    content: const Text('刚才填写的新情况还没有保存。'),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.of(context).pop(false),
                        child: const Text('继续编辑'),
                      ),
                      FilledButton(
                        onPressed: () => Navigator.of(context).pop(true),
                        child: const Text('放弃'),
                      ),
                    ],
                  ),
                );
                if (!mounted || discard != true) return;
                Navigator.of(context).pop(false);
                return;
              }
              if (!_attempted) {
                Navigator.of(context).pop(false);
                return;
              }
              final retry = await showDialog<bool>(
                context: context,
                builder: (context) => AlertDialog(
                  title: const Text('刚才是否保存成功还不能确认'),
                  content: const Text('建议直接重新保存；系统会沿用这次操作，不会重复完成这一步。'),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.of(context).pop(false),
                      child: const Text('继续查看'),
                    ),
                    FilledButton(
                      onPressed: () => Navigator.of(context).pop(true),
                      child: const Text('重新保存'),
                    ),
                  ],
                ),
              );
              if (mounted && retry == true) await _save();
            }

            @override
            Widget build(BuildContext context) {
              final contextParts = <String>[
                if (widget.studentName?.trim().isNotEmpty == true) widget.studentName!.trim(),
                if (widget.subject?.trim().isNotEmpty == true) widget.subject!.trim(),
              ];
              return PopScope<void>(
                canPop: !_saving && !_attempted && !_hasProgress,
                onPopInvokedWithResult: (didPop, _) {
                  if (!didPop && !_saving) _close();
                },
                child: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('处理提醒', style: Theme.of(context).textTheme.titleLarge),
                      const SizedBox(height: 12),
                      Text(
                        widget.actionTitle,
                        style: Theme.of(context).textTheme.titleMedium,
                      ),
                      if (contextParts.isNotEmpty) ...[
                        const SizedBox(height: 5),
                        Text(
                          contextParts.join(' · '),
                          style: Theme.of(context).textTheme.bodySmall,
                        ),
                      ],
                      if (widget.caseTitle?.trim().isNotEmpty == true) ...[
                        const SizedBox(height: 4),
                        Text(
                          widget.caseTitle!.trim(),
                          style: Theme.of(context).textTheme.bodySmall,
                        ),
                      ],
                      if (widget.onSaveProgress != null) ...[
                        const SizedBox(height: 18),
                        TextField(
                          key: const Key('v2-complete-action-progress'),
                          controller: _progressController,
                          enabled: !_saving && !_attempted,
                          minLines: 2,
                          maxLines: 5,
                          onChanged: (_) => setState(() {}),
                          decoration: const InputDecoration(
                            labelText: '这次有什么新情况？（可选）',
                            hintText: '例如：这次能主动圈出限制词，但独立作答时还漏了一处。',
                            alignLabelWithHint: true,
                          ),
                        ),
                        const SizedBox(height: 6),
                      ],
                      Text(
                        '没有新情况也可以直接完成；这里不会自动生成新的提醒。',
                        style: Theme.of(context).textTheme.bodySmall,
                      ),
                      if (_error != null) ...[
                        const SizedBox(height: 14),
                        Text(
                          _error!,
                          key: const Key('v2-action-save-error'),
                          style: TextStyle(color: Theme.of(context).colorScheme.error),
                        ),
                      ],
                      const SizedBox(height: 20),
                      Row(
                        children: [
                          Expanded(
                            child: OutlinedButton(
                              onPressed: _saving ? null : _close,
                              child: const Text('取消'),
                            ),
                          ),
                          const SizedBox(width: 10),
                          Expanded(
                            child: FilledButton(
                              key: const Key('v2-complete-action-save'),
                              onPressed: _saving ? null : _save,
                              child: Text(
                                _saving
                                    ? '保存中…'
                                    : _attempted
                                    ? '重新保存'
                                    : _hasProgress
                                    ? '保存并完成提醒'
                                    : '完成这次提醒',
                              ),
                            ),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          '''
          replace_between(
              'lib/features/design_v2/v2_action_composers.dart',
              'class V2CompleteActionComposer extends StatefulWidget {',
              'class V2RescheduleActionComposer extends StatefulWidget {',
              process_composer,
          )

          # Wire optional progress into the same atomic progress+complete command.
          replace_once(
              'lib/features/design_v2/v2_workspace_preview.dart',
              "  final operationId = createOperationId();\n  final saved = await showV2CompleteActionComposer(\n    context,\n    actionTitle: action.title,\n    onSave: () => controller.completeCurrentAction(\n      operationId: operationId,\n      caseId: item.id,\n    ),\n  );",
              "  final operationId = createOperationId();\n  final photoEvidenceOperationId = createOperationId();\n  final saved = await showV2CompleteActionComposer(\n    context,\n    actionTitle: action.title,\n    studentName: student.name,\n    subject: item.subject,\n    caseTitle: item.title,\n    onSave: () => controller.completeCurrentAction(\n      operationId: operationId,\n      caseId: item.id,\n    ),\n    onSaveProgress: (summary) => controller.recordProgress(\n      V2ProgressWrite(\n        operationId: operationId,\n        photoEvidenceOperationId: photoEvidenceOperationId,\n        caseId: item.id,\n        progressKind: CaseProgressKind.observation,\n        summary: summary,\n        completeCurrentAction: true,\n        nextStep: CaseProgressNextStep.continueTracking,\n        attachments: const <PickedEvidenceAttachment>[],\n      ),\n    ),\n  );",
          )

          # Recent-student navigation is real on both desktop and compact layouts.
          replace_once(
              'lib/features/design_v2/v2_workspace_preview.dart',
              "              Expanded(child: _TodayPane(onOpenCase: onOpenCase)),",
              "              Expanded(\n                child: _TodayPane(\n                  onOpenCase: onOpenCase,\n                  onOpenStudent: (student) {\n                    onStudentSelected(student);\n                    onDestinationChanged(1);\n                  },\n                ),\n              ),",
          )
          replace_once(
              'lib/features/design_v2/v2_workspace_preview.dart',
              "      body = _TodayPane(\n        onOpenCase: widget.onOpenCase,\n        compact: true,\n        onOpenMore: widget.onOpenMore,\n      );",
              "      body = _TodayPane(\n        onOpenCase: widget.onOpenCase,\n        onOpenStudent: (student) {\n          widget.onStudentSelected(student);\n          widget.onDestinationChanged(1);\n          setState(() => _studentOpen = true);\n        },\n        compact: true,\n        onOpenMore: widget.onOpenMore,\n      );",
          )

          today_block = r'''class _TodayPane extends StatelessWidget {
            const _TodayPane({
              required this.onOpenCase,
              required this.onOpenStudent,
              this.compact = false,
              this.onOpenMore,
            });

            final ValueChanged<V2FocusItem> onOpenCase;
            final ValueChanged<V2Student> onOpenStudent;
            final bool compact;
            final VoidCallback? onOpenMore;

            static int _priority(V2FocusItem item) => switch (item.actionTiming) {
              V2ActionTiming.overdue => 0,
              V2ActionTiming.today => 1,
              V2ActionTiming.undated => 2,
              V2ActionTiming.future => 3,
              null => 4,
            };

            static int _compare(V2FocusItem left, V2FocusItem right) {
              final priority = _priority(left).compareTo(_priority(right));
              if (priority != 0) return priority;
              final leftDue = left.dueOn;
              final rightDue = right.dueOn;
              if (leftDue != null && rightDue != null) {
                final due = leftDue.compareTo(rightDue);
                if (due != 0) return due;
              } else if (leftDue != null) {
                return -1;
              } else if (rightDue != null) {
                return 1;
              }
              return left.nextStep.compareTo(right.nextStep);
            }

            @override
            Widget build(BuildContext context) {
              final data = V2WorkspaceDataScope.of(context);
              final validItems = data.focusItems
                  .where(
                    (item) =>
                        data.studentForFocusItemOrNull(item) != null &&
                        item.actionTiming != null,
                  )
                  .toList(growable: false);
              final currentItems =
                  validItems
                      .where(
                        (item) =>
                            item.actionTiming == V2ActionTiming.overdue ||
                            item.actionTiming == V2ActionTiming.today,
                      )
                      .toList(growable: true)
                    ..sort(_compare);
              final undatedItems =
                  validItems
                      .where((item) => item.actionTiming == V2ActionTiming.undated)
                      .toList(growable: true)
                    ..sort(_compare);
              final futureItems =
                  validItems
                      .where((item) => item.actionTiming == V2ActionTiming.future)
                      .toList(growable: true)
                    ..sort(_compare);
              final recentStudents = data.students
                  .where((student) => student.lastActivityAt != null)
                  .toList(growable: true)
                ..sort(
                  (left, right) => right.lastActivityAt!.compareTo(
                    left.lastActivityAt!,
                  ),
                );

              return SingleChildScrollView(
                padding: EdgeInsets.all(compact ? 18 : 32),
                child: Center(
                  child: ConstrainedBox(
                    constraints: const BoxConstraints(maxWidth: 900),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    '今日',
                                    style: Theme.of(context).textTheme.headlineSmall,
                                  ),
                                  const SizedBox(height: 5),
                                  Text(
                                    _todayLabel(data.businessDate),
                                    style: Theme.of(context).textTheme.bodySmall,
                                  ),
                                  const SizedBox(height: 4),
                                  Text(
                                    '先处理已经安排好的跟进。',
                                    style: Theme.of(context).textTheme.bodySmall,
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(width: 12),
                            FilledButton.tonalIcon(
                              key: const Key('v2-today-quick-capture'),
                              onPressed: () => _showV2QuickCaptureStudentPicker(context),
                              icon: const Icon(Icons.note_add_outlined, size: 18),
                              label: const Text('记录问题'),
                            ),
                            if (compact && onOpenMore != null) ...[
                              const SizedBox(width: 4),
                              IconButton(
                                key: const Key('v2-compact-more'),
                                tooltip: '更多操作',
                                onPressed: onOpenMore,
                                icon: const Icon(Icons.more_vert),
                              ),
                            ],
                          ],
                        ),
                        const SizedBox(height: 28),
                        if (currentItems.isEmpty && undatedItems.isEmpty)
                          Text(
                            '今天暂时没有需要处理的提醒',
                            style: Theme.of(context).textTheme.bodyMedium,
                          ),
                        if (currentItems.isNotEmpty) ...[
                          _SectionTitle(title: '现在要做', count: currentItems.length),
                          const SizedBox(height: 8),
                          for (final item in currentItems)
                            _TodayAction(item: item, onOpenCase: onOpenCase),
                        ],
                        if (currentItems.isNotEmpty && undatedItems.isNotEmpty)
                          const SizedBox(height: 28),
                        if (undatedItems.isNotEmpty) ...[
                          _SectionTitle(title: '待安排', count: undatedItems.length),
                          const SizedBox(height: 6),
                          Text(
                            '这些提醒已经明确，只差安排日期。',
                            style: Theme.of(context).textTheme.bodySmall,
                          ),
                          const SizedBox(height: 6),
                          for (final item in undatedItems)
                            _TodayAction(item: item, onOpenCase: onOpenCase),
                        ],
                        if (futureItems.isNotEmpty) ...[
                          const SizedBox(height: 28),
                          Divider(color: Theme.of(context).colorScheme.outlineVariant),
                          ExpansionTile(
                            key: const Key('v2-today-future-section'),
                            tilePadding: EdgeInsets.zero,
                            childrenPadding: EdgeInsets.zero,
                            leading: const Icon(Icons.event_outlined),
                            title: const Text('之后'),
                            subtitle: Text('${futureItems.length} 项已安排的后续行动'),
                            children: [
                              for (final item in futureItems)
                                _TodayAction(item: item, onOpenCase: onOpenCase),
                            ],
                          ),
                        ],
                        if (recentStudents.isNotEmpty) ...[
                          const SizedBox(height: 28),
                          Divider(color: Theme.of(context).colorScheme.outlineVariant),
                          const SizedBox(height: 18),
                          const _SectionTitle(title: '最近学生'),
                          const SizedBox(height: 8),
                          for (final student in recentStudents.take(5))
                            _TodayRecentStudentRow(
                              student: student,
                              businessDate: data.businessDate,
                              onTap: () => onOpenStudent(student),
                            ),
                        ],
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          String _todayLabel(DateTime? businessDate) {
            const weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            final now = businessDate ?? DateTime.now();
            return '${now.month} 月 ${now.day} 日 · ${weekdays[now.weekday - 1]}';
          }

          class _TodayAction extends StatelessWidget {
            const _TodayAction({required this.item, required this.onOpenCase});

            final V2FocusItem item;
            final ValueChanged<V2FocusItem> onOpenCase;

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              final student = V2WorkspaceDataScope.of(context)
                  .studentForFocusItemOrNull(item);
              if (student == null) return const SizedBox.shrink();
              final controller = _V2RuntimeScope.maybeOf(context)?.workflowController;
              final pendingAction = controller?.pendingActionFor(item.id);
              final actionTitle = pendingAction?.title.trim().isNotEmpty == true
                  ? pendingAction!.title.trim()
                  : _displayNextStep(item.nextStep);
              final status = _todayActionStatus(item);
              return InkWell(
                borderRadius: BorderRadius.circular(10),
                onTap: () => onOpenCase(item),
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 15),
                  child: Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        width: 2,
                        height: 62,
                        color: item.actionTiming == V2ActionTiming.overdue
                            ? const Color(0xFFB77728)
                            : scheme.primary,
                      ),
                      const SizedBox(width: 15),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              actionTitle,
                              style: Theme.of(context).textTheme.titleMedium,
                            ),
                            const SizedBox(height: 4),
                            Text(
                              '${student.name} · ${item.subject}',
                              style: Theme.of(context).textTheme.bodySmall,
                            ),
                            const SizedBox(height: 3),
                            Text(
                              item.pendingVerification
                                  ? '${item.title} · 继续关注'
                                  : item.title,
                              style: Theme.of(context).textTheme.bodySmall,
                            ),
                            if (pendingAction != null) ...[
                              const SizedBox(height: 7),
                              Wrap(
                                spacing: 4,
                                runSpacing: 4,
                                children: [
                                  if (pendingAction.canComplete)
                                    TextButton.icon(
                                      key: ValueKey<String>(
                                        'v2-today-complete-${item.id}',
                                      ),
                                      onPressed: () => _showV2CompleteCurrentAction(
                                        context,
                                        student,
                                        item,
                                      ),
                                      icon: const Icon(
                                        Icons.check_circle_outline,
                                        size: 17,
                                      ),
                                      label: const Text('处理'),
                                    )
                                  else
                                    TextButton.icon(
                                      key: ValueKey<String>(
                                        'v2-today-review-${item.id}',
                                      ),
                                      onPressed: () => onOpenCase(item),
                                      icon: const Icon(Icons.open_in_new, size: 17),
                                      label: const Text('查看问题'),
                                    ),
                                  TextButton.icon(
                                    key: ValueKey<String>(
                                      'v2-today-reschedule-${item.id}',
                                    ),
                                    onPressed: () => _showV2RescheduleCurrentAction(
                                      context,
                                      student,
                                      item,
                                    ),
                                    icon: const Icon(
                                      Icons.event_repeat_outlined,
                                      size: 17,
                                    ),
                                    label: Text(
                                      pendingAction.dueOn == null ? '安排日期' : '改期',
                                    ),
                                  ),
                                ],
                              ),
                            ],
                          ],
                        ),
                      ),
                      if (status.isNotEmpty) ...[
                        const SizedBox(width: 10),
                        Text(status, style: Theme.of(context).textTheme.bodySmall),
                      ],
                      const SizedBox(width: 4),
                      const Icon(Icons.chevron_right, size: 20),
                    ],
                  ),
                ),
              );
            }
          }

          String _todayActionStatus(V2FocusItem item) => switch (item.actionTiming) {
            V2ActionTiming.overdue => item.dueLabel == '待安排'
                ? '已逾期'
                : '已逾期 · ${item.dueLabel}',
            V2ActionTiming.today => '今天',
            V2ActionTiming.undated => '待安排日期',
            V2ActionTiming.future => item.dueLabel,
            null => '',
          };

          class _TodayRecentStudentRow extends StatelessWidget {
            const _TodayRecentStudentRow({
              required this.student,
              required this.businessDate,
              required this.onTap,
            });

            final V2Student student;
            final DateTime? businessDate;
            final VoidCallback onTap;

            @override
            Widget build(BuildContext context) {
              return InkWell(
                borderRadius: BorderRadius.circular(10),
                onTap: onTap,
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 11),
                  child: Row(
                    children: [
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              student.name,
                              style: Theme.of(context).textTheme.titleSmall,
                            ),
                            const SizedBox(height: 3),
                            Text(
                              '${student.grade} · ${student.subjects.join(' / ')}',
                              style: Theme.of(context).textTheme.bodySmall,
                            ),
                          ],
                        ),
                      ),
                      Text(
                        _recentActivityLabel(student.lastActivityAt!, businessDate),
                        style: Theme.of(context).textTheme.bodySmall,
                      ),
                      const SizedBox(width: 4),
                      const Icon(Icons.chevron_right, size: 20),
                    ],
                  ),
                ),
              );
            }
          }

          String _recentActivityLabel(DateTime value, DateTime? businessDate) {
            final reference = businessDate ?? DateTime.now();
            final referenceDay = DateTime(reference.year, reference.month, reference.day);
            final valueDay = DateTime(value.year, value.month, value.day);
            final days = referenceDay.difference(valueDay).inDays;
            if (days <= 0) return '今天有记录';
            if (days == 1) return '昨天有记录';
            if (days < 7) return '$days 天前';
            return '${value.month} 月 ${value.day} 日';
          }

