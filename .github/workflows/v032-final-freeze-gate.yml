name: v0.3.2 final source freeze Gate F

on:
  push:
    branches:
      - hotfix/v0.3.2-real-device-ux
    paths:
      - ".github/workflows/v032-final-freeze-gate.yml"
      - "tools/v032_final_freeze_patch.py"

permissions:
  contents: write

concurrency:
  group: v032-final-source-freeze
  cancel-in-progress: false

jobs:
  linux-version-and-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages and protect lockfile
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Apply guarded freeze patch
        run: python3 tools/v032_final_freeze_patch.py

      - name: Format and verify patch boundary
        shell: bash
        run: |
          dart format lib/config/app_config.dart lib/update/update_models.dart test/features/design_v2_workspace_page_test.dart test/update/update_service_test.dart
          python3 -m json.tool docs/update-manifest.example.json >/dev/null
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/publish-release-assets.yml\ndocs/update-manifest.example.json\nlib/config/app_config.dart\nlib/update/update_models.dart\npubspec.yaml\ntest/features/design_v2_workspace_page_test.dart\ntest/update/update_service_test.dart'
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected final-freeze patch boundary:'
            echo "$changed"
            exit 1
          fi
          grep -qx 'version: 0.3.2+10' pubspec.yaml
          test "$(grep -o "'0.3.2+10'" lib/config/app_config.dart | wc -l)" -eq 2
          grep -q 'default: v0.3.2' .github/workflows/publish-release-assets.yml
          grep -q 'default: 0.3.2+10' .github/workflows/publish-release-assets.yml

      - name: Analyze Flutter
        run: flutter analyze

      - name: Run update model and release-version regressions
        run: flutter test test/update/update_service_test.dart test/config/release_version_contract_test.dart test/features/design_v2_workspace_page_test.dart

      - name: Run full Flutter suite
        run: flutter test

      - name: Build Android debug APK and verify frozen version
        shell: bash
        run: |
          flutter build apk --debug
          aapt="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          if [ -z "$aapt" ] || [ ! -x "$aapt" ]; then
            echo 'aapt not found'
            exit 1
          fi
          badging="$("$aapt" dump badging build/app/outputs/flutter-apk/app-debug.apk | head -n 1)"
          echo "$badging"
          case "$badging" in
            *"versionCode='10'"*"versionName='0.3.2'"*) ;;
            *) echo 'Android artifact version does not match 0.3.2+10'; exit 1 ;;
          esac

  windows-version-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages and protect lockfile
        shell: pwsh
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
          if ($LASTEXITCODE -ne 0) { throw 'pubspec.lock changed during pub get.' }

      - name: Apply guarded freeze patch
        run: python tools/v032_final_freeze_patch.py

      - name: Format and verify patch boundary
        shell: pwsh
        run: |
          dart format lib/config/app_config.dart lib/update/update_models.dart test/features/design_v2_workspace_page_test.dart test/update/update_service_test.dart
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch contains whitespace errors.' }
          $changed = @(git diff --name-only | Sort-Object)
          $expected = @('.github/workflows/publish-release-assets.yml','docs/update-manifest.example.json','lib/config/app_config.dart','lib/update/update_models.dart','pubspec.yaml','test/features/design_v2_workspace_page_test.dart','test/update/update_service_test.dart')
          if ((Compare-Object $changed $expected).Count -ne 0) { throw "Unexpected final-freeze patch boundary: $($changed -join ', ')" }
          if (-not (Select-String -Path pubspec.yaml -Pattern '^version: 0\.3\.2\+10$')) { throw 'pubspec version is not frozen to 0.3.2+10.' }

      - name: Analyze Flutter on Windows
        run: flutter analyze

      - name: Run full Flutter suite on Windows
        run: flutter test

      - name: Build Windows release bundle
        run: flutter build windows --release --dart-define="XUEQING_ALLOW_DEVELOPMENT_RELEASE=true"

  commit-verified-freeze:
    if: github.actor != 'github-actions[bot]'
    needs:
      - linux-version-and-regression
      - windows-version-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out verified branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/v0.3.2-real-device-ux
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply exact verified freeze patch
        run: |
          python3 tools/v032_final_freeze_patch.py
          dart format lib/config/app_config.dart lib/update/update_models.dart test/features/design_v2_workspace_page_test.dart test/update/update_service_test.dart
          git diff --check

      - name: Remove one-time freeze scaffolding and commit
        shell: bash
        run: |
          rm -f tools/v032_final_freeze_patch.py
          rm -f .github/workflows/v032-final-freeze-gate.yml
          git add -A
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/publish-release-assets.yml\n.github/workflows/v032-final-freeze-gate.yml\ndocs/update-manifest.example.json\nlib/config/app_config.dart\nlib/update/update_models.dart\npubspec.yaml\ntest/features/design_v2_workspace_page_test.dart\ntest/update/update_service_test.dart\ntools/v032_final_freeze_patch.py'
          if [ "$staged" != "$expected" ]; then
            echo 'Unexpected staged files:'
            echo "$staged"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze v0.3.2 version and repair version hashing'
          git push origin HEAD:hotfix/v0.3.2-real-device-ux
