name: Refresh PR lockfile once

on:
  push:
    branches:
      - ux/teacher-readable-history

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-readable-history
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Commit generated lockfile when needed
        run: |
          if git diff --quiet -- pubspec.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: refresh pubspec lockfile"
          git push origin HEAD:ux/teacher-readable-history
