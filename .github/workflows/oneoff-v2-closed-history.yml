name: One-off V2 closed history

on:
  push:
    branches:
      - ui/v2-closed-history-reopen
    paths:
      - .github/workflows/oneoff-v2-closed-history.yml

permissions:
  contents: write

jobs:
  patch-validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ui/v2-closed-history-reopen
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply closed history patch
        run: python3 .github/scripts/patch_v2_closed_history.py

      - name: Format
        run: |
          dart format \
            lib/features/design_v2/v2_fixture.dart \
            lib/features/design_v2/v2_workspace_data.dart \
            lib/features/design_v2/v2_read_model_adapter.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_read_model_adapter_test.dart \
            test/features/design_v2_workspace_data_injection_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/features/design_v2_read_model_adapter_test.dart
          flutter test test/features/design_v2_workspace_data_injection_test.dart
          flutter test test/features/design_v2_workspace_test.dart
          flutter test test/features/v2_action_composers_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated product change and remove helpers
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/design_v2/v2_fixture.dart \
            lib/features/design_v2/v2_workspace_data.dart \
            lib/features/design_v2/v2_read_model_adapter.dart \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_read_model_adapter_test.dart \
            test/features/design_v2_workspace_data_injection_test.dart
          git rm .github/scripts/patch_v2_closed_history.py
          git rm .github/workflows/oneoff-v2-closed-history.yml
          git commit -m "UI V2: expose closed learning history read-only"
          git push origin HEAD:ui/v2-closed-history-reopen
