name: Phase 0B.0-A platform build smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase0b0a-platform-smoke.yml"
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "windows/**"
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Optional xueqing-dev Supabase URL for a cloud-config build"
        required: false
        type: string
      supabase_publishable_key:
        description: "Optional publishable key for a cloud-config build"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: phase0b0a-platform-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XUEQING_ENV: development
  XUEQING_SUPABASE_URL: ${{ github.event.inputs.supabase_url || '' }}
  XUEQING_SUPABASE_PUBLISHABLE_KEY: ${{ github.event.inputs.supabase_publishable_key || '' }}

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define="XUEQING_ENV=${XUEQING_ENV}" \
            --dart-define="XUEQING_SUPABASE_URL=${XUEQING_SUPABASE_URL}" \
            --dart-define="XUEQING_SUPABASE_PUBLISHABLE_KEY=${XUEQING_SUPABASE_PUBLISHABLE_KEY}"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-debug:
    name: Windows debug bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows debug bundle
        shell: pwsh
        run: |
          flutter build windows --debug `
            --dart-define="XUEQING_ENV=$env:XUEQING_ENV" `
            --dart-define="XUEQING_SUPABASE_URL=$env:XUEQING_SUPABASE_URL" `
            --dart-define="XUEQING_SUPABASE_PUBLISHABLE_KEY=$env:XUEQING_SUPABASE_PUBLISHABLE_KEY"

      - name: Upload Windows debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-windows-debug-${{ github.sha }}
          path: build/windows/x64/runner/Debug
          if-no-files-found: error
          retention-days: 7
