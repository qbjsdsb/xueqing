name: Phase 0B.0-A platform build smoke

on:
  pull_request:
    paths:
      - ".github/workflows/phase0b0a-platform-smoke.yml"
      - ".github/workflows/package-windows.yml"
      - ".github/workflows/publish-release-assets.yml"
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "windows/**"
      - "tools/windows_updater/**"
      - "installer/windows/**"
      - "tools/windows_installer/**"
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Optional xueqing-dev Supabase URL for a cloud-config build"
        required: false
        type: string
      supabase_publishable_key:
        description: "Optional publishable key for a cloud-config build"
        required: false
        type: string
      app_version:
        description: "Optional app version including build number; defaults to pubspec.yaml"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: phase0b0a-platform-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XUEQING_ENV: development
  XUEQING_SUPABASE_URL: ${{ github.event.inputs.supabase_url || 'https://czuctoulgnfytcfonkhc.supabase.co' }}
  XUEQING_SUPABASE_PUBLISHABLE_KEY: ${{ github.event.inputs.supabase_publishable_key || 'sb_publishable_yjUy-gjUSSFkCpbK_AjLSA_I0FgOXTI' }}

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve app version
        shell: bash
        env:
          REQUESTED_APP_VERSION: ${{ github.event.inputs.app_version || '' }}
        run: |
          set -euo pipefail
          app_version="$REQUESTED_APP_VERSION"
          if [[ -z "$app_version" ]]; then
            app_version="$(awk '/^version:[[:space:]]*/ { print $2; exit }' pubspec.yaml)"
          fi
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+[1-9][0-9]*$ ]]; then
            echo "App version must match major.minor.patch[-prerelease]+positive_build."
            exit 1
          fi
          echo "XUEQING_APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "Resolved Xueqing app version: $app_version"

      - name: Build Android debug APK
        run: |
          version_name="${XUEQING_APP_VERSION%%+*}"
          build_number="${XUEQING_APP_VERSION##*+}"
          flutter build apk --debug \
            --build-name="$version_name" \
            --build-number="$build_number" \
            --dart-define="XUEQING_ENV=${XUEQING_ENV}" \
            --dart-define="XUEQING_APP_VERSION=${XUEQING_APP_VERSION}" \
            --dart-define="XUEQING_SUPABASE_URL=${XUEQING_SUPABASE_URL}" \
            --dart-define="XUEQING_SUPABASE_PUBLISHABLE_KEY=${XUEQING_SUPABASE_PUBLISHABLE_KEY}"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-debug:
    name: Windows release bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve app version
        shell: pwsh
        env:
          REQUESTED_APP_VERSION: ${{ github.event.inputs.app_version || '' }}
        run: |
          $appVersion = $env:REQUESTED_APP_VERSION.Trim()
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            $versionLine = Get-Content pubspec.yaml |
              Where-Object { $_ -match '^version:\s*\S+\s*$' } |
              Select-Object -First 1
            if ($null -eq $versionLine) {
              throw "pubspec.yaml does not contain a version field."
            }
            $appVersion = ($versionLine -replace '^version:\s*', '').Trim()
          }
          if ($appVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?\+[1-9]\d*$') {
            throw "App version must match major.minor.patch[-prerelease]+positive_build."
          }
          "XUEQING_APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved Xueqing app version: $appVersion"

      - name: Build Windows release bundle
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define="XUEQING_ENV=$env:XUEQING_ENV" `
            --dart-define="XUEQING_APP_VERSION=$env:XUEQING_APP_VERSION" `
            --dart-define="XUEQING_SUPABASE_URL=$env:XUEQING_SUPABASE_URL" `
            --dart-define="XUEQING_SUPABASE_PUBLISHABLE_KEY=$env:XUEQING_SUPABASE_PUBLISHABLE_KEY" `
            --dart-define="XUEQING_ALLOW_DEVELOPMENT_RELEASE=true"

      - name: Bundle Visual C++ release runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio locator was not found."
          }

          $vsPath = (& $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual C++ toolset installation was not found."
          }

          $releaseDir = Join-Path $pwd "build/windows/x64/runner/Release"
          $redistRoot = Join-Path $vsPath "VC/Redist/MSVC"
          $runtimeDir = Get-ChildItem -Path $redistRoot -Directory -Recurse |
            Where-Object {
              $_.Name -eq "Microsoft.VC143.CRT" -and
              (Test-Path (Join-Path $_.FullName "msvcp140.dll")) -and
              (Test-Path (Join-Path $_.FullName "vcruntime140.dll")) -and
              (Test-Path (Join-Path $_.FullName "vcruntime140_1.dll"))
            } |
            Select-Object -First 1
          if ($null -eq $runtimeDir) {
            throw "The Visual C++ release runtime directory was not found."
          }

          $requiredRuntime = @(
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )
          foreach ($runtimeName in $requiredRuntime) {
            Copy-Item `
              -Path (Join-Path $runtimeDir.FullName $runtimeName) `
              -Destination $releaseDir `
              -Force
          }

          $dumpbin = Get-ChildItem `
            -Path (Join-Path $vsPath "VC/Tools/MSVC") `
            -Filter "dumpbin.exe" `
            -File `
            -Recurse |
            Select-Object -First 1
          if ($null -eq $dumpbin) {
            throw "dumpbin.exe was not found for dependency verification."
          }

          $exePath = Join-Path $releaseDir "xueqing.exe"
          $dependencies = (& $dumpbin.FullName /DEPENDENTS $exePath 2>&1) -join "`n"
          if ($dependencies -match "(?i)MSVCP140D\.dll|VCRUNTIME140D\.dll|VCRUNTIME140_1D\.dll|ucrtbased\.dll") {
            throw "Release binary still depends on a Debug Visual C++ runtime."
          }

          foreach ($runtimeName in $requiredRuntime) {
            if (-not (Test-Path (Join-Path $releaseDir $runtimeName))) {
              throw "Missing bundled runtime: $runtimeName"
            }
          }

      - name: Build Windows updater helper smoke
        shell: pwsh
        working-directory: tools/windows_updater
        run: |
          dart pub get
          dart analyze
          if ($LASTEXITCODE -ne 0) {
            throw "Windows updater analysis failed with exit code $LASTEXITCODE."
          }
          $testFixtureDir = Join-Path $env:RUNNER_TEMP "xueqing-updater-fixtures"
          New-Item -ItemType Directory -Force -Path $testFixtureDir | Out-Null
          $testHelper = Join-Path $testFixtureDir "xueqing_updater_test.exe"
          $bootstrapTestHelper = Join-Path $testFixtureDir "xueqing_updater_bootstrap.exe"
          $shortFixture = Join-Path $testFixtureDir "short_lived_fixture.exe"
          $longFixture = Join-Path $testFixtureDir "long_lived_fixture.exe"
          dart compile exe bin/xueqing_updater.dart -o $testHelper
          dart compile exe bin/xueqing_updater.dart -o $bootstrapTestHelper
          dart compile exe test/fixtures/short_lived_fixture.dart -o $shortFixture
          dart compile exe test/fixtures/long_lived_fixture.dart -o $longFixture
          $env:XUEQING_UPDATER_HELPER = $testHelper
          $env:XUEQING_UPDATER_BOOTSTRAP_HELPER = $bootstrapTestHelper
          $env:XUEQING_UPDATER_SHORT_FIXTURE = $shortFixture
          $env:XUEQING_UPDATER_LONG_FIXTURE = $longFixture
          "XUEQING_UPDATER_HELPER=$testHelper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XUEQING_UPDATER_BOOTSTRAP_HELPER=$bootstrapTestHelper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XUEQING_UPDATER_SHORT_FIXTURE=$shortFixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XUEQING_UPDATER_LONG_FIXTURE=$longFixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          dart test
          if ($LASTEXITCODE -ne 0) {
            throw "Windows updater smoke tests failed with exit code $LASTEXITCODE."
          }
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build/windows/x64/runner/Release"
          $updaterPath = Join-Path $releaseDir "xueqing_updater.exe"
          $bootstrapPath = Join-Path $releaseDir "xueqing_updater_bootstrap.exe"
          dart compile exe bin/xueqing_updater.dart -o $updaterPath
          dart compile exe bin/xueqing_updater.dart -o $bootstrapPath
          foreach ($helperPath in @($updaterPath, $bootstrapPath)) {
            if (-not (Test-Path $helperPath)) {
              throw "Windows updater helper was not produced: $helperPath"
            }
            if ((Get-Item $helperPath).Length -le 0) {
              throw "Windows updater helper is empty: $helperPath"
            }
          }

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-windows-release-${{ github.sha }}
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 7

      - name: Build Windows installer
        shell: pwsh
        run: |
          $versionName = $env:XUEQING_APP_VERSION.Split('+')[0]
          & "$env:GITHUB_WORKSPACE/tools/windows_installer/build_installer.ps1" `
            -AppVersion $versionName

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: xueqing-windows-installer-${{ github.sha }}
          path: build/windows/installer/xueqing-setup-*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Smoke install and uninstall Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "build/windows/installer") `
            -Filter "xueqing-setup-*.exe" `
            -File |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Windows installer was not found for smoke installation."
          }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs/Xueqing"
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }

          $installProcess = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') `
            -Wait `
            -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Windows installer smoke failed with exit code $($installProcess.ExitCode)."
          }

          foreach ($requiredFile in @(
            "xueqing.exe",
            "xueqing_updater.exe",
            "xueqing_updater_bootstrap.exe",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )) {
            $installedPath = Join-Path $installDir $requiredFile
            if (-not (Test-Path $installedPath)) {
              throw "Installer did not install required file: $installedPath"
            }
            if ((Get-Item $installedPath).Length -le 0) {
              throw "Installer produced an empty required file: $installedPath"
            }
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Windows uninstaller was not installed."
          }
          $uninstallProcess = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait `
            -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Windows uninstaller smoke failed with exit code $($uninstallProcess.ExitCode)."
          }

          foreach ($removedFile in @("xueqing.exe", "xueqing_updater.exe", "xueqing_updater_bootstrap.exe")) {
            if (Test-Path (Join-Path $installDir $removedFile)) {
              throw "Windows uninstaller left application file behind: $removedFile"
            }
          }
