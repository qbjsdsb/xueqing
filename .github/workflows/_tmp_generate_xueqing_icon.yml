name: Temporary generate selected Xueqing icon assets

on:
  push:
    branches:
      - branding/xueqing-app-icon

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'branding: generate selected icon assets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout icon branch
        uses: actions/checkout@v6
        with:
          ref: branding/xueqing-app-icon
          fetch-depth: 0

      - name: Install deterministic raster tools
        run: python -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow==11.3.0'

      - name: Generate Android and Windows launcher assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct

          import cairosvg
          from PIL import Image, ImageDraw

          source = Path('branding/xueqing_app_icon.svg')
          build_dir = Path('build/icon-branding')
          build_dir.mkdir(parents=True, exist_ok=True)
          master_path = build_dir / 'xueqing_app_icon_1024.png'

          cairosvg.svg2png(
              url=str(source),
              write_to=str(master_path),
              output_width=1024,
              output_height=1024,
          )
          master = Image.open(master_path).convert('RGBA')

          density_sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          for density, size in density_sizes.items():
              icon = master.resize((size, size), Image.Resampling.LANCZOS)
              regular = Path(
                  f'android/app/src/main/res/mipmap-{density}/ic_launcher.png'
              )
              regular.parent.mkdir(parents=True, exist_ok=True)
              icon.save(regular, 'PNG', optimize=True)

              round_mask = Image.new('L', (size, size), 0)
              ImageDraw.Draw(round_mask).ellipse((0, 0, size - 1, size - 1), fill=255)
              round_icon = icon.copy()
              round_icon.putalpha(round_mask)
              round_path = Path(
                  f'android/app/src/main/res/mipmap-{density}/ic_launcher_round.png'
              )
              round_icon.save(round_path, 'PNG', optimize=True)

          ico_path = Path('windows/runner/resources/app_icon.ico')
          master.save(
              ico_path,
              format='ICO',
              sizes=[
                  (16, 16),
                  (20, 20),
                  (24, 24),
                  (32, 32),
                  (40, 40),
                  (48, 48),
                  (64, 64),
                  (96, 96),
                  (128, 128),
                  (256, 256),
              ],
          )

          data = ico_path.read_bytes()
          if data[:4] != b'\x00\x00\x01\x00':
              raise SystemExit('Generated Windows icon does not have a valid ICO header.')
          image_count = struct.unpack_from('<H', data, 4)[0]
          if image_count < 8:
              raise SystemExit(
                  f'Generated Windows icon has only {image_count} embedded sizes.'
              )
          print(f'Generated Xueqing icon assets with {image_count} Windows sizes.')
          PY

      - name: Commit generated assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qbjsdsb'
          git config user.email '3342513714@qq.com'
          git add \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png \
            windows/runner/resources/app_icon.ico
          git rm .github/workflows/_tmp_generate_xueqing_icon.yml
          git commit -m 'branding: generate launcher binaries from approved Xueqing mark'
          git push origin HEAD:branding/xueqing-app-icon
