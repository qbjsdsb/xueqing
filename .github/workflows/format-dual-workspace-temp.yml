name: Format dual workspace temporary

on:
  push:
    branches:
      - ux/dual-workspace-organization-supervision

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ux/dual-workspace-organization-supervision

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply exact Dart formatting
        run: |
          dart format \
            lib/features/design_v2/v2_organization_workspace_page.dart \
            test/features/v2_organization_workspace_test.dart \
            test/features/v2_organization_quick_capture_test.dart \
            test/features/v2_typed_organization_navigation_test.dart

      - name: Commit formatted sources and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-dual-workspace-temp.yml
          git add \
            lib/features/design_v2/v2_organization_workspace_page.dart \
            test/features/v2_organization_workspace_test.dart \
            test/features/v2_organization_quick_capture_test.dart \
            test/features/v2_typed_organization_navigation_test.dart
          git commit -m "chore: apply exact Dart formatting"
          git push origin HEAD:ux/dual-workspace-organization-supervision
