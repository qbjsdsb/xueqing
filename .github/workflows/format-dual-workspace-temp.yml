name: Format dual workspace temporary

on:
  push:
    branches:
      - ux/dual-workspace-organization-supervision

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/design_v2/v2_organization_workspace_page.dart \
            test/features/v2_organization_workspace_test.dart \
            test/features/v2_organization_quick_capture_test.dart \
            test/features/v2_typed_organization_navigation_test.dart

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-dual-workspace-sources
          path: |
            lib/features/design_v2/v2_organization_workspace_page.dart
            test/features/v2_organization_workspace_test.dart
            test/features/v2_organization_quick_capture_test.dart
            test/features/v2_typed_organization_navigation_test.dart
          if-no-files-found: error
          retention-days: 1
