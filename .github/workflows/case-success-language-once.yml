name: One-shot teacher success status language cleanup

on:
  push:
    branches:
      - ux/teacher-error-language
    paths:
      - .github/workflows/case-success-language-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/teacher-error-language
          fetch-depth: 0

      - name: Align success feedback with current teacher language
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/features/teacher_workspace/presentation/teacher_workspace_page.dart')
          text = path.read_text(encoding='utf-8')

          prefix = '已保存，Case 进入'
          prefix_count = text.count(prefix)
          if prefix_count < 3 or prefix_count > 10:
              raise SystemExit(f'unexpected teacher-visible Case success prefix count: {prefix_count}')
          text = text.replace(prefix, '已保存，当前状态：')
          print(f'replaced {prefix_count} teacher-visible success prefixes')

          def replace(old, new, expected):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected}, found {count}: {old!r}')
              text = text.replace(old, new)

          replace("'new' => '待整理',", "'new' => '新记录',", 1)
          replace("'confirmed' => '已确认',", "'confirmed' => '跟进中',", 1)
          replace("'intervening' => '干预中',", "'intervening' => '跟进中',", 1)
          replace("'pending_verification' => '待验证',", "'pending_verification' => '继续关注',", 1)
          replace("'stable' => '稳定',", "'stable' => '暂时稳定',", 1)
          replace("'closed' => '已关闭',", "'closed' => '已结束',", 1)

          path.write_text(text, encoding='utf-8')

          for stale in (
              '已保存，Case 进入',
              "'new' => '待整理'",
              "'confirmed' => '已确认'",
              "'intervening' => '干预中'",
              "'pending_verification' => '待验证'",
              "'stable' => '稳定'",
              "'closed' => '已关闭'",
          ):
              if stale in text:
                  raise SystemExit(f'stale teacher-facing status wording remains: {stale}')
          PY

      - name: Verify exact scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "lib/features/teacher_workspace/presentation/teacher_workspace_page.dart"

      - name: Commit real patch and remove one-shot workflow
        run: |
          rm .github/workflows/case-success-language-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: align success status language for teachers"
          git push origin HEAD:ux/teacher-error-language
