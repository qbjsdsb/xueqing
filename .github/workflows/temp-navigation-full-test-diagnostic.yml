name: Temporary navigation full-test diagnostic

on:
  push:
    branches:
      - diagnostic/navigation-simplification-full-test-20260913

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6
        with:
          ref: diagnostic/navigation-simplification-full-test-20260913
          fetch-depth: 0

      - name: Verify candidate parent
        run: |
          git merge-base --is-ancestor 34dd2875a6f1947603b2c0e7d8a00c2764df938d HEAD

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run full tests and capture failure
        id: tests
        shell: bash
        run: |
          set +e
          flutter test > /tmp/full-test.log 2>&1
          status=$?
          tail -n 600 /tmp/full-test.log > .github/full-test-failure.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/full-test-failure.txt
          git commit -m "chore: capture navigation full-test diagnostic"
          git push origin HEAD:diagnostic/navigation-simplification-full-test-20260913

      - name: Fail when tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
