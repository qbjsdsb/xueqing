name: Flutter checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Verify lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Check Dart formatting
        run: |
          dart format lib/cloud/session_request_guard.dart lib/features/cloud/presentation/cloud_connection_page.dart
          git diff -- lib/cloud/session_request_guard.dart lib/features/cloud/presentation/cloud_connection_page.dart
          exit 1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
