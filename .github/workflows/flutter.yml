name: Flutter checks

on:
  pull_request:
  push:
    branches:
      - main
      - phase0/flutter-bootstrap

permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check lockfile consistency
        run: git diff --exit-code -- pubspec.lock

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
