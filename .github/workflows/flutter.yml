name: Flutter checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-management-navigation-fix:
    name: Apply isolated management navigation fix
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/management-only-navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/management-only-navigation
          fetch-depth: 0

      - name: Apply focused workspace fix and regression test
        shell: python
        run: |
          from pathlib import Path

          workspace_path = Path('lib/features/teacher_workspace/presentation/teacher_workspace_page.dart')
          workspace = workspace_path.read_text(encoding='utf-8')
          needle = """  @override
  Widget build(BuildContext context) {
    return ResponsiveLayout(
"""
          replacement = """  @override
  Widget build(BuildContext context) {
    // A management-only account has one valid workspace surface. Flutter's
    // NavigationBar/NavigationRail require at least two destinations, so do
    // not render a navigation shell that would manufacture a second tab or
    // expose a teaching page outside the account's scope.
    if (!hasTeachingAccess && showManagement) {
      return Scaffold(
        appBar: AppBar(
          title: const Text('机构管理'),
          actions: [
            if (onCheckForUpdates != null)
              IconButton(
                tooltip: '检查更新',
                onPressed: checkingForUpdates ? null : onCheckForUpdates,
                icon: checkingForUpdates
                    ? const SizedBox(
                        width: 20,
                        height: 20,
                        child: CircularProgressIndicator(strokeWidth: 2),
                      )
                    : const Icon(Icons.system_update_alt),
              ),
            if (onSignOut != null)
              IconButton(
                tooltip: '退出登录',
                onPressed: onSignOut,
                icon: const Icon(Icons.logout),
              ),
          ],
        ),
        body: SafeArea(child: child),
      );
    }

    return ResponsiveLayout(
"""
          if workspace.count(needle) != 1:
              raise SystemExit('workspace patch anchor must occur exactly once')
          workspace_path.write_text(workspace.replace(needle, replacement, 1), encoding='utf-8')

          test_path = Path('test/features/teacher_workspace_test.dart')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'renders management-only accounts without a navigation assertion'
          if marker in tests:
              raise SystemExit('regression test already exists')
          if not tests.endswith('}\n'):
              raise SystemExit('unexpected teacher workspace test file ending')
          new_test = r'''

  testWidgets(
    'renders management-only accounts without a navigation assertion',
    (tester) async {
      final workspace = _fixtureWorkspace();
      final repository = _FakeLearningRepository(
        TeacherWorkspace(
          viewerName: workspace.viewerName,
          organizationName: workspace.organizationName,
          organizationTimeZone: workspace.organizationTimeZone,
          hasTeachingAccess: false,
          organizationId: 'org-1',
          roles: const <String>['org_admin'],
          canManageOrganization: true,
          students: const <WorkspaceStudent>[],
          loadedAt: workspace.loadedAt,
        ),
      );

      await _pumpWorkspace(tester, repository);

      expect(find.text('机构管理尚未接通'), findsOneWidget);
      expect(find.byType(NavigationBar), findsNothing);
      expect(find.byType(NavigationRail), findsNothing);
    },
  );
'''
          test_path.write_text(tests[:-2] + new_test + '}\n', encoding='utf-8')

          Path('.github/workflows/zz-apply-management-navigation-fix.yml').unlink()

      - name: Restore registered workflow and verify scope
        run: |
          git checkout origin/main -- .github/workflows/flutter.yml
          git diff --check
          git diff --name-status
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/flutter.yml .github/workflows/zz-apply-management-navigation-fix.yml lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart "

      - name: Commit focused fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render management-only workspace without navigation'
          git push origin HEAD:fix/management-only-navigation

  checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Verify lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Check Dart formatting
        run: |
          dart format .
          git diff --exit-code -- .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test