name: Apply teacher student grouping and plain recovery v0.2.1

on:
  push:
    branches:
      - ux/teacher-student-grouping-plain-recovery-v021

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/teacher-student-grouping-plain-recovery-v021
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Apply focused teacher flow patch
        run: python3 tool/run_teacher_student_grouping_plain_recovery_v021.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart test/features/workflow_clarity_contract_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter tests
        run: flutter test

      - name: Verify diff
        run: git diff --check

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          rm tool/apply_teacher_student_grouping_plain_recovery_v021.py
          rm tool/run_teacher_student_grouping_plain_recovery_v021.py
          rm .github/workflows/apply-teacher-student-grouping-plain-recovery-v021.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart test/features/workflow_clarity_contract_test.dart tool/apply_teacher_student_grouping_plain_recovery_v021.py tool/run_teacher_student_grouping_plain_recovery_v021.py .github/workflows/apply-teacher-student-grouping-plain-recovery-v021.yml
          git commit -m 'UX: group students and simplify recovery copy'
          git push origin HEAD:ux/teacher-student-grouping-plain-recovery-v021
