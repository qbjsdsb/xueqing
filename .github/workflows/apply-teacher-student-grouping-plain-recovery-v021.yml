name: Apply teacher student grouping and plain recovery v0.2.1

on:
  push:
    branches:
      - ux/teacher-student-grouping-plain-recovery-v021

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/teacher-student-grouping-plain-recovery-v021
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply focused teacher flow patch
        run: python3 tool/run_teacher_student_grouping_plain_recovery_v021.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart test/features/workflow_clarity_contract_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/xueqing_flutter_test.log 2>&1
          status=$?
          cat /tmp/xueqing_flutter_test.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/xueqing_flutter_test.log tool/last_teacher_flow_test_failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tool/last_teacher_flow_test_failure.txt
            git commit -m 'test: capture teacher flow failure diagnostics'
            git push origin HEAD:ux/teacher-student-grouping-plain-recovery-v021
          fi
          exit "$status"

      - name: Verify diff
        run: git diff --check

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          rm tool/apply_teacher_student_grouping_plain_recovery_v021.py
          rm tool/run_teacher_student_grouping_plain_recovery_v021.py
          rm -f tool/last_teacher_flow_test_failure.txt
          rm .github/workflows/apply-teacher-student-grouping-plain-recovery-v021.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart test/features/workflow_clarity_contract_test.dart tool/apply_teacher_student_grouping_plain_recovery_v021.py tool/run_teacher_student_grouping_plain_recovery_v021.py tool/last_teacher_flow_test_failure.txt .github/workflows/apply-teacher-student-grouping-plain-recovery-v021.yml
          git commit -m 'UX: group students and simplify recovery copy'
          git push origin HEAD:ux/teacher-student-grouping-plain-recovery-v021
