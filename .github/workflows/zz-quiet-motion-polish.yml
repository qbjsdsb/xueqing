name: Apply quiet motion polish

on:
  push:
    branches:
      - ux/quiet-motion-polish
    paths:
      - ".github/workflows/zz-quiet-motion-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/quiet-motion-polish
          fetch-depth: 0

      - name: Verify base
        run: test "$(git merge-base HEAD origin/main)" = "38419c9a26b615692a75f8dc31cf3ddfda1adb2c"

      - name: Apply focused patch
        run: python3 .github/tmp/apply_quiet_motion.py

      - name: Remove temporary files
        run: rm .github/workflows/zz-quiet-motion-polish.yml .github/tmp/apply_quiet_motion.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format and validate
        run: |
          dart format lib/app/theme/app_motion.dart lib/features/teacher_workspace/presentation/teacher_workspace_page.dart lib/features/organization_management/presentation/organization_management_page.dart lib/features/organization_management/presentation/organization_management_areas.dart lib/features/organization_management/presentation/organization_student_setup_dialog.dart
          git diff --check
          flutter analyze
          flutter test

      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ux: add quiet motion and simplify Today actions"
          test "$(git diff --name-only 38419c9a26b615692a75f8dc31cf3ddfda1adb2c HEAD | wc -l)" -eq 5
          git push origin HEAD:ux/quiet-motion-polish
