name: Retry Xueqing v0.2.0 Stable publisher once

on:
  push:
    branches:
      - release/v0.2.0-stable-final
    paths:
      - .github/workflows/publish-stable-v020-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FROZEN_RELEASE_SHA: b040397f4488436037b0987b95f29ba90f1badc6
      RELEASE_TAG: v0.2.0
      APP_VERSION: 0.2.0+6
    steps:
      - name: Verify staged tag and dispatch current Stable publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          if [[ "$tag_sha" != "$FROZEN_RELEASE_SHA" ]]; then
            echo "v0.2.0 tag no longer points at the frozen product source."
            exit 1
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RELEASE_JSON="$release_json" python3 - <<'PY'
          import json, os
          release = json.loads(os.environ['RELEASE_JSON'])
          if release.get('draft') or not release.get('prerelease'):
              raise SystemExit('v0.2.0 must still be the staged Pre-release before promotion')
          PY

          python3 - <<'PY' > dispatch.json
          import json
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "release_tag": "v0.2.0",
                  "app_version": "0.2.0+6",
                  "release_notes": "教师工作流全面简化\n成长记录与导出优化\nAndroid / Windows 正式安装与应用内更新",
              },
          }, ensure_ascii=False))
          PY

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/publish-release-assets.yml/dispatches" \
            --input dispatch.json

          echo "Stable publisher redispatched for $RELEASE_TAG / $APP_VERSION."
