name: One-shot optional reminder title

on:
  push:
    branches:
      - ux/optional-reminder-title
    paths:
      - .github/workflows/one-shot-optional-reminder-title.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/optional-reminder-title
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply focused UX changes
        run: python tool/one_shot_optional_reminder.py
      - name: Format and focused test
        run: |
          flutter pub get
          dart format lib/cloud/progressive_case_repository.dart lib/features/teacher_workspace/presentation/progressive_case_forms.dart test/features/progressive_case_forms_test.dart
          flutter test test/features/progressive_case_forms_test.dart
      - name: Remove one-shot files and commit
        run: |
          rm .github/workflows/one-shot-optional-reminder-title.yml
          rm tool/one_shot_optional_reminder.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: make reminder titles optional"
          git push origin HEAD:ux/optional-reminder-title
