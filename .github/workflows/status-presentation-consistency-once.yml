name: One-shot status presentation consistency fix

on:
  push:
    branches:
      - ux/status-presentation-consistency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/status-presentation-consistency
          fetch-depth: 0

      - name: Apply narrow status vocabulary fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('lib/features/teacher_workspace/presentation/teacher_workspace_page.dart'): [
                  ("'待验证' => Theme.of(context).colorScheme.tertiary,", "'继续关注' => Theme.of(context).colorScheme.tertiary,"),
                  ("'稳定' => Theme.of(context).colorScheme.primary,", "'暂时稳定' => Theme.of(context).colorScheme.primary,"),
                  ("'已关闭' => Theme.of(context).colorScheme.onSurfaceVariant,", "'已结束' => Theme.of(context).colorScheme.onSurfaceVariant,"),
              ],
              Path('lib/export/learning_record_export.dart'): [
                  ("'new' => '待整理',", "'new' => '新记录',"),
                  ("'pending_verification' => '待验证',", "'pending_verification' => '继续关注',"),
              ],
              Path('test/export/teacher_learning_record_export_test.dart'): [
                  ("expect(rows.first.status, '待验证');", "expect(rows.first.status, '继续关注');"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit product fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/status-presentation-consistency-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: align status presentation across workspace and exports"
          git push origin HEAD:ux/status-presentation-consistency
