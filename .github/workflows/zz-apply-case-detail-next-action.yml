name: Apply Case detail next-action reduction

on:
  push:
    branches:
      - ux/case-detail-next-action

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/case-detail-next-action
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply exact patch
        run: python3 .github/scripts/zz_apply_case_detail_next_action.py

      - name: Verify exact net diff
        run: |
          rm .github/workflows/zz-apply-case-detail-next-action.yml
          rm .github/scripts/zz_apply_case_detail_next_action.py
          dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
          git diff --check
          git diff --exit-code -- . ':!lib/features/teacher_workspace/presentation/teacher_workspace_page.dart' ':!test/features/teacher_workspace_test.dart'

      - name: Analyze and run teacher workspace regression suite
        run: |
          flutter analyze
          flutter test test/features/teacher_workspace_test.dart

      - name: Commit verified Case detail reduction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ux: keep Case detail centered on the next action'
          git push origin HEAD:ux/case-detail-next-action
