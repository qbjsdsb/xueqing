name: Apply Case detail next-action reduction

on:
  push:
    branches:
      - ux/case-detail-next-action

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ux/case-detail-next-action
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply exact patch
        run: |
          sed -i "s/source.count(old_late_action) != 1/source.count(old_late_action) != 2/" .github/scripts/zz_apply_case_detail_next_action.py
          sed -i "s#source = source.replace(old_late_action, '', 1)#source = source[:source.rfind(old_late_action)] + source[source.rfind(old_late_action) + len(old_late_action):]#" .github/scripts/zz_apply_case_detail_next_action.py
          python3 .github/scripts/zz_apply_case_detail_next_action.py

      - name: Verify exact working tree
        run: |
          rm .github/workflows/zz-apply-case-detail-next-action.yml
          rm .github/scripts/zz_apply_case_detail_next_action.py
          dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/teacher_workspace_test.dart
          git diff --check
          python3 <<'PY'
          import subprocess

          expected = {
              'lib/features/teacher_workspace/presentation/teacher_workspace_page.dart',
              'test/features/teacher_workspace_test.dart',
              '.github/workflows/zz-apply-case-detail-next-action.yml',
              '.github/scripts/zz_apply_case_detail_next_action.py',
          }
          lines = subprocess.check_output(
              ['git', 'status', '--porcelain'], text=True
          ).splitlines()
          paths = {line[3:] for line in lines}
          if paths != expected:
              raise SystemExit(
                  f'Unexpected working-tree paths: {sorted(paths)}; expected {sorted(expected)}'
              )
          statuses = {line[3:]: line[:2] for line in lines}
          for path in (
              '.github/workflows/zz-apply-case-detail-next-action.yml',
              '.github/scripts/zz_apply_case_detail_next_action.py',
          ):
              if statuses.get(path) != ' D':
                  raise SystemExit(
                      f'Expected temporary file deletion for {path}, got {statuses.get(path)!r}'
                  )
          for path in (
              'lib/features/teacher_workspace/presentation/teacher_workspace_page.dart',
              'test/features/teacher_workspace_test.dart',
          ):
              if statuses.get(path) != ' M':
                  raise SystemExit(
                      f'Expected target-file modification for {path}, got {statuses.get(path)!r}'
                  )
          PY

      - name: Analyze and run teacher workspace regression suite
        run: |
          flutter analyze
          flutter test test/features/teacher_workspace_test.dart

      - name: Commit verified Case detail reduction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ux: keep Case detail centered on the next action'
          git push origin HEAD:ux/case-detail-next-action
