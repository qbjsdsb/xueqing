name: One-shot D1c apply and verify

on:
  push:
    branches:
      - v0.3.8/organization-quick-capture-responsibility

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.3.8/organization-quick-capture-responsibility
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - run: python3 tool/d1c_apply.py
      - run: dart format lib/cloud/responsibility_scoped_learning_repository.dart lib/features/design_v2/v2_workflow_controller.dart lib/features/design_v2/v2_organization_workspace_page.dart test/cloud/responsibility_scoped_learning_repository_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/cloud/responsibility_scoped_learning_repository_test.dart test/cloud/responsibility_scoped_quick_capture_contract_test.dart test/features/v2_typed_organization_navigation_test.dart
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/cloud/responsibility_scoped_learning_repository.dart lib/features/design_v2/v2_workflow_controller.dart lib/features/design_v2/v2_organization_workspace_page.dart test/cloud/responsibility_scoped_learning_repository_test.dart
          git commit -m "v2: wire responsibility-safe Organization Quick Capture"
          git push origin HEAD:v0.3.8/organization-quick-capture-responsibility