name: One-off V2 photo timeline aggregation

on:
  push:
    branches:
      - ui/v2-photo-timeline-aggregation

permissions:
  contents: write

jobs:
  patch-validate-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-photo-timeline-aggregation
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply aggregation patch
        run: python3 .github/scripts/patch_v2_photo_timeline_aggregation.py

      - name: Format
        run: dart format lib/cloud/learning_repository.dart lib/features/design_v2/v2_workflow_controller.dart test/features/design_v2_workflow_controller_test.dart test/features/v2_progress_photo_grouping_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/features/v2_progress_photo_grouping_test.dart
          flutter test test/features/design_v2_workflow_controller_test.dart
          flutter test test/features/design_v2_read_model_adapter_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated product change and remove helpers
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cloud/learning_repository.dart \
                  lib/features/design_v2/v2_workflow_controller.dart \
                  test/features/design_v2_workflow_controller_test.dart \
                  test/features/v2_progress_photo_grouping_test.dart
          git rm .github/scripts/patch_v2_photo_timeline_aggregation.py
          git rm .github/workflows/oneoff-v2-photo-timeline-aggregation.yml
          git commit -m "UI V2: aggregate progress photo evidence in timeline"
          git push origin HEAD:ui/v2-photo-timeline-aggregation
