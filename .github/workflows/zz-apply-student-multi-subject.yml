name: Apply student multi-subject service

on:
  push:
    branches:
      - feature/student-multi-subject-service
    paths:
      - '.github/scripts/zz_apply_student_multi_subject.py'
      - '.github/workflows/zz-apply-student-multi-subject.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply exact feature patch
        run: python .github/scripts/zz_apply_student_multi_subject.py

      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/zz_apply_student_multi_subject.py
          rm .github/workflows/zz-apply-student-multi-subject.yml

      - name: Format and verify exact net diff
        shell: bash
        run: |
          dart format \
            lib/cloud/organization_management_repository.dart \
            lib/features/organization_management/presentation/organization_management_page.dart \
            lib/features/organization_management/presentation/organization_management_learning_actions.dart \
            lib/features/organization_management/presentation/organization_management_areas.dart \
            lib/features/organization_management/presentation/organization_management_rows.dart \
            lib/features/organization_management/presentation/organization_student_subject_setup_dialog.dart \
            test/features/organization_management_test.dart
          git diff --check
          git diff --name-only origin/main | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          lib/cloud/organization_management_repository.dart
          lib/features/organization_management/presentation/organization_management_areas.dart
          lib/features/organization_management/presentation/organization_management_learning_actions.dart
          lib/features/organization_management/presentation/organization_management_page.dart
          lib/features/organization_management/presentation/organization_management_rows.dart
          lib/features/organization_management/presentation/organization_student_subject_setup_dialog.dart
          supabase/migrations/20260908004500_student_multi_subject_service.sql
          supabase/tests/student_multi_subject_service_test.sql
          test/features/organization_management_test.dart
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Analyze and run management regression suite
        run: |
          flutter analyze
          flutter test test/features/organization_management_test.dart

      - name: Commit verified feature slice
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support multiple subject services per student'
          git push
