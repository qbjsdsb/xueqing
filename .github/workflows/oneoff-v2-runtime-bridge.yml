name: One-off V2 runtime bridge

on:
  push:
    branches:
      - ui/v2-runtime-bridge
    paths:
      - .github/workflows/oneoff-v2-runtime-bridge.yml

permissions:
  contents: write

jobs:
  patch-validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ui/v2-runtime-bridge
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply runtime bridge patch
        run: python3 .github/scripts/patch_v2_runtime_bridge.py

      - name: Format
        run: |
          dart format \
            lib/features/teacher_workspace/workspace_runtime.dart \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            lib/app/router/app_router.dart \
            lib/features/design_v2/v2_real_preview_page.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            test/features/design_v2_real_preview_contract_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/features/design_v2_real_preview_contract_test.dart
          flutter test test/features/design_v2_real_preview_page_test.dart
          flutter test test/features/design_v2_workspace_loader_test.dart
          flutter test test/app/bootstrap_test.dart
          flutter test test/features/teacher_workspace_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Commit validated product change and remove helpers
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/teacher_workspace/workspace_runtime.dart \
            lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
            lib/app/router/app_router.dart \
            lib/features/design_v2/v2_real_preview_page.dart \
            lib/features/design_v2/v2_workspace_loader.dart \
            test/features/design_v2_real_preview_contract_test.dart
          git rm .github/scripts/patch_v2_runtime_bridge.py
          git rm .github/workflows/oneoff-v2-runtime-bridge.yml
          git commit -m "UI V2: add authenticated runtime capability bridge"
          git push origin HEAD:ui/v2-runtime-bridge
