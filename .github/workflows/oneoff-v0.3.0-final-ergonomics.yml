name: One-off v0.3.0 final ergonomics closure

on:
  push:
    branches:
      - release/v0.3.0-icon-optical-size

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.3.0-icon-optical-size
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Apply exact release ergonomics fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/design_v2/v2_composers.dart')
          text = path.read_text(encoding='utf-8')

          motion_import = "import '../../app/theme/app_motion.dart';\n"
          import_anchor = "import 'package:flutter/material.dart';\n\n"
          if motion_import not in text:
              if import_anchor not in text:
                  raise SystemExit('material import anchor missing')
              text = text.replace(import_anchor, import_anchor + motion_import, 1)

          fixed = 'duration: const Duration(milliseconds: 180),'
          count = text.count(fixed)
          if count != 4:
              raise SystemExit(f'expected 4 fixed composer durations, found {count}')
          text = text.replace(fixed, 'duration: AppMotion.effectiveDuration(context),')

          selector_marker = 'class _InlineSelector<T> extends StatelessWidget {'
          selector_at = text.find(selector_marker)
          if selector_at < 0:
              raise SystemExit('inline selector class missing')
          head, tail = text[:selector_at], text[selector_at:]
          selector_old = "              child: Container(\n                padding: const EdgeInsets.fromLTRB(10, 8, 10, 7),"
          selector_new = "              child: Container(\n                constraints: const BoxConstraints(minHeight: 44),\n                padding: const EdgeInsets.fromLTRB(10, 8, 10, 7),"
          if selector_old not in tail:
              raise SystemExit('inline selector target missing')
          tail = tail.replace(selector_old, selector_new, 1)
          text = head + tail

          radio_marker = 'class _QuietRadioRow extends StatelessWidget {'
          radio_at = text.find(radio_marker)
          if radio_at < 0:
              raise SystemExit('quiet radio class missing')
          head, tail = text[:radio_at], text[radio_at:]
          radio_old = "      child: Padding(\n        padding: const EdgeInsets.symmetric(vertical: 8),"
          radio_new = "      child: Container(\n        constraints: const BoxConstraints(minHeight: 44),\n        padding: const EdgeInsets.symmetric(vertical: 8),"
          if radio_old not in tail:
              raise SystemExit('quiet radio target missing')
          tail = tail.replace(radio_old, radio_new, 1)
          text = head + tail

          media_old = """                          child: const SizedBox(
                            width: 26,
                            height: 26,
                            child: Icon(Icons.close, size: 15),
                          ),"""
          media_new = """                          child: SizedBox(
                            width: 44,
                            height: 44,
                            child: Center(
                              child: Container(
                                width: 26,
                                height: 26,
                                decoration: BoxDecoration(
                                  color: scheme.surfaceContainerHighest,
                                  shape: BoxShape.circle,
                                ),
                                child: const Icon(Icons.close, size: 15),
                              ),
                            ),
                          ),"""
          if media_old not in text:
              raise SystemExit('media remove target missing')
          text = text.replace(media_old, media_new, 1)

          if 'duration: const Duration(milliseconds: 180),' in text:
              raise SystemExit('fixed composer duration remains')
          if text.count('AppMotion.effectiveDuration(context)') != 4:
              raise SystemExit('composer reduced-motion coverage is incomplete')
          if text.count('BoxConstraints(minHeight: 44)') < 2:
              raise SystemExit('touch target constraints are incomplete')
          if "width: 44,\n                            height: 44," not in text:
              raise SystemExit('media remove hit target is not 44x44')

          path.write_text(text, encoding='utf-8')
          PY

          dart format lib/features/design_v2/v2_composers.dart

      - name: Validate focused and full Flutter tree
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test test/features/design_v2_composers_test.dart
          flutter test test/features/v2_visual_polish_contract_test.dart
          flutter test
          git diff --check

      - name: Commit validated production change and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/design_v2/v2_composers.dart
          git rm .github/workflows/oneoff-v0.3.0-final-ergonomics.yml
          git commit -m 'fix: finish v0.3.0 composer ergonomics'
          git push origin HEAD:release/v0.3.0-icon-optical-size
