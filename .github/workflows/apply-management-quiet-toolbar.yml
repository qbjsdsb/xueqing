name: Apply management quiet toolbar

on:
  push:
    paths:
      - '.github/management-quiet-toolbar.trigger'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused management patch
        run: python .github/patches/apply_management_quiet_toolbar.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format affected files
        run: dart format lib/features/organization_management/presentation/organization_management_areas.dart lib/features/organization_management/presentation/organization_management_layout.dart test/features/management_visual_density_test.dart test/features/organization_management_test.dart

      - name: Verify diff hygiene
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              'lib/features/organization_management/presentation/organization_management_areas.dart',
              'lib/features/organization_management/presentation/organization_management_layout.dart',
              'test/features/management_visual_density_test.dart',
              'test/features/organization_management_test.dart',
              '.github/patches/apply_management_quiet_toolbar.py',
              '.github/workflows/apply-management-quiet-toolbar.yml',
              '.github/management-quiet-toolbar.trigger',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected files: {sorted(unexpected)}')
          PY

      - name: Run focused management tests
        run: |
          flutter test test/features/management_visual_density_test.dart
          flutter test test/features/management_workflow_clarity_contract_test.dart
          flutter test test/features/organization_management_test.dart
          flutter test test/features/v2_organization_workspace_test.dart
          flutter test test/features/v2_visual_foundation_contract_test.dart

      - name: Analyze affected implementation
        run: flutter analyze lib/features/organization_management/presentation/organization_management_areas.dart lib/features/organization_management/presentation/organization_management_layout.dart test/features/management_visual_density_test.dart test/features/organization_management_test.dart

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/patches/apply_management_quiet_toolbar.py
          rm -f .github/workflows/apply-management-quiet-toolbar.yml
          rm -f .github/management-quiet-toolbar.trigger
          git diff --check

      - name: Commit clean result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          python - <<'PY'
          import subprocess
          allowed = {
              'lib/features/organization_management/presentation/organization_management_areas.dart',
              'lib/features/organization_management/presentation/organization_management_layout.dart',
              'test/features/management_visual_density_test.dart',
              'test/features/organization_management_test.dart',
              '.github/patches/apply_management_quiet_toolbar.py',
              '.github/workflows/apply-management-quiet-toolbar.yml',
              '.github/management-quiet-toolbar.trigger',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'final tree contains unexpected files: {sorted(unexpected)}')
          PY
          git commit -m "polish(management): quiet area chrome and export tooling"
          git push origin HEAD
