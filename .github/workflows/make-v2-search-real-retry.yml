name: Make V2 search real retry

on:
  push:
    paths:
      - '.github/workflows/make-v2-search-real-retry.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/v2-prototype-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Reuse search patch with robust test insertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/make-v2-search-real-once.yml').read_text().splitlines()
          capture = False
          lines = []
          for line in workflow:
              if "python3 - <<'PY'" in line:
                  capture = True
                  continue
              if capture and line.strip() == 'PY':
                  break
              if capture:
                  lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines)
          old = "marker = '\\n          }\\n'\npos = t.rfind(marker)\nassert pos >= 0\nt = t[:pos] + insertion + t[pos:]\ntest.write_text(t)"
          new = "pos = t.rfind('\\n}')\nassert pos >= 0\nt = t[:pos] + insertion + t[pos:]\ntest.write_text(t)"
          assert old in script
          exec(script.replace(old, new), {'__name__': '__main__'})
          PY
      - name: Format, analyze, and test real search
        run: |
          dart format \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_workspace_test.dart
          flutter analyze \
            lib/main_v2.dart \
            lib/features/design_v2/v2_theme.dart \
            lib/features/design_v2/v2_fixture.dart \
            lib/features/design_v2/v2_composers.dart \
            lib/features/design_v2/v2_workspace_preview.dart
          flutter test \
            test/features/design_v2_workspace_test.dart \
            test/features/design_v2_composers_test.dart
      - name: Commit validated search behavior
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/design_v2_workspace_test.dart
          git commit -m 'ui(v2): make student and Case search functional'
          git push origin HEAD:ui/v2-prototype-foundation
