name: Format PR 69

on:
  push:
    branches:
      - fix/management-only-navigation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/management-only-navigation

      - name: Remove formatter-only blank line
        run: |
          python3 -c "from pathlib import Path; p=Path('test/features/teacher_workspace_test.dart'); s=p.read_text(); old=\"  });\\n\\n\\n  testWidgets(\\n    'renders management-only accounts without a navigation assertion'\"; new=\"  });\\n\\n  testWidgets(\\n    'renders management-only accounts without a navigation assertion'\"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
          rm .github/workflows/zz-format-pr69.yml
          git diff --check

      - name: Commit formatter correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format management navigation regression test'
          git push origin HEAD:fix/management-only-navigation
