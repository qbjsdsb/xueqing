name: Apply audit fixes to Android root navigation

on:
  push:
    branches:
      - ux/navigation-architecture-v2
    paths:
      - .xueqing-audit-fix-239.py
      - .github/workflows/apply-audit-fix-239.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audit fixes
        run: python3 .xueqing-audit-fix-239.py

      - name: Remove one-shot assets and stale diagnostics
        run: |
          rm -f \
            .xueqing-audit-fix-239.py \
            .github/workflows/apply-audit-fix-239.yml \
            .navigation-focused-test.log

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      - name: Format touched files
        run: |
          dart format \
            lib/features/design_v2/v2_workspace_preview.dart \
            test/features/android_predictive_back_contract_test.dart \
            test/features/design_v2_workspace_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused Android navigation regression
        run: |
          flutter test \
            test/features/android_predictive_back_contract_test.dart \
            test/features/design_v2_workspace_test.dart

      - name: Full suite
        run: flutter test

      - name: Commit verified audit fixes
        run: |
          git config user.name "xueqing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): close root paging audit gaps"
          git push origin HEAD:ux/navigation-architecture-v2
