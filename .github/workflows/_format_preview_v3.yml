name: Temporary format preview v3

on:
  push:

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: flutter pub get
      - run: |
          dart format .
          git diff --no-ext-diff --unified=4
