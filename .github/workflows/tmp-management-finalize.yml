name: Temporary management final verification

on:
  push:
    branches:
      - ux/simplify-management-and-member-names

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/simplify-management-and-member-names
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply proposed polish and verified test adjustments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Reuse the already-reviewed product proposal verbatim. The final pass
          # only removes an analyzer-confirmed dead interface and updates tests
          # to interact with the new section-local actions as a user would.
          lines = Path('.github/workflows/tmp-management-ux-polish.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply teacher-facing UX polish'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          script = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - ') and not line.startswith('          '):
                  break
              if line.startswith('          '):
                  script.append(line[10:])
              elif line.strip() == '':
                  script.append('')
              else:
                  break
          Path('/tmp/apply-management-polish.py').write_text('\n'.join(script) + '\n', encoding='utf-8')
          PY
          python /tmp/apply-management-polish.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          layout = 'lib/features/organization_management/presentation/organization_management_layout.dart'
          replace_once(
              layout,
              '''  const _ManagementEmptyState({\n    required this.title,\n    required this.message,\n    required this.icon,\n    this.action,\n  });\n\n  final String title;\n  final String message;\n  final IconData icon;\n  final Widget? action;\n''',
              '''  const _ManagementEmptyState({\n    required this.title,\n    required this.message,\n    required this.icon,\n  });\n\n  final String title;\n  final String message;\n  final IconData icon;\n''',
          )
          replace_once(
              layout,
              '''                Text(message, style: Theme.of(context).textTheme.bodyMedium),\n                if (action != null) ...[\n                  const SizedBox(height: AppSpacing.sm),\n                  Align(alignment: Alignment.centerLeft, child: action!),\n                ],\n''',
              '''                Text(message, style: Theme.of(context).textTheme.bodyMedium),\n''',
          )
          replace_once(
              'lib/cloud/organization_management_repository.dart',
              "'invalid_teacher_subject_scope_input' => '教学范围信息不完整，请刷新后重试。',",
              "'invalid_teacher_subject_scope_input' => '可教学科配置不完整，请刷新后重试。',",
          )

          test = 'test/features/organization_management_test.dart'
          replace_once(
              test,
              '''    await tester.tap(find.text('添加学生'));\n    await tester.tap(find.text('添加学生'));\n''',
              '''    final addStudent = find.text('添加学生');\n    await tester.ensureVisible(addStudent);\n    await tester.tap(addStudent);\n    await tester.tap(addStudent);\n''',
          )
          replace_once(
              test,
              '''    await tester.tap(find.text('添加学科'));\n    await tester.tap(find.text('添加学科'));\n''',
              '''    final addSubject = find.text('添加学科');\n    await tester.ensureVisible(addSubject);\n    await tester.tap(addSubject);\n    await tester.tap(addSubject);\n''',
          )
          replace_once(
              test,
              '''    await tester.tap(find.text('配置老师可教学科'));\n    await tester.tap(find.text('配置老师可教学科'));\n''',
              '''    final configureTeacherSubjects = find.text('配置老师可教学科');\n    await tester.ensureVisible(configureTeacherSubjects);\n    await tester.tap(configureTeacherSubjects);\n    await tester.tap(configureTeacherSubjects);\n''',
          )
          replace_once(
              test,
              '''    await tester.tap(find.text('添加学科'));\n    await tester.pumpAndSettle();\n\n    expect(find.text('从全局活跃学科目录中选择一个加入本机构。全局目录不会被修改。'), findsOneWidget);\n''',
              '''    final addSubject = find.text('添加学科');\n    await tester.ensureVisible(addSubject);\n    await tester.tap(addSubject);\n    await tester.pumpAndSettle();\n\n    expect(find.text('从全局活跃学科目录中选择一个加入本机构。全局目录不会被修改。'), findsOneWidget);\n''',
          )
          replace_once(
              test,
              '''      await tester.tap(find.text('配置老师可教学科'));\n      await tester.pumpAndSettle();\n      expect(find.text('配置老师可教学科'), findsOneWidget);\n''',
              '''      final configureTeacherSubjects = find.text('配置老师可教学科');\n      await tester.ensureVisible(configureTeacherSubjects);\n      await tester.tap(configureTeacherSubjects);\n      await tester.pumpAndSettle();\n      expect(\n        find.descendant(\n          of: find.byType(AlertDialog),\n          matching: find.text('配置老师可教学科'),\n        ),\n        findsOneWidget,\n      );\n''',
          )
          PY

      - run: flutter pub get

      - name: Format
        run: dart format lib/cloud/organization_management_repository.dart lib/features/organization_management/presentation lib/features/teacher_workspace/presentation/teacher_workspace_page.dart test/features/organization_management_test.dart test/features/teacher_workspace_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit verified final polish and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/tmp-management-ux-polish.yml
          rm -f .github/workflows/tmp-management-finalize.yml
          rm -f tmp-management-analyze.txt
          rm -f tmp-management-test.txt
          rm -f tmp-management-test-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify teacher-facing management actions"
          git push origin HEAD:ux/simplify-management-and-member-names
