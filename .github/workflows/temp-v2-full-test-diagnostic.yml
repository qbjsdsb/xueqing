name: Temporary V2 full test diagnostic

on:
  push:
    branches:
      - ui/v2-visual-refinement
    paths:
      - .github/diagnostic-trigger

permissions:
  contents: write

jobs:
  diagnose:
    name: Locate stale V2 test contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ui/v2-visual-refinement

      - name: Locate stale test contracts
        shell: bash
        run: |
          {
            echo '--- 44dp expectations ---'
            grep -R -n -F "minimumSize: const Size(0, 44)" test || true
            echo '--- recent students expectations ---'
            grep -R -n -F "const _SectionTitle(title: '最近学生')" test || true
            echo '--- primary container expectations ---'
            grep -R -n -F "primaryContainer" test/app test/features || true
          } > .github/test-contract-locations.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/test-contract-locations.txt
          git commit -m "chore: locate stale V2 test contracts"
          git push origin HEAD:ui/v2-visual-refinement
