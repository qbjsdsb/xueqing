name: Temporary grouped teacher subjects UX

on:
  push:
    branches:
      - ux/group-teacher-subjects-clean-workspace

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ux/group-teacher-subjects-clean-workspace
          fetch-depth: 0
      - name: Apply exact UX patch
        run: python tools/tmp_apply_grouped_teacher_subjects.py
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/features/teacher_workspace/presentation/teacher_workspace_page.dart lib/features/organization_management/presentation/organization_management_areas.dart lib/features/organization_management/presentation/organization_management_rows.dart test/features/organization_management_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Run focused tests
        run: flutter test test/features/organization_management_test.dart test/features/teacher_workspace_test.dart
      - name: Remove temporary patch machinery
        run: git rm tools/tmp_apply_grouped_teacher_subjects.py .github/workflows/tmp-apply-grouped-teacher-subjects.yml
      - name: Commit verified UX changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/teacher_workspace/presentation/teacher_workspace_page.dart \
                  lib/features/organization_management/presentation/organization_management_areas.dart \
                  lib/features/organization_management/presentation/organization_management_rows.dart \
                  test/features/organization_management_test.dart
          git diff --cached --quiet && { echo "No verified product diff produced"; exit 1; }
          git commit -m "ux: group teacher subjects and clean workspace"
          git push origin HEAD:ux/group-teacher-subjects-clean-workspace
