name: Temporary Organization Management quiet density

on:
  push:
    branches:
      - ui/management-quiet-density
    paths:
      - .github/management-quiet-density-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout density branch
        uses: actions/checkout@v6
        with:
          ref: ui/management-quiet-density
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply management density patch
        run: python .github/scripts/apply_management_quiet_density.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/organization_management/presentation/organization_management_areas.dart \
            lib/features/organization_management/presentation/organization_management_rows.dart \
            test/features/management_visual_density_test.dart

      - name: Check diff whitespace
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run management regression tests
        run: |
          flutter test \
            test/features/management_visual_density_test.dart \
            test/features/organization_management_test.dart \
            test/features/v2_visual_foundation_contract_test.dart \
            test/features/v2_page_rhythm_test.dart \
            test/features/v2_organization_workspace_test.dart

      - name: Remove one-time patch machinery
        run: |
          rm -f .github/scripts/apply_management_quiet_density.py
          rm -f .github/workflows/temp-management-quiet-density.yml
          rm -f .github/management-quiet-density-trigger

      - name: Commit management density polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "polish(ui): quiet Organization Management density"
          git push origin HEAD:ui/management-quiet-density
